document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e2648800-52c7-4418-9add-c5809b8c4bf9\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* fallback */\n@font-face {\n  font-family: 'Material Symbols Outlined';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"52b5fab4-9eb9-48be-a25b-aa09292ce28e\") format('woff2');\n}\n\n.material-symbols-outlined {\n  font-family: 'Material Symbols Outlined';\n  font-weight: normal;\n  font-style: normal;\n  font-size: 24px;\n  line-height: 1;\n  letter-spacing: normal;\n  text-transform: none;\n  display: inline-block;\n  white-space: nowrap;\n  word-wrap: normal;\n  direction: ltr;\n  -webkit-font-feature-settings: 'liga';\n  -webkit-font-smoothing: antialiased;\n}\n<\u002Fstyle>\n<style>\n  body { margin:0; background:#08090B; }\n  a { color:#FFB020; } a:hover { color:#FFC658; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<section style=\"display:flex;flex-direction:column;gap:32px;padding:40px;background:#08090B;font-family:system-ui,Roboto,sans-serif;color:#F2F5F8\">\n\n  <header style=\"display:flex;flex-direction:column;gap:12px;max-width:920px\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.1em;padding:4px 9px;border-radius:6px;background:#FFB020;color:#14181D\">V2<\u002Fspan>\n      <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#98A2AE\">recut from the shipped defaults · 2026-09-02<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"margin:0;font-size:28px;font-weight:700;letter-spacing:-0.02em\">The accent palette, two tiers<\u002Fh1>\n    <p style=\"margin:0;font-size:15px;line-height:1.55;color:#98A2AE;text-wrap:pretty\">Every swatch below is a <strong style=\"color:#F2F5F8;font-weight:600\">shipped sRGB value<\u002Fstrong> — hex badges and <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:13px\">rgba(r,g,b,a)<\u002Fspan> washes, at the panel-tuned alphas. Nothing here needs a colour function the panel cannot parse, so what you see is what renders. Two things are new: a <strong style=\"color:#F2F5F8;font-weight:600\">brand tier<\u002Fstrong> alongside the identity ring, and a <strong style=\"color:#F2F5F8;font-weight:600\">derived ink token<\u002Fstrong> that the brand tier cannot do without.<\u002Fp>\n  <\u002Fheader>\n\n  <div style=\"max-width:920px;background:#0E1117;border:1px solid #FFB020;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#FFB020\">The finding that drove this<\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;line-height:1.55;color:#98A2AE;text-wrap:pretty\">I ran every likely TV and speaker brand through the existing generator — badge <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">oklch(0.68 0.15 H)<\u002Fspan>, hue taken from the brand. It fails, and not narrowly:<br><br><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:#F2F5F8\">Fire TV #ff9900 → #d6810e<\u002Fspan> &nbsp;·&nbsp; <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:#F2F5F8\">Netflix #e50914 → #e66f62<\u002Fspan> &nbsp;·&nbsp; <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:#F2F5F8\">Samsung #1428a0 → #6e93f4<\u002Fspan><br><br>Amazon’s orange becomes mud, Netflix red becomes salmon, Samsung’s deep blue becomes periwinkle. Worse, <strong style=\"color:#F2F5F8;font-weight:600\">Samsung, Google TV and Disney+ all normalise to the same badge<\u002Fstrong> — #6e93f4, #5f97f4, #6a94f4 — three brands, one colour, because pinning L and C throws away everything except hue and they are all blue.<br><br>The diagnosis: <strong style=\"color:#F2F5F8;font-weight:600\">brand identity lives in lightness and chroma as much as in hue.<\u002Fstrong> Samsung’s blue <em>is<\u002Fem> dark (L 0.36). Netflix red <em>is<\u002Fem> saturated (C 0.235). The uniformity law that makes the identity ring work is precisely what destroys a brand. So the answer is not a better ring — it is a second tier with its own law.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;background:#171E27;color:#FFB020;border:1px solid #2A3340\">1<\u002Fspan><h2 style=\"margin:0;font-size:18px;font-weight:700\">Two tiers, two laws<\u002Fh2><\u002Fdiv>\n    <div style=\"max-width:920px;display:flex;flex-wrap:wrap;gap:16px\">\n      <div style=\"flex:1;min-width:400px;background:#0E1117;border:1px solid #1E2631;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:15px;font-weight:600\">Identity tier — a hue ring<\u002Fdiv>\n        <div style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#FFB020\">law: no slot may be louder than another<\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#98A2AE;text-wrap:pretty\">A mnemonic the user assigns. The colour means nothing except “this row, not that row”, so what matters is even weight and clean hue separation. Fixed L and C, hue is the only variable, two reserved arcs. The law is <strong style=\"color:#F2F5F8;font-weight:600\">unchanged from V1<\u002Fstrong> — it was right for this job; the membership is not fixed, and §8 adds one.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:400px;background:#0E1117;border:1px solid #1E2631;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:15px;font-weight:600\">Brand tier — a catalogue<\u002Fdiv>\n        <div style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#FFB020\">law: the brand must survive recognisably<\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#98A2AE;text-wrap:pretty\">Not assigned, <em>recognised<\u002Fem>. Amazon orange is doing a job no identity slot can do: it is already in the user’s head. Uniformity is the wrong goal here — these colours are unequal by nature and that is the whole point. Curated list, not a picker.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;max-width:920px;font-size:13px;line-height:1.55;color:#98A2AE;text-wrap:pretty\">Both tiers feed the same three tokens and the same treatments. A slot is still a <strong style=\"color:#F2F5F8;font-weight:600\">name<\u002Fstrong> in config — <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">accent: \"indigo\"<\u002Fspan> or <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">accent: \"firetv\"<\u002Fspan>, one namespace, no new key — and a custom hex stays second-class and never zapped. Nothing downstream of the generator changes.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;background:#171E27;color:#FFB020;border:1px solid #2A3340\">2<\u002Fspan><h2 style=\"margin:0;font-size:18px;font-weight:700\">Identity tier<\u002Fh2><span style=\"font-size:13px;color:#98A2AE\">shipped values from tokens.css · unchanged<\u002Fspan><\u002Fdiv>\n    <div style=\"max-width:1150px;display:flex;flex-wrap:wrap;gap:10px\">\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(181,73,78,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#e66d71\"><\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Coral<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#e66d71 · 181,73,78<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(91,127,5,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#7fa834\"><\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Fern<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#7fa834 · 91,127,5<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(48,134,57,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#54b05a\"><\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Jade<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#54b05a · 48,134,57<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(86,105,194,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#7990f4\"><\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Indigo<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#7990f4 · 86,105,194<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(126,92,183,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#a681e7\"><\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Violet<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#a681e7 · 126,92,183<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(154,80,157,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#c775c9\"><\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Orchid<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#c775c9 · 154,80,157<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(173,73,121,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#dd6da0\"><\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Rose<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#dd6da0 · 173,73,121<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(113,113,113,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#989898\"><\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Slate<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#989898 · default<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;background:#171E27;color:#FFB020;border:1px solid #2A3340\">3<\u002Fspan><h2 style=\"margin:0;font-size:18px;font-weight:700\">Brand tier<\u002Fh2><span style=\"font-size:13px;color:#98A2AE\">fourteen slots · badge is the brand, wash is the system<\u002Fspan><\u002Fdiv>\n\n    <div style=\"max-width:920px;background:#0E1117;border:1px solid #1E2631;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#98A2AE\">The rule<\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;line-height:1.55;color:#98A2AE;text-wrap:pretty\"><strong style=\"color:#F2F5F8;font-weight:600\">Badge keeps the brand. Wash stays uniform.<\u002Fstrong> They are two different jobs and that is why one law could not cover both.<br><br><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:#FFB020\">badge<\u002Fspan> = the brand’s own colour, with L merely <em>clamped<\u002Fem> to 0.46–0.86 and C to its gamut ceiling. A clamp, not a pin — so it only engages where a raw brand would be unusable on a dark tile. In practice it fires on three of fourteen — Samsung (L 0.36 → 0.46), Roku and Disney+ (both 0.45 → 0.46) lift out of near-black. LG sits exactly on the bound and, with YouTube, moves a single RGB unit from chroma clipping. Nothing else moves at all. Fire TV ships as <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:#F2F5F8\">#ff9900<\u002Fspan> exactly, Sonos sand as <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:#F2F5F8\">#d8a158<\u002Fspan> exactly, Apple as white.<br><br><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:#FFB020\">wash<\u002Fspan> = <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">L 0.55, C ceiling, brand hue<\u002Fspan> — the identity tier’s own formula. The wash is a large tinted area under text and under the focus ring, and there the uniformity law still holds absolutely: no tile may be heavier than its neighbour regardless of which brand it names.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"max-width:1150px;display:flex;flex-wrap:wrap;gap:10px\">\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(162,95,0,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#ff9900;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:20px;color:#14181D\">tv<\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Fire TV<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#ff9900 · dark ink<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(113,113,113,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:20px;color:#14181D\">tv<\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Apple TV<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#ffffff · dark ink<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(62,111,194,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#4285f4;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:20px;color:#14181D\">cast<\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Google TV<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#4285f4 · dark ink<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(76,108,195,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#2848c0;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:20px;color:#ffffff\">tv<\u002Fspan><\u002Fspan><span style=\"display:flex;f span><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(72,109,195,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#1541d4;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:20px;color:#ffffff\">movie<\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Disney+<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#FFB020\">#1541d4 · white ink<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:64px;background:rgba(181,75,63,0.4);align-items:center;justify-content:center\"><span style=\"width:36px;height:36px;border-radius:50%;background:#ff0001;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:20px;color:#14181D\">smart_display<\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">YouTube<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#ff0001 · dark ink<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"max-width:920px;background:#0E1117;border:1px solid #1E2631;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#98A2AE\">Two consequences, both worth stating out loud<\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;line-height:1.55;color:#98A2AE;text-wrap:pretty\"><strong style=\"color:#F2F5F8;font-weight:600\">The amber reservation does not apply to a brand badge.<\u002Fstrong> Your instinct was right and the numbers back it: Fire TV sits 9° from the ring’s hue, Sonos 2°, Plex 3°. But the reservation was written for a <em>wash<\u002Fem> — a large area the ring sits on top of — and never needed to cover a 36px disc that sits 14px inside the tile and never touches the ring. Refusing Amazon its orange would be a worse product than the conflict it avoids.<br><br>The wash is safe too, and the reason is round 8. At the panel-tuned <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">0.4<\u002Fspan> the Fire TV wash composites to <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:#F2F5F8\">#4f3817<\u002Fspan> and still gives the ring <strong style=\"color:#F2F5F8;font-weight:600\">6.0:1<\u002Fstrong>. Dropping 0.5/0.75 → 0.3/0.4 retired the gamut half of that reservation without anyone noticing. Keep it for the identity ring — a user-picked amber tile is confusing whatever its contrast — but the brand tier is not arbitrary, and there the arc is open. The one number to watch is the preset pool at 0.75, where the same wash falls to 3.8:1: fine for a 2px ring, and the reason I would not raise that alpha again.<br><br><strong style=\"color:#F2F5F8;font-weight:600\">The wash cannot tell brands apart.<\u002Fstrong> Google TV, Samsung and Disney+ produce 62,111,194 / 76,108,195 / 72,109,195 — effectively one blue, because they <em>are<\u002Fem> one blue at the wash’s fixed L and C. This is not a defect to fix; it is what tells you where each tier belongs. In the brand tier the <strong style=\"color:#F2F5F8;font-weight:600\">mark is the identity and the wash is only atmosphere<\u002Fstrong>, so brand slots want the <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">icon-*<\u002Fspan> styles where the logo is visible. A <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">title-*<\u002Fspan> preset hides the mark and leans on the wash, which is exactly the case the wash cannot serve — that combination should stay possible and stay off by default.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;background:#171E27;color:#FFB020;border:1px solid #2A3340\">4<\u002Fspan><h2 style=\"margin:0;font-size:18px;font-weight:700\">The ink token<\u002Fh2><span style=\"font-size:13px;color:#98A2AE\">your foreground question · not overkill, but derive it<\u002Fspan><\u002Fdiv>\n    <div style=\"max-width:920px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n      <div style=\"flex:1;min-width:380px;background:#0E1117;border:1px solid #1E2631;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#98A2AE\">Short answer<\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.55;color:#98A2AE;text-wrap:pretty\">You need it, you need exactly <strong style=\"color:#F2F5F8;font-weight:600\">one<\u002Fstrong> of it, and it should be <strong style=\"color:#F2F5F8;font-weight:600\">computed, never authored<\u002Fstrong>.<br><br>It was overkill in V1 and is not now. Every identity badge sits at L 0.68, so <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--accent-ink<\u002Fspan> won everywhere by roughly 2× and a paired token would have been dead weight. The brand tier breaks that: Sony is black, Apple is white, and Samsung, LG, Roku, Disney+ and Netflix all sit below the crossover. Five of fourteen slots need light ink.<br><br>So the generator emits a third line per slot, <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:#FFB020\">--id-&lt;slot&gt;-i<\u002Fspan>, chosen by whichever of <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--accent-ink<\u002Fspan> or white scores higher WCAG contrast against the badge. Not a decision anyone authors — a measurement, fenced by the same probe that byte-compares the rest.<br><br>Worst case in the whole set is YouTube at <strong style=\"color:#F2F5F8;font-weight:600\">4.46:1<\u002Fstrong>, and a badge glyph is a 20px icon, not body text. Every other slot clears 4.8:1.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"width:300px;background:#0E1117;border:1px solid #1E2631;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#98A2AE\">Crossover · L 0.58<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px\">\n          <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:34px;height:22px;border-radius:5px;background:#6d6d6d\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#5B6674\">L 0.50<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#F2F5F8\">white 6.0<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:34px;height:22px;border-radius:5px;background:#7a7a7a\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#5B6674\">L 0.55<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#F2F5F8\">white 4.9<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:34px;height:22px;border-radius:5px;background:#888888;box-shadow:0 0 0 1px #FFB020\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#FFB020\">L 0.58<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#FFB020\">tie ≈ 4.2<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:34px;height:22px;border-radius:5px;background:#959595\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#5B6674\">L 0.60<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#F2F5F8\">dark 4.5<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:34px;height:22px;border-radius:5px;background:#b0b0b0\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#5B6674\">L 0.68<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#F2F5F8\">dark 6.1<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;line-height:1.5;color:#5B6674;text-wrap:pretty\">One threshold, no per-slot taste. The identity ring sits at 0.68 — comfortably dark-ink, so nothing about it changes.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;background:#171E27;color:#FFB020;border:1px solid #2A3340\">5<\u002Fspan><h2 style=\"margin:0;font-size:18px;font-weight:700\">Activities, at the shipped defaults<\u002Fh2><span style=\"font-size:13px;color:#98A2AE\">325 × 100 · bloom 180×100 at 64px, fade 72% · 0.3 / 0.4<\u002Fspan><\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n\n      <div style=\"width:359px;background:#0E1117;borde idden;text-overflow:ellipsis\">Watch Apple TV<\u002Fspan><span style=\"font-size:13px;color:#98A2AE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Off · press to start<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"width:325px;height:100px;background:radial-gradient(180px 100px at 64px 50%,rgba(155,100,0,0.3),rgba(155,100,0,0) 72%) no-repeat border-box,#171E27;border-radius:12px;padding:12px 14px;box-sizing:border-box;display:flex;align-items:center;gap:12px\"><span style=\"width:40px;height:40px;flex:none;border-radius:50%;background:#d8a158;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:22px;color:#14181D\">speaker<\u002Fspan><span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Listen to Sonos<\u002Fspan><span style=\"font-size:13px;color:#98A2AE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Off · press to start<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#98A2AE;text-wrap:pretty\">The badge-anchored radial, panel-tuned: 180×100 centred at 64px, colour gone by 72% so the text sits on bare tile at full contrast. Top tile is running at 0.4 with the accent status line; the other two rest at 0.3.<br><br>Amber, white and sand in one column — three slots inside 10° of the focus ring, and the focused tile is still unambiguous. <strong style=\"color:#F2F5F8;font-weight:600\">The ring reads as a ring because of shape and position, not hue.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"width:359px;background:#0E1117;border:1px solid #1E2631;border-radius:12px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-size:15px;font-weight:600\">Tint<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#98A2AE\">0.15 / 0.25 · status on --text<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"width:325px;height:100px;background:rgba(76,108,195,0.25) no-repeat border-box,#171E27;border-radius:12px;padding:12px 14px;box-sizing:border-box;display:flex;align-items:center;gap:12px\"><span style=\"width:40px;height:40px;flex:none;border-radius:50%;background:#2848c0;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:22px;color:#ffffff\">tv<\u002Fspan><span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Watch Samsung<\u002Fspan><span style=\"font-size:13px;color:#FFB020;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">On · hold to end<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"width:325px;height:100px;background:rgba(181,75,65,0.15) no-repeat border-box,#171E27;border:2px solid #FFB020;border-radius:12px;padding:10px 12px;box-sizing:border-box;display:flex;align-items:center;gap:12px\"><span style=\"width:40px;height:40px;flex:none;border-radius:50%;background:#e50914;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:22px;color:#ffffff\">movie<\u002Fspan><span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Watch Netflix<\u002Fspan><span style=\"font-size:13px;color:#F2F5F8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Off · press to start<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"width:325px;height:100px;background:rgba(131,89,179,0.15) no-repeat border-box,#171E27;border-radius:12px;padding:12px 14px;box-sizing:border-box;display:flex;align-items:center;gap:12px\"><span style=\"width:40px;height:40px;flex:none;border-radius:50%;background:#7321b6;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:22px;color:#ffffff\">tv<\u002Fspan><span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Watch Roku<\u002Fspan><span style=\"font-size:13px;color:#F2F5F8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Off · press to start<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#98A2AE;text-wrap:pretty\">A flat wash covers the whole tile, so the status line rides <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--text<\u002Fspan> rather than <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--dim<\u002Fspan> — the A1 rule, and the price is that name and status sit at one weight.<br><br>Three white-ink badges here. Worth noting how much work the ink token does at this size: a dark badge on a barely-tinted tile is the case where a wrong foreground stops being cosmetic and starts hiding the glyph.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"width:359px;background:#0E1117;border:1px solid #1E2631;border-radius:12px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-size:15px;font-weight:600\">Basic<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#98A2AE\">the silent default<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"width:325px;height:100px;background:#171E27;border-radius:12px;padding:12px 14px;box-sizing:border-box;display:flex;align-items:center;gap:12px\"><span style=\"width:40px;height:40px;flex:none;border-radius:50%;background:#2A3340;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:22px;color:#ff9900\">tv<\u002Fspan><span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Watch Fire TV<\u002Fspan><span style=\"font-size:13px;color:#FFB020;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">On · hold to end<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"width:325px;height:100px;background:#171E27;border:2px solid #FFB020;border-radius:12px;padding:10px 12px;box-sizing:border-box;display:flex;align-items:center;gap:12px\"><span style=\"width:40px;height:40px;flex:none;border-radius:50%;background:#2A3340;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:22px;color:#1db954\">music_note<\u002Fspan><span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Listen to Spotify<\u002Fspan><span style=\"font-size:13px;color:#98A2AE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Off · press to start<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"width:325px;height:100px;background:#171E27;border-radius:12px;padding:12px 14px;box-sizing:border-box;display:flex;align-items:center;gap:12px\"><span style=\"width:40px;height:40px;flex:none;border-radius:50%;background:#2A3340;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:22px;color:#4285f4\">cast<\u002Fspan><span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Watch Google TV<\u002Fspan><span style=\"font-size:13px;color:#98A2AE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Off · press to start<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#98A2AE;text-wrap:pretty\">Today’s tile: no wash, and the slot only tints the glyph via <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--tacc<\u002Fspan>. The badge plate stays <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--tile-hi<\u002Fspan>, so no ink question arises.<br><br>Keep this in view when judging the other two. <strong style=\"color:#F2F5F8;font-weight:600\">A brand glyph on a neutral plate is already most of the recall<\u002Fstrong> — the honest question a wash must answer is whether it adds anything beyond what the coloured mark did for free.<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;background:#171E27;color:#FFB020;border:1px solid #2A3340\">6<\u002Fspan><h2 style=\"margin:0;font-size:18px;font-weight:700\">Presets<\u002Fh2><span style=\"font-size:13px;color:#98A2AE\">102 × 60 three-up · pool 88% × 117% at 20% 100%, fade 78%, alpha 0.75<\u002Fspan><\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n      <div style=\"width:359px;background:#0E1117;border:1px solid #1E2631;border-radius:12px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-size:15px;font-weight:600\">Title + bloom<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#FFB020\">identity slots<\u002Fspan><\u002Fdiv>\n        <div style=\"width:325px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px\">\n          <span style=\"height:60px;background:radial-gradient(88% 117% at 20% 100%,rgba(173,73,121,0.75),rgba(173,73,121,0) 78%) no-repeat border-box,#171E27;border-radius:12px;padding:6px 10px 2px;box-sizing:border-box;display:flex;flex-direction:column\"><span style=\"height:18px;display:flex;justify-content:flex-end;font-family:'Material Symbols Outlined';font-size:18px;line-height:1;color:#dd6da0\">queue_music<\u002Fspan><span style=\"font-size:14px;font-weight:600;line-height:1.2;color:#F2F5F8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-wrap:break-word\">Wednesday Chill<\u002Fspan><\u002Fspan>\n          <span style=\"height:60px;background:radial-gradient(88% 117% at 20% 100%,rgba(154,80,157,0.75),rgba(154,80,157,0) 78%) no-repeat border-box,#171E27;border:2px solid #FFB020;border-radius:12px;padding:4px 8px 0;box-sizing:border-box;display:flex;flex-direction:column\"><span style=\"height:18px;display:flex;justify-content:flex-end;font-family:'Material Symbols Outlined';font-size:18px;line-height:1;color:#c775c9\">queue_music<\u002Fspan><span style=\"font-size:14px;font-weight:600;line-height:1.2;color:#F2F5F8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-wrap:break-word\">Concentration Mix<\u002Fspan><\u002Fspan>\n          <span style=\"height:60px;background:radial-gradient(88% 117% at 20% 100%,rgba(181,73,78,0.75),rgba(181,73,78,0) 78%) no-repeat border-box,#171E27;border-radius:12px;padding:6px 10px 2px;box-sizing:border-box;display:flex;flex-direction:column\"><span style=\"height:18px;display:flex;justify-content:flex-end;font-family:'Material Symbols Outlined';font-size:18px;line-height:1;color:#e66d71\">queue_music<\u002Fspan><span style=\"font-size:14px;font-weight:600;line-height:1.2;color:#F2F5F8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-wrap:break-word\">Daily Mix 1<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#98A2AE;text-wrap:pretty\">The name leads at 14/600, two lines, top-aligned under an 18px slot-coloured mark that gets <strong style=\"color:#F2F5F8;font-weight:600\">its own row<\u002Fstrong>. The 60px cell divides exactly: 6px pad, 18px mark, 34px label.<br><br><strong style=\"color:#F2F5F8;font-weight:600\">This is a change from the shipped rule, and it is the honest one.<\u002Fstrong> A 102px cell cannot hold an 18px corner mark <em>and<\u002Fem> a full two-line label — the two are mutually exclusive at this width, and the shipped layout only appears to manage it because the fixtures are short. Absolute positioning reserves nothing, so “Concentration Mix” ran its first line straight under the mark. A right float reserves correctly but eats 24px of a ~77px line, so any first word past six characters pushes the whole block below the float and costs a line. Both fail on the same names; only the mark row survives them, which is why the specimens here are deliberately long.<br><br>The cost is the bottom-aligned baseline: one- and two-line names no longer share one. In exchange both lines are full width and the caption is true by construction rather than by luck.<br><br>One more thing the narrow cell forces: the label needs <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">word-wrap:break-word<\u002Fspan>. The content box is 82px, and a single word wider than that — “Concentration” measures 90px at 14/600, about eleven characters — cannot wrap and so overflows horizontally. <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">-webkit-line-clamp<\u002Fspan> ellipsises vertical overflow only, so the tail was being cut with no marker at all. Breaking mid-word is not pretty, but a visibly broken word is honest where a silently shortened one is not.<br><br>Three cells of identical type are hard to scan and three colours are not — at 102px wide the wash does work no amount of type could. A preset has no running state, so it always uses the lifted alpha. Cells keep their band’s height; text styles never shrink a tile.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"width:359px;background:#0E1117;border:1px solid #1E2631;border-radius:12px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-size:15px;font-weight:600\">Icon bloom<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#FFB020\">where brand slots belong<\u002Fspan><\u002Fdiv>\n        <div style=\"width:325px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n          <span style=\"height:60px;background:radial-gradient(88% 117% at 20% 100%,rgba(34,135,64,0.75),rgba(34,135,64,0) 78%) no-repeat border-box,#171E27;border-radius:12px;padding:8px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px\"><span style=\"font-family:'Material Symbols Outlined';font-size:24px;line-height:1;color:#1db954\">music_note<\u002Fspan><span style=\"font-size:11px;line-height:1.1;color:#F2F5F8;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Spotify<\u002Fspan><\u002Fspan>\n          <span style=\"height:60px;background:radial-gradient(88% 117% at 20% 100%,rgba(181,75,65,0.75),rgba(181,75,65,0) 78%) no-repeat border-box,#171E27;border:2px solid #FFB020;border-radius:12px;padding:6px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px\"><span style=\"font-family:'Material Symbols Outlined';font-size:24px;line-height:1;color:#e50914\">movie<\u002Fspan><span style=\"font-size:11px;line-height:1.1;color:#F2F5F8;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Netflix<\u002Fspan><\u002Fspan>\n          <span style=\"height:60px;background:radial-gradient(88% 117% at 20% 100%,rgba(150,103,0,0.75),rgba(150,103,0,0) 78%) no-repeat border-box,#171E27;border-radius:12px;padding:8px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px\"><span style=\"font-family:'Material Symbols Outlined';font-size:24px;line-height:1;color:#e5a00d\">movie<\u002Fspan><span style=\"font-size:11px;line-height:1.1;color:#F2F5F8;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Plex<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#98A2AE;text-wrap:pretty\">The mark leads, tinted by <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--tacc<\u002Fspan>, over the same pool. This is the pairing to recommend in the Studio: a brand slot puts its recognition in the glyph, which the wash cannot carry.<br><br>Note the middle cell — Netflix red under an amber ring at 0.75, the highest alpha in the system. It holds because the pool is anchored bottom-left and the ring is a full outline; they occupy different parts of the cell.<br><br>Label rides <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--preset-lbl<\u002Fspan> (11px) at the global <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--fw-1<\u002Fspan>. Set icons are ink-fit at render, so a wordmark sits at the same optical size as a Material glyph.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;background:#171E27;color:#FFB020;border:1px solid #2A3340\">7<\u002Fspan><h2 style=\"margin:0;font-size:18px;font-weight:700\">The app catalogue<\u002Fh2><span style=\"font-size:13px;color:#98A2AE\">all sixteen, resolved · badge · ink · wash<\u002Fspan><\u002Fdiv>\n\n    <div style=\"max-width:920px;background:#0E1117;border:1px solid #FFB020;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#FFB020\">Run the whole list and the tier boundary moves<\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;line-height:1.55;color:#98A2AE;text-wrap:pretty\">Sixteen apps produce <strong style=\"color:#F2F5F8;font-weight:600\">21 wash collisions<\u002Fstrong> under 15° of hue. Not a few — the set has essentially two colours in it:<br><br><strong style=\"color:#F2F5F8;font-weight:600\">One blue<\u002Fstrong> — Paramount+, Max, Disney+, BritBox and PBS land within 10° of each other; Max and Disney+ are 0.5° apart. <strong style=\"color:#F2F5F8;font-weight:600\">One red<\u002Fstrong> — Netflix, YouTube, YouTube TV, Fubo and ESPN, all inside 9°; YouTube and YouTube TV are the same brand colour by definition. Hulu and Spotify are one green. That leaves Prime cyan, Plex gold, and two achromatics.<br><br>And the badge does not rescue it, which is the part that surprised me: at raw brand values Netflix #e50914, YouTube #ff0001 and ESPN #d2001f are three reds nobody will tell apart on a 3.2″ panel either. <strong style=\"color:#F2F5F8;font-weight:600\">Brand colour cannot differentiate a streaming list.<\u002Fstrong> That is a fact about the category, not a flaw in the palette — these companies all chose red or blue.<br><br>So colour’s job in the app grid is <em>recognition, not separation<\u002Fem>: “the red one” plus the glyph identifies Netflix even though ESPN is also red. Which sets the real rule — <strong style=\"color:#F2F5F8;font-weight:600\">apps default to <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">icon-basic<\u002Fspan><\u002Fstrong>, the glyph tinted by <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--tacc<\u002Fspan> and no wash at all. Washes belong to activities, where there are four tiles and the user picked the colours himself. A sixteen-tile grid of clustered brand washes is worse than no wash, because it implies a distinction it cannot deliver.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"max-width:1150px;display:flex;flex-wrap:wrap;gap:10px\">\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:60px;background:rgba(181,75,65,0.4);align-items:center;justify-content:center\"><span style=\"width:34px;height:34px;border-radius:50%;background:#e50914;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:19px;color:#ffffff\">movie<\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Netflix<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#e50914 · white<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"width:132px;background:#171E27;border-radius:12px;overflow:hidden\"><span style=\"display:flex;height:60px;background:rgba(0,124,167,0.4);align-items:center;justify-content:center\"><span style=\"width:34px;height:34px;border-radius:50%;background:#00a8e1;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:19px;color:#14181D\">play_circle<\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px\"><span style=\"font-size:13px;font-weight:600\">Prime Video<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">#00a8e1 · dark<\u002Fspan><\u002Fspan><\u002Fdiv>\n v style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-size:15px;font-weight:600\">Green<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#98A2AE\">= Jade · alias it<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <span style=\"flex:1;display:flex;flex-direction:column;gap:5px\"><span style=\"height:52px;border-radius:10px;background:#4caf50\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">HA #4caf50 · H 144.2<\u002Fspan><\u002Fspan>\n          <span style=\"flex:1;display:flex;flex-direction:column;gap:5px\"><span style=\"height:52px;border-radius:10px;background:#56b059\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">normalised #56b059<\u002Fspan><\u002Fspan>\n          <span style=\"flex:1;display:flex;flex-direction:column;gap:5px\"><span style=\"height:52px;border-radius:10px;background:#54b05a\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#FFB020\">Jade #54b05a<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#98A2AE;text-wrap:pretty\"><strong style=\"color:#F2F5F8;font-weight:600\">The same colour to within one degree of hue and two RGB units.<\u002Fstrong> Jade was derived from the green gamut window, and HA’s green sits in the middle of it — two independent processes landed on one value. Nothing to add.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"width:290px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-size:15px;font-weight:600\">Blue<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#FFB020\">genuinely new · add it<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <span style=\"flex:1;display:flex;flex-direction:column;gap:5px\"><span style=\"height:52px;border-radius:10px;background:#2196f3\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">HA #2196f3 · H 248.8<\u002Fspan><\u002Fspan>\n          <span style=\"flex:1;display:flex;flex-direction:column;gap:5px\"><span style=\"height:52px;border-radius:10px;background:#419df0\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#FFB020\">Azure #419df0<\u002Fspan><\u002Fspan>\n          <span style=\"flex:1;display:flex;flex-direction:column;gap:5px\"><span style=\"height:52px;border-radius:10px;background:#7990f4\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">Indigo #7990f4<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#98A2AE;text-wrap:pretty\"><strong style=\"color:#F2F5F8;font-weight:600\">23° from Indigo and clearly a different colour<\u002Fstrong> — the sky blue the ring never had, because the palette avoided the cyans and stopped at Indigo. It clears the reserved 170–240 arc by 9°, holds the full 0.15 / 0.14 chroma, and takes dark ink at 6.2:1. It is a legitimate ninth slot.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"width:290px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-size:15px;font-weight:600\">Yellow<\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:11px;color:#98A2AE\">cannot exist · refuse<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <span style=\"flex:1;display:flex;flex-direction:column;gap:5px\"><span style=\"height:52px;border-radius:10px;background:#ffeb3b\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">HA #ffeb3b · L 0.93<\u002Fspan><\u002Fspan>\n          <span style=\"flex:1;display:flex;flex-direction:column;gap:5px\"><span style=\"height:52px;border-radius:10px;background:#aa9b00\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#FFB020\">at L 0.68 · olive<\u002Fspan><\u002Fspan>\n          <span style=\"flex:1;display:flex;flex-direction:column;gap:5px\"><span style=\"height:52px;border-radius:10px;background:#FFB020\"><\u002Fspan><span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;color:#5B6674\">the ring #FFB020<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#98A2AE;text-wrap:pretty\">Disqualified twice over. <strong style=\"color:#F2F5F8;font-weight:600\">Yellow is only yellow at high lightness<\u002Fstrong> — HA’s sits at L 0.93, and forced to our 0.68 it becomes the olive above. And at H 102 it lands <em>inside<\u002Fem> the reserved 40–110 arc: a yellow tile under the amber focus ring, which is the one thing the reservation exists to prevent.<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div style=\"max-width:920px;background:#0E1117;border:1px solid #1E2631;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#98A2AE\">What to do about it<\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;line-height:1.55;color:#98A2AE;text-wrap:pretty\"><strong style=\"color:#F2F5F8;font-weight:600\">Add Azure. Alias <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">red<\u002Fspan> → coral, <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">green<\u002Fspan> → jade, <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">blue<\u002Fspan> → azure.<\u002Fstrong> Eight hues plus Slate — nine slots, up from eight. The aliases matter more than they look: you keep reaching for primary names because <em>that is how people describe colour<\u002Fem>, and “Coral” is a paint chip, not a word anyone types. Accepting <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">accent: \"red\"<\u002Fspan> in config costs one lookup table and removes the friction you have been feeling. Show both names in the Studio picker — <em>Coral (red)<\u002Fem> — so the plain word is discoverable and the palette name stays canonical.<br><br><strong style=\"color:#F2F5F8;font-weight:600\">Yellow gets an alias too, but pointed somewhere honest.<\u002Fstrong> Do not silently map it to olive. Either refuse it with a message naming the reason (“yellow is reserved for focus”) or alias <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">yellow<\u002Fspan> → <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">fern<\u002Fspan>, which is the closest thing the ring can legally offer. My preference is to refuse: it is the one place where a clear error teaches the operator something true about the design.<br><br>Worth noticing <em>why<\u002Fem> these four kept coming to mind — the ring is deliberately a mnemonic set, tuned for even weight and clean separation, and it has no primaries in it by construction. Primary names carry meaning the ring does not: red reads as hot or alarming, green as safe. That instinct is sound for a <strong style=\"color:#F2F5F8;font-weight:600\">semantic<\u002Fstrong> colour, and it is a different job from identity — the same distinction that separated the brand tier. If you find yourself wanting red for a state rather than a name, that is a third tier and we should design it deliberately rather than borrowing a slot.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:920px;background:#0E1117;border:1px solid #1E2631;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#98A2AE\">For the dev<\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;line-height:1.55;color:#98A2AE;text-wrap:pretty\"><strong style=\"color:#F2F5F8;font-weight:600\">One generator change, one new token, no engine change.<\u002Fstrong> <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">tools/gen-identity-palette.mjs<\u002Fspan> gains a brand table — each row a name plus a source hex — and emits the same three lines per slot into the <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">@identity-palette<\u002Fspan> block: <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:#FFB020\">--id-&lt;slot&gt;-b<\u002Fspan> badge hex, <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:#FFB020\">--id-&lt;slot&gt;-w<\u002Fspan> wash triplet, <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px;color:#FFB020\">--id-&lt;slot&gt;-i<\u002Fspan> ink hex. Identity rows keep the existing formula; brand rows use badge = clamp(L, 0.46, 0.86) with C at the gamut ceiling and hue untouched, wash = L 0.55 / C ceiling / brand hue, ink = higher-contrast of <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--accent-ink<\u002Fspan> or white. <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">probe-identity-palette.mjs<\u002Fspan> re-derives all three and byte-compares, so brand values cannot drift either.<br><br><strong style=\"color:#F2F5F8;font-weight:600\">Consumers read <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">-i<\u002Fspan> where they hardcode <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--accent-ink<\u002Fspan> today<\u002Fstrong> — the badge glyph, and any filled chip that takes a slot colour. The Title-mode mark takes <strong style=\"color:#F2F5F8;font-weight:600\">its own 18px row<\u002Fstrong> above the label — not <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">position:absolute<\u002Fspan> (reserves nothing) and not <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">float:right<\u002Fspan> (costs a line once the first word passes six characters). Label keeps <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">-webkit-line-clamp:2<\u002Fspan> <em>and<\u002Fem> needs <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">word-wrap:break-word<\u002Fspan> — clamp handles vertical overflow only, so without the break a single word over 82px (~11 characters at 14/600) is cut horizontally with no ellipsis. The 3-up grid needs <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">minmax(0,1fr)<\u002Fspan> — bare <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">1fr<\u002Fspan> lets an unbreakable word widen its own column and squeeze its siblings. Change the fixtures to long two-line names; the short ones hide all three faults. Every identity slot resolves to the same value it uses now, so that edit is a no-op for existing config and only the brand slots change behaviour.<br><br><strong style=\"color:#F2F5F8;font-weight:600\">Fences to add.<\u002Fstrong> The amber reservation now applies to identity hues only — brand hues are exempt and the probe must say so explicitly, or someone will “fix” Fire TV. Assert every ink pairing clears 4.4:1. Leave <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">--wash-a-on<\u002Fspan> at 0.75: it is the one alpha where an amber wash brings the ring under 4:1.<br><br><strong style=\"color:#F2F5F8;font-weight:600\">Still open.<\u002Fstrong> Whether a brand slot should be <em>inferred<\u002Fem> from the activity’s device rather than picked — tempting, and it is how a Fire TV activity gets its colour for free, but it makes the tile’s appearance depend on integration metadata the user cannot see or override. I would ship it picked, offer inference as a Studio suggestion, and keep the user’s choice authoritative. Brand names in the list are also a maintenance surface the identity ring never had: thirty slots across devices and apps is a starting set, not a schema.<br><br><strong style=\"color:#F2F5F8;font-weight:600\">From §7, two additions.<\u002Fstrong> Apps default to <span style=\"font-family:ui-monospace,'Roboto Mono',monospace;font-size:12px\">icon-basic<\u002Fspan> — no wash — because sixteen brand washes cluster into one blue and one red and imply a distinction they cannot deliver. And the palette fence gains a joint uniqueness assertion: no two entries sharing a glyph may also share a hue family, which is what actually keeps this set legible.<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fsection>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
