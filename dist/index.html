    /* advanced: show a specific attribute instead of the smart summary */
    if (t.attr) {
      const v = s.a[t.attr];
      return v == null ? cap(s.s) : String(v);
    }
    if (dom === "media_player") {
      const detail = s.a.media_title || s.a.source;
      return cap(s.s) + (detail && ACTIVE(s.s) ? " · " + detail : "");
    }
    if (dom === "light")
      return s.s === "on"
        ? "On · " + Math.round((s.a.brightness || 255) / 2.55) + "%" : cap(s.s);
    if (dom === "climate")
      return (s.a.current_temperature != null ? s.a.current_temperature + "° · " : "") + cap(s.s);
    return cap(s.s);
  },
  isOn: e => ACTIVE(st(e).s),
  detailable: true,   /* auto ⚙ trail → the generated detail screen */
  select: (e, t) => {
    const dom = (e || "").split(".")[0];
    const open = () => { const tgt = deviceTarget(t); if (tgt) navigate(tgt); };
    if (t.tap === "none") return;      /* a pure readout */
    if (t.tap === "open") return open();
    const verb =
      t.tap === "toggle" ? () => callService("homeassistant", "toggle", null, e)
      : t.tap === "play_pause" ? () => callService("media_player", "media_play_pause", null, e)
      : DEVICE_VERB[dom] && DEVICE_VERB[dom](e);
    if (verb) return verb();
    open(); /* no verb → the compound page */
  },
  hold: (e, t) => { const tgt = deviceTarget(t); if (tgt) navigate(tgt); },
};

/* SOURCES tile (v0.35, role-governed v0.36) — ONE tile that opens the
   input picker. Tap → the sources:<entity> virtual detail: the live
   source_list as chips, current highlighted, pick → select_source.
   Default entity: $context.source_select — the ROLE decides which
   device owns inputs here (assign it in the activity's Setup; the
   display usually, not the streamer). Unwired role → the stock tile
   hides itself (hide-unwired doctrine). The sub line shows the
   CURRENT input, so the tile doubles as a status readout. */
WIDGETS.sources = {
  sub: (e, t) => {
    const mp = e || resolveEntity(t.entity || "$context.source_select");
    return (mp && st(mp).a.source) || "";
  },
  isOn: () => false,
  select: (e, t) => {
    const mp = e || resolveEntity(t.entity || "$context.source_select");
    if (!mp) { flashBar("No source device wired here"); return; }
    if (!(st(mp).a.source_list || []).length) { flashBar("No inputs reported"); return; }
    navigate("sources:" + mp);
  }
};

/* KSLOT — one slot of THE REMOTE on the key-capture screen (v0.56).
   A physical button described in the Studio's layout builder, waiting
   to learn which raw key it emits. Tap = assign the pending capture.
   Three flavors, one widget: a named slot, a BLANK (a spacer in the
   physical grid — inert), and the 💾 Save tile.

   The tile is deliberately dumb: no entity, no subscription. Its sub
   line reports the raw keys currently routed to it (profile keymap
   plus this session's unsaved assignments), so the grid reads as the
   remote's own legend. isOn lights a slot the moment it has a key —
   at a glance you can see which buttons are still unlearned.
   (Lives in widgets/ because WIDGETS is not defined until
   registry.js — the v0.51.1 lesson.) */
WIDGETS.kslot = {
  /* two chassis-level looks, decided once at build time: a slot with
     no standard glyph wears its NAME at key size (the chassis always
     renders SOME icon — "•" is its fallback — so the class hides it),
     and a blank slot fades to a spacer. */
  wire: (el, t) => {
    if (t.blank) el.classList.add("kblank");
    else if (t.slot && !KEYCAP_GLYPHS[t.slot]) el.classList.add("noglyph");
  },
  sub: (e, t) => {
    if (t.blank) return "";
    if (t.save) return t.sub_label || "";
    const ks = keysForSlot(t.slot);
    return ks.length ? ks.map(k => (k === " " ? "Space" : k)).join(" · ")
                     : "unassigned";
  },
  isOn: (e, t) => !t.blank && !t.save && keysForSlot(t.slot).length > 0,
  select: (e, t) => {
    if (t.blank) return;
    if (t.save) { keycapSave(); return; }
    keycapAssign(t.slot);
  },
};

/* Shared widget helpers — remote-command resolution (DPAD_DEFAULT <
   tile commands < activity dpad_commands), icon map, nudge steppers
   for light/climate. */
const cap = s => (s || "").charAt(0).toUpperCase() + (s || "").slice(1);
const lvlEnt = (e, t) => resolveEntity(t && t.level_entity) || e;
const rc = (e, c) => { if (e && c) callService("remote", "send_command", { command: c }, e); };
/* command resolution: default < tile "commands" < activity context "dpad_commands" */
const DPAD_DEFAULT = {
  up: "UP", down: "DOWN", left: "LEFT", right: "RIGHT", select: "ENTER",
  back: "BACK", home: "HOME", menu: "MENU", info: "INFO",
  ch_up: "CHANNEL_UP", ch_down: "CHANNEL_DOWN"
};
const BTN_ICON = {
  up: "keyboard_arrow_up", down: "keyboard_arrow_down",
  left: "keyboard_arrow_left", right: "keyboard_arrow_right",
  select: "adjust", back: "undo", home: "home", menu: "menu", info: "info",
  ch_up: "add", ch_down: "remove", power: "power_settings_new"
};
function cmdFor(t, key) {
  const m = Object.assign({}, DPAD_DEFAULT, t.commands || {}, ctxFor(S.screen).dpad_commands || {});
  return m[key];
}

function nudgeLight(e, delta) {
  const b = Math.max(3, Math.min(255, (st(e).a.brightness || 0) + delta));
  callService("light", "turn_on", { brightness: b }, e);
}
function nudgeClimate(e, delta) {
  const t = (st(e).a.temperature || 72) + delta;
  callService("climate", "set_temperature", { temperature: t }, e);
}

/* ================================================================
   Rendering
   ================================================================ */
const grid = document.getElementById("grid");

function iconHtml(t, row) {
  let inner;
  if (t.icon_image) inner = `<img src="${t.icon_image}" alt=""${t.icontain ? ' class="contain"' : ""}>`;
  else if (t.icon && t.icon.startsWith("material:"))
    inner = `<span class="ic material-symbols-outlined">${t.icon.slice(9)}</span>`;
  else inner = `<span class="ic">${t.icon || "•"}</span>`;
  return row ? `<div class="icwrap">${inner}</div>` : inner;
}

function renderBanner(sc) {
  const bn = document.getElementById("banner");
  /* hero off: missing OR enabled:false (settings survive the toggle) */
  if (!sc.banner || sc.banner.enabled === false) {
    bn.classList.add("hidden"); bn.innerHTML = ""; return;
  }
  const b = sc.banner;
  const overlay = 1 - (b.image_opacity != null ? b.image_opacity : 0.55);
  bn.style.height = b.height || "180px";
  bn.style.backgroundImage = b.image
    ? `linear-gradient(rgba(13,15,18,${overlay}), rgba(13,15,18,${overlay})), url('${b.image}')`
    : "none";
  const roomsLink = b.rooms_screen && CONFIG.screens[b.rooms_screen];
  bn.innerHTML = `<div class="btitle${roomsLink ? " link" : ""}"${roomsLink ? ' data-fid="hero_rooms"' : ""}>${b.title || sc.name}</div>` +
    (b.show_time === false ? "" : `<div class="btime" id="btime"></div>`);
  if (roomsLink) bn.querySelector(".btitle").addEventListener("click", ev => {
    ev.stopPropagation(); heroActivate("hero_rooms");
  });
  bn.classList.remove("hidden");
  /* tabs:false hides the section jump strip; the title re-centers
     (padding reserved for the strip is dropped) */
  bn.classList.toggle("notabs", b.tabs === false);
  updateClock();
}

/* ---- hero nav: section jump labels + scroll-spy ---- */
function buildHeroNav(jumps, strip) {
  S.heroJumps = jumps;
  S.heroAt = null;   // fresh page: stepping re-seeds from the spy
  const bn = document.getElementById("banner");
  bn.querySelectorAll(".hstrip").forEach(x => x.remove());
  grid.onscroll = null;
  if (!strip || bn.classList.contains("hidden") || !jumps.length) return;
  const stripEl = document.createElement("div");
  stripEl.className = "hstrip";
  jumps.forEach((j, i) => {
    const el = document.createElement("div");
    el.className = "hjump";
    el.dataset.fid = "hero_" + i;
    el.textContent = j.label;
    el.addEventListener("click", ev => { ev.stopPropagation(); heroGo(i); });
    stripEl.appendChild(el);
    j.btn = el;
  });
  bn.appendChild(stripEl);
  grid.onscroll = updateSpy;
  updateSpy();
}
/* CH▲▼ / MENU category stepping (v0.31): jump to the next/prev
   labeled section with a named flash. Works bannerless too (the
   strip is just the visible face; anchors always exist). MENU tours
   with wrap; CH clamps at the ends. */
function heroCycle(dir, wrap) {
  const js = S.heroJumps || [];
  if (js.length < 2) return false;
  /* stepping REMEMBERS its own position (S.heroAt) — short sections
     can't always scroll to the top, so the scroll-spy misreads them;
     the spy (with its bottom rule) only seeds the first step */
  let active = S.heroAt;
  if (active == null) {
    const top = grid.getBoundingClientRect().top + 48;
    active = 0;
    js.forEach((j, i) => { if (j.anchorEl.getBoundingClientRect().top <= top) active = i; });
    /* (no bottom rule here — that's a chips-highlight nicety; the
       stepper seeds from what's at the TOP of the viewport) */
  }
  let next = active + dir;
  if (wrap) next = (next + js.length) % js.length;
  else next = Math.min(js.length - 1, Math.max(0, next));
  if (next === active) return false;
  S.heroAt = next;
  heroGo(next);
  flashBar(js[next].label);
  return true;
}
function heroGo(i) {
  const j = (S.heroJumps || [])[i];
  if (!j) return;
  j.anchorEl.scrollIntoView({ block: "start" });
  setFocus(j.firstId);
}
function heroActivate(fid) {
  if (fid === "hero_rooms") {
    const b = (screenOf(S.screen) || {}).banner || {};
    if (b.rooms_screen && CONFIG.screens[b.rooms_screen]) navigate(b.rooms_screen);
    return;
  }
  heroGo(parseInt(fid.slice(5), 10) || 0);
}
function updateSpy() {
  const js = S.heroJumps || [];
  if (!js.length) return;
  const top = grid.getBoundingClientRect().top + 48;
  let active = 0;
  js.forEach((j, i) => { if (j.anchorEl.getBoundingClientRect().top <= top) active = i; });
  if (grid.scrollTop + grid.clientHeight >= grid.scrollHeight - 4)
    active = js.length - 1;             // scrolled to bottom → last section
  js.forEach((j, i) => j.btn && j.btn.classList.toggle("active", i === active));
}

function updateClock() {
  const el = document.getElementById("btime");
  if (el) el.textContent =
    new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
}
setInterval(updateClock, 20000);

/* Self-fitting hero: banner renders at its configured height, then
   shrinks (down to banner.min_height, default 96) to absorb grid
   overflow — so a whole number of tiles fits on any screen size. */
function fitBanner(sc) {
  if (!sc || !sc.banner) return;
  const bn = document.getElementById("banner");
  if (bn.classList.contains("hidden")) return;
  const maxH = parseInt(sc.banner.height) || 180;
  const minH = parseInt(sc.banner.min_height) || 120;
  bn.style.height = maxH + "px";
  /* fit:false = EXACT height, no tile-boundary snapping (the fold may
     cut a tile; scrolling reveals it) */
  if (sc.banner.fit === false) return;
  /* Align the fold to a tile boundary: if a tile straddles the bottom
     edge of the viewport, shrink the hero just enough to reveal that
     one tile fully — never collapse further than that. */
  const gb = grid.getBoundingClientRect().bottom;
  let delta = 0;
  grid.querySelectorAll(".tile").forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.top < gb && r.bottom > gb) delta = Math.max(delta, r.bottom - gb);
  });
  if (delta > 0)
    bn.style.height = Math.max(minH, maxH - Math.ceil(delta) - 6) + "px";
}
function scheduleFit() {
  const sc = () => CONFIG && screenOf(S.screen);
  requestAnimationFrame(() => fitBanner(sc()));
  setTimeout(() => fitBanner(sc()), 400);   // re-fit after fonts settle
}
window.addEventListener("resize", () => scheduleFit());

function makeTile(t, row) {
  const el = document.createElement("div");
  el.className = "tile wgt-" + t.type + (row ? " row" : "") + (!row && +t.span === 2 ? " span2" : "") +
    (t.color ? " tacc" : "") + (t.brw ? " brw" : "");
  el.id = "tile_" + t.id;
  /* per-tile accent (v0.48.3): the activity's ACCENT paints its icon
     circle — see grid.css .tacc */
  if (t.color) el.style.setProperty("--tacc", t.color);
  const w = WIDGETS[t.type] || {};
  const extra = w.body ? w.body(t) : `<div class="meter hidden"><i></i></div>`;
  const body = `<div class="lbl">${t.label}</div>
    <div class="sub"></div>${extra}<div class="hint"></div>`;
  /* inline sub: value rides the title line (right-aligned) instead of
     burning a second line — widgets opt in via inlineSub (bool or fn) */
  const inline = !row && (w.inlineSub === true ||
    (typeof w.inlineSub === "function" && w.inlineSub(t)));
  el.innerHTML = row
    ? iconHtml(t, true) + `<div class="txt">${body}</div>`
    : `<div class="top">${iconHtml(t, false)}<span class="lbl">${t.label}</span>${
        inline ? '<span class="sub subin"></span>' : ""}</div>
       ${inline ? "" : '<div class="sub"></div>'}${extra}<div class="hint"></div>`;
  el.addEventListener("click", () => {
    if (el._heldFired) { el._heldFired = false; return; }
    setFocus(t.id); act("select");
  });
  /* touch LONG-PRESS: widgets that declare hold() get a 550ms pointer
     timer (a TOUCH gesture on the panel — the physical-remote hold
     doctrine, KeyMapper-owned, is untouched) */
  if (w.hold) {
    let hT = null, hX = 0, hY = 0;
    const clear = () => { if (hT) { clearTimeout(hT); hT = null; } };
    el.addEventListener("pointerdown", ev => {
      hX = ev.clientX; hY = ev.clientY; el._heldFired = false;
      clear();
      hT = setTimeout(() => { hT = null; el._heldFired = true; w.hold(t.entity, t); }, 550);
    });
    el.addEventListener("pointermove", ev => {
      if (hT && Math.hypot(ev.clientX - hX, ev.clientY - hY) > 12) clear();
    });
    el.addEventListener("pointerup", clear);
    el.addEventListener("pointercancel", clear);
    el.addEventListener("pointerleave", clear);
  }
  if (w.wire) w.wire(el, t);
  /* trailing action slot: chassis-level, any tile may declare one.
     Device tiles (detailable widgets whose entity has a detail
     generator) get an implicit settings trail → detail screen;
     set trailing: false in config to suppress it. */
  const trailing = trailingOf(t);
  if (trailing) {
    el.classList.add("has-trail");
    const tr = document.createElement("button");
    tr.className = "trail";
    tr.dataset.fid = t.id + TRAIL;
    tr.innerHTML = iconHtml({ icon: trailing.icon || "material:chevron_right" }, false);
    tr.addEventListener("click", ev => {
      ev.stopPropagation();
      runAction(trailing.action);
    });
    el.appendChild(tr);
  }
  return el;
}

function navigate(screenId, isBack) {
  /* CROSS-WORKSPACE DOORWAY (v0.50.2 — Suresh: "a nav tile on main
     porch page that takes me to deck and vice versa"): a `ws:<id>`
     target switches WORLDS by canonical address — the browser leaves
     for /local/harmonium/<id>/index.html (a peek: nothing pinned).
     In the Studio preview, changing the iframe's world would desync
     the editor — flash instead. */
  if (typeof screenId === "string" && screenId.startsWith("ws:")) {
    const w = screenId.slice(3).trim();
    if (!w) return;
    if (typeof PREVIEW !== "undefined" && PREVIEW) {
      flashBar("Opens workspace '" + w + "' on the real remote");
      return;
    }
    const tail = new RegExp("/" + WS + "/index\\.html$");
    location.href = tail.test(location.pathname)
      ? location.pathname.replace(tail, "/" + w + "/index.html")
      : location.pathname.replace(/index\.html$/, w + "/index.html");
    return;
  }
  /* LIBRARY CANONICALIZATION (v0.47.4 — Suresh: "The apps drawer
     doesn't work"): a bare ref to a screen that now lives in the
     controller LIBRARY (the apps drawer moved there so it travels
     into every workspace) resolves to its controller: address —
     heals every stale {navigate: apps} in deployed configs. */
  if (!screenOf(screenId) && screenOf("controller:" + screenId))
    screenId = "controller:" + screenId;
  const sc = screenOf(screenId);           // config screen or detail:<entity>
  if (!sc) return;
  if (S.screen && !isBack && screenId !== S.screen) S.stack.push(S.screen);
  releaseCapture(); clearConfirm();
  S.screen = screenId;
  document.getElementById("screenName").textContent = barTitle(sc);
  /* (the v0.35 title-bar input button lived one day — a bar icon is a
     fingertip-hostile target on a remote. The source_select ROLE +
     Source tile replaced it, v0.36.) */
  /* MUSIC TYPE SCOPE (v0.52.1 — Suresh: "set Primary and Secondary
     font for the music player separately"): screens declaring
     font_scope: music read --font-m1/--font-m2 (they follow the
     global pair unless the theme sets them) */
  document.getElementById("app").classList.toggle("scr-music",
    (sc.font_scope || "") === "music");
  renderBanner(sc);
  const cols = (sc.grid && sc.grid.columns) || 2;
  /* minmax(0,1fr): columns may shrink below content min-width, so a
     wide tile (trail + long label) can never burst the viewport */
  grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  const row = cols === 1;
  grid.innerHTML = "";
  const sections = sc.sections || [{ tiles: sc.tiles || [] }];
  const heroJumps = [];
  /* BROWSE BANDS (v0.50): a section containing a browse tile sends
     its OTHER tiles to the fixed bar (band 1) — the grid carries
     items only. _active re-arms per render via the generator. */
  S.browse._active = false;
  S.browse.barTiles = [];
  sections.forEach(sec => {
    if (sec.enabled === false) return;   // switched off in the Studio
    let secTiles = sec.tiles;
    if (secTiles.some(x => x.type === "browse")) {
      S.browse.barTiles = secTiles.filter(x => x.type !== "browse");
      secTiles = secTiles.filter(x => x.type === "browse");
    }
    const vis = secTiles.flatMap(expandTile).filter(visibleTile);
    if (!vis.length) return;
    let anchorEl = null;
    if (sec.title) {
      const h = document.createElement("div");
      h.className = "shead"; h.textContent = sec.title;
      grid.appendChild(h);
      anchorEl = h;
    }
    const secCols = sec.columns || cols;
    const secRow = secCols === 1;
    let host = grid;
    if (sec.columns) {
      host = document.createElement("div");
      host.className = "secgrid";
      host.style.gridTemplateColumns = `repeat(${sec.columns}, minmax(0, 1fr))`;
      grid.appendChild(host);
      anchorEl = anchorEl || host;
    }
    vis.forEach(t => {
      const el = makeTile(t, secRow);
      host.appendChild(el);
      anchorEl = anchorEl || el;
    });
    if (sec.hero_label)
      heroJumps.push({ label: sec.hero_label, firstId: vis[0].id, anchorEl });
  });
  /* EMPTY-PAGE HINT (v0.47.1 — Suresh: "blank controller in browser"):
     a page with nothing to render says WHY instead of showing void —
     a pure controller waits for an activity; a hub waits for content */
  if (!grid.children.length) {
    const hint = document.createElement("div");
    const isCtrl = sc.class === "activity" || sc.type === "controller" ||
      sc.view_kind === "controller";
    hint.textContent = isCtrl
      ? "No activity is active — start one from its room page and this player fills in."
      : "Nothing here yet — add activities or tiles to this page in the Studio, then Save & Deploy.";
    hint.style.cssText = "grid-column:1/-1;padding:36px 16px;text-align:center;" +
      "opacity:.45;font-size:14px;line-height:1.5;";
    grid.appendChild(hint);
  }
  /* jumps ALWAYS register (CH▲▼/MENU step them even bannerless —
     the Apps drawer); the visible strip needs a banner with tabs on */
  buildHeroNav(heroJumps, !!(sc.banner && sc.banner.enabled !== false &&
    sc.banner.tabs !== false));
  /* fresh page = top of page (v0.53 — the grid keeps its scrollTop
     across innerHTML swaps, so the PREVIOUS page's scroll position
     leaked into this one, eating the top padding); initial_focus
     deeper in the page still scrolls to itself via setFocus */
  grid.scrollTop = 0;
  const all = tilesOf(sc);
  setFocus(sc.initial_focus || (all[0] && all[0].id));
  S.tileSig = tileSig(sc);          // set BEFORE renderStates (see below)
  renderStates();
  scheduleFit();
  /* global back affordance: chevron in the status bar iff history */
  document.getElementById("backBtn").classList.toggle("hidden", !S.stack.length);
  updateBarChrome();
  if (typeof browseBar === "function") browseBar();
  /* passthrough cue: accent rule + gamepad glyph while the physical
     D-pad drives the device (and hold-Back/Home send device keys) */
  const pt = passthroughActive();
  document.getElementById("bar").classList.toggle("pt", pt);
  document.getElementById("ptIc").classList.toggle("hidden", !pt);
  if (S.connected) subscribeFor(screenId);
}

/* app-level bar chrome (v0.48.1 — Suresh: "In a browser, how do I turn
   off the activity? Or Go Back a page? Or go home?"): Home + End live
   in the title bar on TOUCH clients; physical-key remotes have real
   keys, so the bar stays clean there. End shows while an activity is
   current (select or pending) and rides the standard confirm flow. */
function updateBarChrome() {
  const touchOnly = !CAPS.has("physical_dpad");
  const home = document.getElementById("homeBtn");
  const end = document.getElementById("endBtn");
  if (!home || !end) return;
  home.classList.toggle("hidden",
    !touchOnly || S.screen === CONFIG.home_screen);
  end.classList.toggle("hidden", !(touchOnly && currentActivityId()));
}

function renderStates() {
  const sc = screenOf(S.screen);
  if (!sc) return;
  updateBarChrome();
  /* generated tiles (presets_from) are STRUCTURAL: when their source
     attribute changes the tile set itself changes, so patch-in-place
     isn't enough — re-render the grid. Rare (favorites edit), cheap. */
  const sig = tileSig(sc);
  if (sig !== S.tileSig) { S.tileSig = sig; navigate(S.screen, true); return; }
  tilesOf(sc).forEach(t => {
    const el = document.getElementById("tile_" + t.id);
    const w = WIDGETS[t.type];
    if (!el || !w) return;
    const eid = resolveEntity(t.entity);
    el.querySelector(".sub").textContent =
      typeof w.sub === "function" ? w.sub(eid, t) : "";
    el.classList.toggle("on", !!(w.isOn && w.isOn(eid, t)));
    el.classList.toggle("confirm", S.confirmTile === t.id);
    const m = el.querySelector(".meter");
    if (m && w.meter && eid) {
      m.classList.remove("hidden");
      m.firstElementChild.style.width = Math.round(w.meter(eid, t) * 100) + "%";
    }
    el.querySelector(".hint").textContent = w.captureHint || "";
    if (w.render) w.render(el, eid, t);   // widget-managed dynamic body
  });
}

/* the ⓘ icon replaces the always-on perf clutter in the bar —
   tap it for boot/msgs/device/connection details (v0.32) */
function perfInfo() {
  flashBar((S.bootMs ?? Math.round(performance.now() - T0)) + "ms boot · " +
    S.msgCount + " msgs · device " + (S.deviceName || "default") +
    " · " + (S.connected ? "connected" : "offline"));
}
function perf() {
  /* boot time is FROZEN at first paint (it's a boot metric, not an
     uptime counter); msgs and device stay live */
  document.getElementById("perf").textContent =
    (S.bootMs ?? Math.round(performance.now() - T0)) + "ms · " +
    S.msgCount + " msgs · " + (S.deviceName || "");
}
setInterval(() => { if (S.painted) perf(); }, 5000);
function dot(ok) { document.getElementById("dot").classList.toggle("ok", ok); }

function barTitle(sc) {
  const room = (CONFIG.global || {}).room;
  /* a screen the ACTIVE activity navigates to titles by the activity
     ("Watch Fire TV"), not the library label ("TV Media Player") */
  let name = sc.name;
  const aid = currentActivityId();
  const a = aid && CONFIG.activities[aid];
  if (a && a.screen === S.screen) name = a.name || name;
  return room && name !== room ? room + " · " + name : name;
}
/* flashBar(msg)            — 3s neutral notice
   flashBar(msg, tone, ms)  — confirm prompt: tone "off" pulses red
   (something is about to turn OFF), "on" pulses accent (about to
   turn ON / start); ms matches the confirm window. The bar title is
   too small to carry a warning on a remote, so the tone ALSO pulses
   the screen's MAJOR tile — the first tile in the grid. */
function cfmTone(el, tone) {
  if (!el) return;
  el.classList.remove("cfm-off", "cfm-on");
  if (tone) el.classList.add("cfm-" + tone);
}
function cfmClear() {
  cfmTone(document.getElementById("screenName"), null);
  cfmTone(flashBar._tile, null);
  flashBar._tile = null;
}
function flashBar(msg, tone, ms) {
  const el = document.getElementById("screenName");
  el.textContent = msg;
  cfmClear();
  if (tone) {
    cfmTone(el, tone);
    flashBar._tile = grid.querySelector(".tile");
    cfmTone(flashBar._tile, tone);
  }
  clearTimeout(flashBar._t);
  flashBar._t = setTimeout(() => {
    cfmClear();
    const sc = screenOf(S.screen);
    el.textContent = sc ? barTitle(sc) : "";
  }, ms || 3000);
}

/* ================================================================
   Focus: spatial D-pad navigation + capture mode
   ================================================================ */
/* Focus ids come in three flavors:
   · a tile id                     (element #tile_<id>)
   · "hero_*"                      (banner title / section jumps)
   · "<tileid>::trail"             (a tile's trailing action zone)  */
const TRAIL = "::trail";
const isTrailId = id => typeof id === "string" && id.endsWith(TRAIL);
const trailBase = id => id.slice(0, -TRAIL.length);

/* focusable items = hero nav elements + visible tiles (+ trails) */
function focusables() {
  const list = [];
  document.querySelectorAll("#banner [data-fid]").forEach(el =>
    list.push({ id: el.dataset.fid, el }));
  tiles().forEach(t => {
    const el = document.getElementById("tile_" + t.id);
    if (!el || el.offsetParent === null) return;   // skip hidden tiles
    list.push({ id: t.id, el });
    const tr = el.querySelector(".trail");
    if (tr) list.push({ id: tr.dataset.fid, el: tr });
  });
  return list;
}
function focusEl(id) {
  return document.getElementById("tile_" + id) ||
    document.querySelector(`#banner [data-fid="${id}"]`) ||
    document.querySelector(`#grid [data-fid="${id}"]`);
}

function setFocus(id) {
  releaseCapture();
  if (S.confirmTile && S.confirmTile !== id) { clearConfirm(); }
  S.focusId = id;
  grid.querySelectorAll(".tile").forEach(el =>
    el.classList.toggle("focused", el.id === "tile_" + id));
  grid.querySelectorAll(".trail").forEach(el =>
    el.classList.toggle("focused", el.dataset.fid === id));
  document.querySelectorAll("#banner [data-fid]").forEach(el =>
    el.classList.toggle("focused", el.dataset.fid === id));
  const el = focusEl(id);
  if (el && el.closest("#grid")) el.scrollIntoView({ block: "nearest" });
}

function spatialMove(dir) {
  const cur = focusEl(S.focusId);
  if (!cur) return false;
  const c = cur.getBoundingClientRect();
  const cx = c.left + c.width / 2, cy = c.top + c.height / 2;
  let best = null, bestScore = Infinity;
  focusables().forEach(f => {
    if (f.id === S.focusId) return;
    const r = f.el.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const dx = x - cx, dy = y - cy;
    const inDir = (dir === "up" && dy < -8) || (dir === "down" && dy > 8) ||
                  (dir === "left" && dx < -8) || (dir === "right" && dx > 8);
    if (!inDir) return;
    const primary = (dir === "up" || dir === "down") ? Math.abs(dy) : Math.abs(dx);
    const cross   = (dir === "up" || dir === "down") ? Math.abs(dx) : Math.abs(dy);
    const score = primary + cross * 2.5;
    if (score < bestScore) { bestScore = score; best = f.id; }
  });
  if (best) { setFocus(best); return true; }
  return false;
}

function pageScreen(dir) {
  const order = CONFIG.screen_order, i = order.indexOf(S.screen);
  if (i < 0) return;                       // detail/unlisted screens don't page
  const j = dir === "right" ? i + 1 : i - 1;
  if (j >= 0 && j < order.length) navigate(order[j]);
}

function captureWidget() {
  const t = tileDef(S.focusId);
  return t && WIDGETS[t.type].capture ? t : null;
}
function releaseCapture() {
  if (!S.captured) return;
  S.captured = false;
  grid.querySelectorAll(".tile.captured").forEach(el => el.classList.remove("captured"));
}
function enterCapture() {
  const t = captureWidget();
  if (!t) return false;
  S.captured = true;
  document.getElementById("tile_" + t.id).classList.add("captured");
  return true;
}

/* ================================================================
   Input: keyboard → logical buttons → actions
   ================================================================ */
let holdTimer = null, holdFired = false;

/* ---- v2 control target -------------------------------------------
   A view may declare `control_target` (v2 authoring): which entity the
   physical keys drive (navigation/power/volume) and WHICH keys pass
   through. The active activity's `controls` map is the fallback, then
   the v1 heuristics (dpad_passthrough / context.dpad). All of this is
   pure data — under a v1 config nothing here changes behavior. */
function controlTarget() {
  const sc = (CONFIG && screenOf(S.screen)) || {};
  if (sc.control_target) return sc.control_target;
  const aid = currentActivityId();
  return (aid && (CONFIG.activities[aid] || {}).controls) || null;
}
function ctPass(button) {
  const ct = controlTarget();
  return !!(ct && Array.isArray(ct.pass_through) && ct.pass_through.includes(button));
}
/* v2 input policy from config.input.physical_buttons — absent = v1 */
function inputPB() {
  return (CONFIG && CONFIG.input && CONFIG.input.physical_buttons) || null;
}

/* device target for hold-Back / hold-Home: control_target.navigation,
   the screen's passthrough entity, or the context dpad slot — null on
   non-device screens (hold then simply behaves like tap). */
function deviceKeyTarget() {
  const scd = (CONFIG && screenOf(S.screen)) || {};
  const ct = controlTarget();
  return resolveEntity((ct && ct.navigation) ||
    scd.dpad_passthrough || ctxFor(S.screen).dpad || null);
}

/* Harmony rule: physical D-pad drives the device when the view says so —
   v2: control_target.pass_through covers all five nav keys;
   v1: the screen declares dpad_passthrough. Touch always drives the UI. */
function passthroughActive() {
  if (!CAPS.has("physical_dpad")) return false;
  const scp = (CONFIG && screenOf(S.screen)) || {};
  if (scp.control_target)
    return ["up", "down", "left", "right", "select"].every(ctPass);
  return !!scp.dpad_passthrough;
}

/* v2 power-to-target: controls.power may be a full {service, entity}
   action; control_target.power is an entity (default: toggle). */
function ctPower() {
  const ct = controlTarget();
  if (!ct || !ct.power) return false;
  if (typeof ct.power === "object" && ct.power.service) {
    const [d, s] = ct.power.service.split(".");
    const tgt = resolveEntity(ct.power.entity || ct.power.target);
    if (tgt) { callService(d, s, ct.power.data, tgt); return true; }
    return false;
  }
  const tgt = resolveEntity(ct.power);
  if (!tgt) return false;
  callService("homeassistant", "toggle", null, tgt);
  return true;
}

/* end the CURRENT activity with the standard confirm flow (shared by
   class-scoped power and the v2 hold-power=activity_end role) */
function endCurrentActivity() {
  const aid = currentActivityId();
  if (!aid) { flashBar("No activity running"); return; }
  const a = CONFIG.activities[aid];
  const tile = tiles().find(x => x.type === "activity" && x.activity === aid);
  if (tile) { setFocus(tile.id); requestEnd(tile, a); return; }
  if (a.confirm_end && !barConfirm("endact", "Press power again to end " + (a.name || aid)))
    return;
  endActivity(a);
  flashBar("Ending " + (a.name || aid));
}

/* v2 routing shim: when config.input.physical_buttons declares the
   short-press-controls-target / hold-navigates-app model, reroute the
   primary keys BEFORE the v1 switch. Returns true when handled.
   PHYSICAL keys only — touch taps always drive the UI. Roles
   "control_target" and "all_off" on holds ARE the v1 defaults, so
   they fall through (return false) and the v1 switch serves them. */
function v2Route(button, phys) {
  const pb = inputPB();
  if (!pb || !phys) return false;
  const short = pb.short_press === "control_target";
  /* short press of back/home/power → the control target (when the view
     passes that key through and a target resolves) */
  if (short && ["back", "home", "power"].includes(button) && ctPass(button)) {
    if (button === "power") return ctPower();
    const tgt = deviceKeyTarget();
    if (tgt) { rc(tgt, cmdFor({}, button)); return true; }
    return false;                          // no target → fall through to UI
  }
  /* hold roles: back_hold/home_hold/power_hold carry the APP action */
  const hold = pb.hold || {};
  const role = { back_hold: hold.back, home_hold: hold.home, power_hold: hold.power }[button];
  if (!role) return false;
  if (role === "app_back") { act("back", false); return true; }
  if (role === "room_home") { act("home", false); return true; }
  if (role === "activity_end") {
    /* hold role: END WITHOUT ASKING (tap owns the confirmation) */
    const aid = currentActivityId();
    if (!aid) { flashBar("No activity running"); return true; }
    endActivity(CONFIG.activities[aid]);
    flashBar("Ending " + (CONFIG.activities[aid].name || aid));
    return true;
  }
  return false;
}

function act(button, phys) {
  if (!CONFIG || !S.screen) return;

  /* Harmony passthrough claims PHYSICAL keys only — touch taps on
     tiles always drive the UI, even on a passthrough screen.
     v0.11: Back is NO LONGER claimed — tap-Back is UI back everywhere;
     hold-Back/Home send the device keys (see keydown). */
  if (phys && passthroughActive() &&
      ["up", "down", "left", "right", "select"].includes(button)) {
    rc(deviceKeyTarget(), cmdFor({}, button));
    /* the Studio preview can't show the device reacting — say where
       the key went so the pad doesn't read as dead */
    if (typeof PREVIEW !== "undefined" && PREVIEW)
      flashBar("D-pad → device (passthrough)");
    return;
  }

  /* v2 input policy (config.input.physical_buttons): short press →
     control target, hold → app. No-op under a v1 config. */
  if (v2Route(button, phys)) return;

  const t = tileDef(S.focusId), w = t && WIDGETS[t.type];
  const eid = t ? resolveEntity(t.entity) : null;

  if (S.captured && w && w.capture) {          // widget owns the D-pad
    const h = w.capture[button];
    if (h) { h(eid, t); renderStates(); return; }
    if (button === "back") { releaseCapture(); renderStates(); return; }
    if (button === "home") { releaseCapture(); navigate(CONFIG.home_screen); return; }
  }

  switch (button) {
    case "up": case "down":
      spatialMove(button); break;
    case "left": case "right": {
      /* widget-owned ◀▶ while merely FOCUSED (no capture) — e.g.
         coverbtns' roving highlight */
      if (!isTrailId(S.focusId) && w && w.keys && w.keys[button]) {
        w.keys[button](eid, t); renderStates(); break;
      }
      if (!spatialMove(button)) pageScreen(button);
      break;
    }
    case "select": {
      if (typeof S.focusId === "string" && S.focusId.startsWith("hero_")) {
        heroActivate(S.focusId); break;
      }
      if (isTrailId(S.focusId)) {
        const tr = trailingOf(tileDef(trailBase(S.focusId)));
        if (tr) runAction(tr.action);
        break;
      }
      if (!w) break;
      if (S.confirmTile === t.id && w.select) { w.select(eid, t); break; }
      if (w.selectCaptures) { enterCapture(); renderStates(); }
      else if (w.select) { w.select(eid, t); renderStates(); }
      break;
    }
    case "back":
      if (S.confirmTile) { clearConfirm(); renderStates(); break; }
      if (S.stack.length) navigate(S.stack.pop(), true);
      break;
    case "back_hold": case "home_hold": {
      /* SHELL-OWNED hold gesture: KeyMapper maps a physical long-press
         to a distinct key (see keymap), because injected keys don't
         deliver reliable keyup/hold timing to the webview. Sends the
         DEVICE's back/home; degrades to tap without a device target. */
      const base = button === "back_hold" ? "back" : "home";
      const tgt = deviceKeyTarget();
      if (tgt) rc(tgt, cmdFor({}, base));
      else act(base, phys);
      break;
    }
    case "power_hold": {
      /* long-press Power (v0.28): a power_hold BINDING is the page's
         authored sledgehammer (screen.buttons over global.buttons —
         "Porch All Off" is just an Action it points at). Unbound =
         the derived default: end the running activity IMMEDIATELY
         (tap asks, the deliberate hold doesn't); idle = nothing. */
      const bh = Object.assign({}, CONFIG.global.buttons,
        (screenOf(S.screen) || {}).buttons || {}).power_hold;
      if (bh) { runAction(bh); break; }
      const cur = currentActivityId();
      if (!cur) { flashBar("Nothing running"); break; }
      const ca = CONFIG.activities[cur] || {};
      endActivity(ca);
      flashBar("Ending " + (ca.name || cur));
      break;
    }
    case "menu": {
      /* physical MENU key (Astrion: '#') → the device's menu command
         on screens with a device context; on a multi-section page
         without one, MENU tours the categories (wraps) */
      const mt = deviceKeyTarget();
      if (mt) { rc(mt, cmdFor({}, "menu")); break; }
      heroCycle(1, true);
      break;
    }
    case "home": {
      /* home goes UP one level via the screen's `parent` (fallback:
         sub screen → room page; room page → global.main_home). Home
         RESETS history (isBack navigation → chevron hides). */
      S.stack = [];
      const scr = screenOf(S.screen) || {};
      const dest = (scr.parent && screenOf(scr.parent)) ? scr.parent
        : S.screen !== CONFIG.home_screen ? CONFIG.home_screen
        : CONFIG.global.main_home;
      if (dest && screenOf(dest) && dest !== S.screen) navigate(dest, true);
      break;
    }
    case "power": {
      /* Power is a PER-PAGE SETTING (v0.26), default Auto:
         detail → toggle the device (immediate — one device, reversible)
         auto   → hosts activities → end the running one (confirm);
                  plain page → all page devices off/on (confirm)
         screen.power: "activity" | "devices" overrides Auto */
      const scp2 = screenOf(S.screen) || {};
      const cls = classOf(scp2, S.screen);
      const aid = currentActivityId();
      if (cls === "detail") {
        callService("homeassistant", "toggle", null, S.screen.slice(7));
        break;
      }
      const scope = scp2.power === "activity" ? "activity"
        : scp2.power === "devices" ? "devices"
        : cls === "group" ? "devices" : "activity";
      if (scope === "devices") {
        const ents = powerEntities(scp2);
        if (!ents.length) { flashBar("Nothing to switch"); break; }
        const anyOn = ents.some(x => ACTIVE(st(x).s));
        if (!barConfirm("gpwr", `Press power again to turn ${ents.length} devices ${anyOn ? "off" : "on"}`,
            anyOn ? "off" : "on"))
          break;
        callService("homeassistant", anyOn ? "turn_off" : "turn_on", null, ents);
        flashBar((anyOn ? "Turning off " : "Turning on ") + ents.length + " devices");
        break;
      }
      if (!aid) {
        /* doctrine 2026-07-23: idle view -> tap does NOTHING (hold is
           the All Off gesture); no more idle-tap All Off confirm */
        flashBar("Nothing running");
        break;
      }
      endCurrentActivity();
      break;
    }
    case "vol_up": case "vol_down": case "ch_up": case "ch_down":
    case "mute": case "menu_hold": {
      /* Exception to "VOL is always audio": on a device DETAIL
         screen, VOL nudges that device's primary range (brightness,
         setpoint, volume, position). Everywhere else: activity audio. */
      if ((button === "vol_up" || button === "vol_down") &&
          typeof S.screen === "string" && S.screen.startsWith("detail:")) {
        const de = S.screen.slice(7);
        const kind = DETAIL_VOL_KIND[de.split(".")[0]];
        if (kind) { nudgeStep(de, kind, button === "vol_up" ? +1 : -1); break; }
      }
      /* v0.11 focus-follows: focused device tile with a primary range →
         VOL nudges IT. Media is carved out — a focused media tile keeps
         the context audio path ($context.volume), never volume_set on
         the focused player, so ARC/CEC volume routing survives. */
      if ((button === "vol_up" || button === "vol_down") && eid) {
        const fd = eid.split(".")[0];
        if (fd !== "media_player" && DETAIL_VOL_KIND[fd]) {
          nudgeStep(eid, DETAIL_VOL_KIND[fd], button === "vol_up" ? +1 : -1);
          renderStates();
          break;
        }
      }
      /* logical-button bindings: a screen-level `buttons` map overrides
         global.buttons per screen (e.g. music binds ch_up/ch_down to
         next/previous track, menu_hold to the music drawer); entries
         use the shared action grammar — {service, entity|target, data}
         OR {navigate: <screen>} */
      const bmap = Object.assign({}, CONFIG.global.buttons,
        (screenOf(S.screen) || {}).buttons || {});
      const b = bmap[button];
      if (b) { runAction(b); break; }   // shared grammar: navigate/sequence/service
      /* unbound CH on a multi-section page = CATEGORY/SECTION paging
         (the Music Library's ▲▼; bindings above always win) */
      /* browse bands (v0.50): CH steps the CATEGORY strip (wraps) */
      if ((button === "ch_up" || button === "ch_down") &&
          typeof brStepCat === "function" &&
          brStepCat(button === "ch_up" ? 1 : -1)) break;
      if ((button === "ch_up" || button === "ch_down") &&
          heroCycle(button === "ch_up" ? 1 : -1)) break;
      /* mute default (no config binding needed): toggle mute on the
         context audio path — same ARC-aware target VOL uses */
      if (button === "mute") {
        const tgt = resolveEntity("$context.volume");
        if (tgt) callService("media_player", "volume_mute",
          { is_volume_muted: !st(tgt).a.is_volume_muted }, tgt);
      }
      break;
    }
    default: {
      /* OPEN BUTTON VOCABULARY (v0.54 — Suresh: "dpad left hold and
         right hold to do RWD and FFWD"): ANY logical button a keymap
         can emit is bindable — a screen/global `buttons` entry runs
         its action (shared grammar: navigate/sequence/service/seek).
         Unbound stays a deliberate no-op. left_hold/right_hold land
         here; new remotes can mint new names without engine edits. */
      const bd = Object.assign({}, CONFIG.global.buttons,
        (screenOf(S.screen) || {}).buttons || {})[button];
      if (bd) runAction(bd);
      break;
    }
  }
}

/* ---- key-event debug card ----------------------------------------
   Enable via config global.debug, URL #debug=1 (sticky, #debug=0
   clears), or localStorage hakr_debug=1. Logs RAW keyboard events in
   CAPTURE phase — before any engine handling, including unmapped keys
   — to diagnose what the shell/KeyMapper actually delivers. */
const DBG = { on: false, lines: [], last: 0 };
function dbgInit() {
  DBG.on = !!(CONFIG && CONFIG.global && CONFIG.global.debug) ||
    localStorage.getItem("hakr_debug") === "1";
  document.getElementById("dbg").classList.toggle("hidden", !DBG.on);
  if (DBG.on) dbgLog("debug on · press keys…");
}
function dbgLog(msg) {
  if (!DBG.on) return;
  const now = performance.now();
  const dt = DBG.last ? Math.round(now - DBG.last) : 0;
  DBG.last = now;
  DBG.lines.unshift("+" + String(dt).padStart(4) + "ms " + msg);
  if (DBG.lines.length > 7) DBG.lines.length = 7;
  document.getElementById("dbg").textContent = DBG.lines.join("\n");
}
function dbgKey(t, e) {
  dbgLog(t + " key=" + JSON.stringify(e.key) + " code=" + (e.code || "?") +
    " kc=" + e.keyCode + (e.repeat ? " rpt" : "") +
    " → " + (KEYMAP[e.key] || "(unmapped)"));
}
window.addEventListener("keydown", e => dbgKey("▼", e), true);
window.addEventListener("keyup", e => dbgKey("▲", e), true);
window.addEventListener("keypress", e => dbgKey("·", e), true);

/* FIELD LESSON (v0.11.1): KeyMapper-injected keys do NOT deliver
   reliable keyup/hold timing to the webview — keyup-gated taps and
   in-engine hold timers died on the Astrion. Doctrine: taps fire on
   KEYDOWN (instant, field-proven); HOLD gestures are the SHELL's job —
   KeyMapper long-press mappings send DISTINCT keys (back_hold /
   home_hold / power_hold). Select keeps its keyup+timer hold-capture
   (Enter delivers proper pairs and the gesture is field-verified). */
document.addEventListener("keydown", e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return; // let the auth form type
  /* KEY CAPTURE screen (v0.55): log EVERYTHING (mapped or not) and
     swallow it — a captured "back" must not navigate. Exit is the
     title-bar ‹ chevron (a DOM click, not this path). */
  if (S.screen === "keys:") {
    e.preventDefault();
    if (!e.repeat) keycapLog(e);
    return;
  }
  const b = KEYMAP[e.key];
  if (!b) return;
  e.preventDefault();
  if (b === "select") {                         // hold-select gesture
    if (e.repeat || S.captured || passthroughActive()) return; // tap on keyup
    holdFired = false;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {              // timer-based: works even
      holdFired = true;                         // if the shell sends no
      const t = tileDef(S.focusId);             // key-repeat events
      const w = t && WIDGETS[t.type];
      if (w && w.holdCapture && w.capture) enterCapture();
      else if (w && w.hold) w.hold(resolveEntity(t.entity), t);
      renderStates();
    }, TIMING.hold);
    return;
  }
  if (e.repeat && !S.captured && b !== "vol_up" && b !== "vol_down") return;
  act(b, true);
});

document.addEventListener("keyup", e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (S.screen === "keys:") { e.preventDefault(); return; }
  if (KEYMAP[e.key] !== "select") return;
  e.preventDefault();
  clearTimeout(holdTimer);
  if (!holdFired) act("select", true);
  holdFired = false;
});

/* ================================================================
   Auth overlay + boot
   ================================================================ */
function showAuth(err) {
  document.getElementById("auth").classList.remove("hidden");
  document.getElementById("authErr").textContent = err || "";
  const hostIn = document.getElementById("hostIn");
  hostIn.value = localStorage.getItem("hakr_host") ||
    (location.protocol.startsWith("http") ? location.host : "");
}
document.getElementById("backBtn").addEventListener("click", () => act("back"));
/* browser chrome (v0.48.1): app-level Home + End-activity in the bar */
document.getElementById("homeBtn").addEventListener("click", () => act("home"));
document.getElementById("endBtn").addEventListener("click", () => {
  endCurrentActivity();
  renderStates();
});
/* ⓘ: tap = the perf flash (unchanged) · HOLD 550ms = the KEY CAPTURE
   screen (v0.55 — a diagnostic surface behind the info icon, where
   the family never trips on it; also reachable as nav target keys:) */
{
  const info = document.getElementById("info");
  let iT = null, iHeld = false;
  info.addEventListener("pointerdown", () => {
    iHeld = false;
    clearTimeout(iT);
    iT = setTimeout(() => { iHeld = true; navigate("keys:"); }, 550);
  });

  info.addEventListener("pointercancel", iEnd);
  info.addEventListener("pointerleave", iEnd);
  info.addEventListener("click", () => { if (!iHeld) perfInfo(); iHeld = false; });
}
document.getElementById("connectBtn").addEventListener("click", () => {
  const host = document.getElementById("hostIn").value.trim();
  const token = document.getElementById("tokenIn").value.trim();
  if (!host || !token) return showAuth("Host and token required");
  localStorage.setItem("hakr_host", host);
  localStorage.setItem("hakr_token", token);
  document.getElementById("auth").classList.add("hidden");
  connect();
});

/* ---- Studio preview mode (v0.14) ----------------------------------
   #preview=1 puts the engine under a PARENT'S control (the Harmonium
   Studio): the config arrives by postMessage instead of fetch, and can
   be re-injected on every edit for a live WYSIWYG preview. Messages
   are same-origin only. The kiosk never sets the flag — inert there.
     parent → engine:
       { type: "harmonium_config", config, device? }   apply + render
       { type: "harmonium_key", key }                  synthetic keydown/up
     engine → parent:
       { type: "harmonium_ready" }                     listener installed
       { type: "harmonium_applied", screen }           config rendered */
let PREVIEW = false;
let WS_PEEK = null;   // #ws=<id>&pin=0 — this load only, no pinning
function applyConfig(cfg, devName) {
  CONFIG = cfg;
  if (!devName) devName = localStorage.getItem("hakr_device");
  // v0.45: hardware profiles renamed devices -> remotes (devices is now
  // the bundle library); read remotes with a legacy-config fallback
  const REMOTES = CONFIG.remotes || CONFIG.devices || {};
  if (!devName && window.fully)
    devName = Object.keys(REMOTES).find(k => REMOTES[k].fully) || null;
  DEVICE = REMOTES[devName] || REMOTES.default || {};
  S.deviceName = devName || "default";
  CAPS = new Set(DEVICE.capabilities || ["touch", "pointer"]);
  KEYMAP = DEVICE.keymap || CONFIG.keymap || KEYMAP;
  applyTheme(CONFIG.theme);
  dbgInit();
  S.stack = [];
  /* preview re-injection keeps the screen being edited (falls back to
     home when it no longer exists); kiosk boot always lands home */
  const keep = PREVIEW && S.screen && screenOf(S.screen);
  navigate(keep ? S.screen : CONFIG.home_screen, true);
  if (S.connected) subscribeFor(S.screen);
}
function previewListen() {
  window.addEventListener("message", ev => {
    if (ev.origin !== location.origin) return;
    const m = ev.data || {};
    if (m.type === "harmonium_config" && m.config) {
      try {
        /* the Studio says which workspace the preview IS — service
           calls from the preview then run that workspace's sequences */
        WS = m.workspace || "main";
        applyConfig(m.config, m.device);
        parent.postMessage({ type: "harmonium_applied", screen: S.screen }, location.origin);
      } catch (err) {
        parent.postMessage({ type: "harmonium_error", message: String(err) }, location.origin);
      }
    } else if (m.type === "harmonium_navigate" && m.screen) {
      if (CONFIG && screenOf(m.screen)) {
        S.stack = [];
        navigate(m.screen, true);
      }
    } else if (m.type === "harmonium_preview_activity") {
      /* impersonate the activity being edited (null clears) */
      S.pvActivity = m.activity || null;
      if (CONFIG && S.screen) { navigate(S.screen, true); subscribeFor(S.screen); }
    } else if (m.type === "harmonium_key" && m.key) {
      const opts = { key: m.key, bubbles: true, cancelable: true };
      document.dispatchEvent(new KeyboardEvent("keydown", opts));
      document.dispatchEvent(new KeyboardEvent("keyup", opts));
    }
  });
  parent.postMessage({ type: "harmonium_ready" }, location.origin);
}

(async () => {
  /* one-time provisioning for kiosk devices — open:
     .../index.html#host=192.168.1.87:8123&token=LLAT
     (also accepted as ?host=…&token=… for loaders that drop fragments)
     Credentials are trimmed, stored to localStorage, and stripped from
     the URL, so you never type a token on a remote's keyboard. */
  {
    const prov = new URLSearchParams(
      (location.hash.length > 1 ? location.hash.slice(1) : "") + "&" +
      (location.search.length > 1 ? location.search.slice(1) : ""));
    const clean = v => (v || "").trim().replace(/^["']+|["']+$/g, "");
    const pHost = clean(prov.get("host")), pTok = clean(prov.get("token"));
    const pDev = clean(prov.get("device")), pDbg = clean(prov.get("debug"));
    const pWs = clean(prov.get("ws"));   // workspace pin (v0.34), like device
    /* pin=0 (v0.37): PEEK at a workspace without pinning this browser
       to it — the Studio's "open the running app" link uses it, so
       looking at Bedroom doesn't silently make this THE Bedroom
       remote. The hash stays put so a refresh stays on the peek. */
    const pPeek = clean(prov.get("pin")) === "0";
    PREVIEW = clean(prov.get("preview")) === "1";
    if (pHost) localStorage.setItem("hakr_host", pHost);
    if (pTok) localStorage.setItem("hakr_token", pTok);
    if (pDev && !PREVIEW) localStorage.setItem("hakr_device", pDev);
    if (pWs && !PREVIEW && !pPeek) {
      if (pWs === "main") localStorage.removeItem("hakr_ws");
      else localStorage.setItem("hakr_ws", pWs);
    }
    if (pWs && pPeek) WS_PEEK = pWs;
    if (pDbg === "1") localStorage.setItem("hakr_debug", "1");
    else if (pDbg === "0") localStorage.removeItem("hakr_debug");
    if ((pHost || pTok || pDev || pDbg || (pWs && !pPeek)) && !PREVIEW)
      history.replaceState(null, "", location.pathname);
    if (PREVIEW) {
      /* Studio drives everything from here; still connect() so the
         preview renders LIVE states (token shared via same-origin
         localStorage with the sidebar remote) */
      document.getElementById("screenName").textContent = "waiting for Studio…";
      previewListen();
      connect();
      return;
    }
  }
  let loaded;
  try {
    loaded = await loadConfig(WS_PEEK || localStorage.getItem("hakr_ws"));
  } catch (err) {
    document.getElementById("screenName").textContent = "⚠ " + err.message;
    return;
  }
  WS = loaded.ws;
  /* CANONICAL ADDRESS v2 (v0.48.3 — Suresh: "it should be
     workspacename/index.html everywhere"): whatever door you came in
     through — bare engine path, stub, hidden pin — the address bar
     ends at <ws>/index.html, MAIN INCLUDED (main gets its own stub
     dir server-side). The bar always tells the truth about which
     world you're in; a refresh re-enters through the stub. Rewrite
     only when the loaded workspace is certain (never on fallback). */
  if (/\/index\.html$/.test(location.pathname) &&
      !location.pathname.endsWith("/" + loaded.ws + "/index.html") &&
      (!WS_PEEK || loaded.ws === WS_PEEK))
    history.replaceState(null, "", loaded.ws + "/index.html");
  applyConfig(loaded.cfg, localStorage.getItem("hakr_device"));
  if (loaded.missed)
    flashBar("Workspace '" + loaded.missed + "' not deployed — using main", "off");
  connect();
})();

</script>
