<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>HA Remote — v0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
:root {
    --bg: #0d0f12;
    --tile: #1a1e24;
    --tile-hi: #232932;
    --text: #e8eaed;
    --dim: #8a919c;
    --accent: #ffb300;
    --on: #ffd54f;
    --wash: rgba(255,179,0,.10);
    --danger: #e05252;
    --radius: 12px;
    /* LAYOUT & TYPE (v0.27) — theme-tunable; per-page overrides later */
    --tile-h: 84px;
    --font-1: system-ui, Roboto, sans-serif;   /* primary: labels/titles */
    --fs-1: 15px;
    --fw-1: 600;
    --font-2: var(--font-1);                   /* secondary: subs/hints */
    --fs-2: 13px;
    --fw-2: 400;
    /* MUSIC-PLAYER TYPE (v0.52.1; v0.53 — Suresh: "you have the
       fields right there — why not open them up"): full face·size·
       weight pairs for screens declaring font_scope: music (music
       controller, library, queue). Every knob FOLLOWS the global
       pair unless the theme sets it — no derived opinions. */
    --font-m1: var(--font-1);
    --fs-m1: var(--fs-1);
    --fw-m1: var(--fw-1);
    --font-m2: var(--font-2);
    --fs-m2: var(--fs-2);
    --fw-m2: var(--fw-2);
    --icon-zone: 52px;      /* row-tile icon disc */
    --icon-radius: 50%;     /* 50% = circle · 14px = squircle · 0 = square */
    --tile-gap: 14px;       /* icon ↔ text */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-1);
    font-size: var(--fs-1); line-height: 1.35;
    overflow: hidden; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 520px; margin: 0 auto; }
  /* the music scope (navigate() toggles it from sc.font_scope);
     icon glyphs keep their own family via .material-symbols-outlined */
  #app.scr-music #grid, #app.scr-music #brbar, #app.scr-music #banner {
    font-family: var(--font-m1); font-size: var(--fs-m1);
  }
  #app.scr-music .tile .lbl { font-weight: var(--fw-m1); }
  #app.scr-music .tile.row .lbl,
  #app.scr-music .tile.wgt-qrow .lbl,
  #app.scr-music .npt { font-size: calc(var(--fs-m1) + 2px); }
  #app.scr-music .npt { font-weight: var(--fw-m1); }
  #app.scr-music .tile .sub {
    font-family: var(--font-m2); font-size: var(--fs-m2); font-weight: var(--fw-m2);
  }
  #app.scr-music .npa { font-family: var(--font-m2); font-size: calc(var(--fs-m2) + 1px); font-weight: var(--fw-m2); }
  #app.scr-music .npb { font-family: var(--font-m2); font-size: calc(var(--fs-m2) - 1px); font-weight: var(--fw-m2); }

/* status bar — ONE line, always: back chevron (when history) +
     ellipsized title + compact perf readout */
  #bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px 4px; font-size: 13px; color: var(--dim);
  }
  #backBtn {
    flex: 0 0 auto; width: 44px; height: 34px; border-radius: 10px;
    border: 0; background: var(--tile-hi); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  #backBtn > * { pointer-events: none; }
  #backBtn .material-symbols-outlined { font-size: 20px; }
  /* BROWSER CHROME (v0.48.1 — Suresh: "how do I turn off the activity?
     Or Go Back a page? Or go home?"): app-level Home + End-activity
     live in the TITLE BAR — always reachable, never crowding the
     grid. Hidden on physical-key remotes (they have real keys). */
  #homeBtn, #endBtn {
    flex: 0 0 auto; width: 44px; height: 34px; border-radius: 10px;
    border: 0; background: var(--tile-hi); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  #homeBtn > *, #endBtn > * { pointer-events: none; }
  #homeBtn .material-symbols-outlined,
  #endBtn .material-symbols-outlined { font-size: 20px; }
  #endBtn { color: var(--danger, #ff5a5f); }
  #bar .name {
    font-size: var(--bar-fs, 17px); font-weight: 650; color: var(--text); flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  /* passthrough-mode cue: 2px accent rule + gamepad glyph — the D-pad
     is driving the DEVICE here (and hold-Back/Home send device keys) */
  #bar.pt { border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
  #ptIc { font-size: 18px; color: var(--accent); flex: 0 0 auto; }

  /* two-press confirm cue: the bar title pulses for the whole confirm
     window — red when the pending action turns things OFF, accent
     when it turns things ON / starts an activity */
  @keyframes cfmpulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  #bar .name.cfm-off { color: var(--danger); animation: cfmpulse .9s ease-in-out infinite; }
  #bar .name.cfm-on { color: var(--accent); animation: cfmpulse .9s ease-in-out infinite; }

  /* key-event debug card (global.debug / #debug=1) — raw key delivery,
     newest line first, for diagnosing shell/KeyMapper behavior */
  #dbg {
    flex: 0 0 auto; margin: 0 12px 6px; padding: 6px 10px;
    background: #151a20; border: 1px solid var(--accent); border-radius: 10px;
    font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: var(--text); white-space: pre; overflow: hidden;
  }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); flex: 0 0 auto; }
  #dot.ok { background: #4caf7d; }
  #info { color: var(--dim); font-size: 20px; cursor: pointer; padding: 4px; }
  #perf { font-variant-numeric: tabular-nums; white-space: nowrap; flex: 0 0 auto; }

  /* banner (screen-level hero, from config) */
  #banner {
    position: relative; flex: 0 0 auto;
    background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: 46px;   /* air between title and the nav strip */
  }
  #banner.notabs { padding-bottom: 0; }   /* no strip: title truly centers */
  #banner .btitle { font-size: 34px; font-weight: 300; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  #banner .btime {
    position: absolute; top: 10px; right: 12px;
    background: rgba(0,0,0,.45); border-radius: 999px;
    padding: 4px 12px; font-size: 13px; font-variant-numeric: tabular-nums;
  }
  #banner .btitle.link { cursor: pointer; padding: 6px 20px; border-radius: 12px; }
  /* hero nav strip: small labels, BIG hit bands */
  #banner .hstrip {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex;
  }
  .hjump {
    flex: 1; min-height: 52px;
    display: flex; align-items: flex-end; padding: 0 14px 10px;
    font-size: 13px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: #d4d8dd;
    text-shadow: 0 1px 6px rgba(0,0,0,.75); cursor: pointer;
  }
  .hstrip .hjump:last-child { justify-content: flex-end; }
  .hstrip .hjump:only-child { justify-content: flex-start; }  /* a lone label is FIRST, not last */
  .hstrip .hjump:nth-child(2):not(:last-child) { justify-content: center; }
  .hjump.active { color: var(--accent); }
  .hjump.focused, #banner .btitle.focused {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px;
  }

/* per-section column override (preset grids etc.) */
  .secgrid { grid-column: 1 / -1; display: grid; gap: var(--grid-gap, 10px); }

  /* nav card, image style: full-bleed photo tiles (the old room card) */
  .tile.wgt-nav.nav-image {
    position: relative; padding: 0; min-height: 132px; overflow: hidden;
  }
  .tile.wgt-nav.nav-image .roomimg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: .85;
  }
  .tile.wgt-nav.nav-image .top {
    position: absolute; left: 12px; bottom: 10px; z-index: 1;
    text-shadow: 0 1px 8px rgba(0,0,0,.8);
  }
  .tile.wgt-nav.nav-image .lbl { font-size: calc(var(--fs-1) + 2px); }
  .tile.wgt-nav.nav-image .ic, .tile.wgt-nav.nav-image .sub,
  .tile.wgt-nav.nav-image .hint { display: none; }
  .tile.wgt-nav.nav-image.on { border-color: var(--accent); }

  /* now-playing art hero (media tile with art: true) */
  .tile.wgt-media.art .sub { display: none; }
  .npwrap { display: flex; gap: 12px; align-items: center; padding: 4px 0 8px; min-width: 0; }
  .npimg {
    width: 64px; height: 64px; border-radius: 10px; object-fit: cover;
    flex: 0 0 auto; background: #2c333d;
  }
  .npmeta { min-width: 0; flex: 1; }
  /* v0.52.1: the hero RIDES the theme (was 17px/600 + 14px + 12px
     hardcoded — Suresh: "doesn't honor it"); defaults unchanged
     (fs-1 15+2 = 17, fw-1 600 · fs-2 13+1 = 14 / 13-1 = 12, fw-2 400) */
  .npt { font-size: calc(var(--fs-1) + 2px); font-weight: var(--fw-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .npa { font-family: var(--font-2); font-size: calc(var(--fs-2) + 1px); font-weight: var(--fw-2); opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .npb { font-family: var(--font-2); font-size: calc(var(--fs-2) - 1px); font-weight: var(--fw-2); color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

  /* transport row: rew / big play-pause / ff */
  .trow { display: flex; align-items: center; justify-content: center; gap: 26px; padding: 6px 0 2px; }
  .trow .dpbtn { width: 64px; height: 52px; border-radius: 14px; }
  /* roving highlight: double ring reads on dark AND accent buttons */
  .tile.focused .trow .cvsel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  .trow .trbig { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: #1a1400; }
  .trow .trbig:active { background: var(--on); }
  .trow .trbig .material-symbols-outlined { font-size: 38px; }
  .tile.wgt-transport .top, .tile.wgt-transport .sub, .tile.wgt-transport .hint { display: none; }
  .tile.wgt-transport { min-height: 0; }

  /* device button bar: configurable row of device-command keys */
  .btnrow { display: flex; align-items: center; gap: 12px; padding: 4px 0 2px; }
  .btnrow .dpbtn { flex: 1; height: 50px; border-radius: 14px; border: 2px solid transparent; }
  /* roving highlight inside a button row (◀▶ while the tile is focused) */
  .tile.focused .btnrow .cvsel { border-color: var(--accent); }
  .tile.wgt-buttons .top, .tile.wgt-buttons .sub, .tile.wgt-buttons .hint { display: none; }
  .tile.wgt-buttons { min-height: 0; }
  /* media mode bar (shuffle/repeat): accent icon = mode active */
  .tile.wgt-mediabtns .top, .tile.wgt-mediabtns .sub, .tile.wgt-mediabtns .hint { display: none; }
  .tile.wgt-mediabtns { min-height: 0; }
  .btnrow .dpbtn.mbon { color: var(--accent); }
  .tile.wgt-coverbtns .top, .tile.wgt-coverbtns .sub { display: none; }
  .tile.wgt-coverbtns { min-height: 0; }

  /* device detail primitives: power / stepper / chips.
     Detail rows are CHROME-LIGHT: no headings (a small dim icon in the
     top slot instead), no state line, tight padding. Back is GLOBAL —
     the status-bar chevron — so details carry no back of their own. */
  .pwrow { display: flex; justify-content: center; padding: 6px 0 2px; }
  .pwbtn { width: 64px; height: 64px; border-radius: 50%; }
  .pwbtn .material-symbols-outlined { font-size: 30px; }
  .tile.wgt-power.on .pwbtn { background: var(--accent); color: #1a1400; }
  .tile.wgt-power .sub, .tile.wgt-power .top { display: none; }
  .tile.wgt-power { min-height: 0; background: transparent; }
  .steprow { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 2px 0; }
  .steprow .dpbtn { width: 72px; height: 62px; border-radius: 16px; flex: 0 0 auto; }
  .stepval {
    flex: 1; text-align: center;
    font-size: 42px; font-weight: 300; font-variant-numeric: tabular-nums;
  }
  .tile.wgt-stepper, .tile.wgt-chips { min-height: 0; }
  .tile.wgt-stepper .sub, .tile.wgt-chips .sub { display: none; }
  /* stepper slider: fat touch track, fill = value; −/+ row stays below */
  .sldr {
    position: relative; height: 44px; border-radius: 12px;
    background: #2c333d; overflow: hidden; margin: 6px 0 10px;
    touch-action: none; cursor: pointer;
  }
  .sldr i {
    display: block; position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: var(--accent); transition: none;
  }
  .sldr.vert { height: 300px; width: 92px; margin: 6px auto 10px; }
  .sldr.vert i { top: auto; right: 0; bottom: 0; left: 0; width: 100%; height: 0%; }
  .tile.wgt-stepper .top .ic, .tile.wgt-chips .top .ic { color: var(--dim); }
  .tile .lbl:empty { display: none; }
  /* option buttons: preset-tile sized, 3-up grid */
  .chiprow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 6px 0 2px; }
  .chip {
    border: 0; font: inherit; font-size: 15px; color: var(--text);
    background: var(--tile-hi); border-radius: 14px; min-height: 56px;
    padding: 8px 6px; cursor: pointer;
  }
  .chip.on { background: var(--accent); color: #1a1400; font-weight: 700; }

  /* preset tiles: icon-first squares */
  .tile.wgt-preset { min-height: 78px; padding: 10px 6px; text-align: center; }
  .tile.wgt-preset .top { display: block; }
  .tile.wgt-preset .top .ic { width: auto; font-size: 30px; display: block; margin: 0 auto 4px; }
  .tile.wgt-preset .top img { width: 42px; height: 42px; border-radius: 10px; display: block; margin: 0 auto 4px; object-fit: cover; }
  .tile.wgt-preset .lbl { font-size: 11px; display: block; }
  .tile.wgt-preset .sub, .tile.wgt-preset .hint { display: none; }

  /* KSLOT (v0.56 — the remote-creation screen's key face): one slot of
     a described remote. Same icon-first stack as a preset tile —
     glyph on top, the slot's NAME under it, and the raw keys it has
     learned under that. The sub stays VISIBLE here (a preset hides
     it): on this screen the legend is the whole point. A blank slot
     carries no label and .lbl:empty collapses it to a spacer. */
  .tile.wgt-kslot { min-height: 78px; padding: 10px 6px; text-align: center; }
  .tile.wgt-kslot .top { display: block; }
  .tile.wgt-kslot .top .ic {
    width: auto; font-size: 22px; line-height: 1.15;
    display: block; margin: 0 auto 3px;
  }
  .tile.wgt-kslot .lbl { font-size: 12px; display: block; overflow-wrap: anywhere; }
  /* a custom slot has no glyph — its NAME is the key legend, so it
     gets the glyph's size instead of whispering at label size */
  .tile.wgt-kslot.noglyph .top .ic { display: none; }
  .tile.wgt-kslot.noglyph .lbl { font-size: 17px; padding-top: 2px; }
  .tile.wgt-kslot.kblank { opacity: .3; }
  .tile.wgt-kslot .sub {
    font-size: 10.5px; margin-top: 3px; opacity: .85; overflow-wrap: anywhere;
  }
  .tile.wgt-kslot .hint { display: none; }

/* screen grid */
  #grid {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr;
    grid-auto-rows: max-content;
    gap: var(--grid-gap, 10px); padding: 10px 12px 14px; align-content: start;
    overflow-y: auto;
    /* v0.53 (Suresh: "scrolled right to top, eating the small
       padding"): a fresh page always opens AT the top (navigate
       resets scrollTop — the grid keeps its scroll position across
       innerHTML swaps, so the previous page's scroll used to leak
       in); scroll-margin makes hero jumps and focus scrolls honor
       the padding instead of pinning anchors flush */
    scroll-padding-top: 10px; scroll-padding-bottom: 14px;
    scrollbar-width: thin;                      /* Firefox */
    scrollbar-color: var(--tile-hi, #2c333d) transparent;
  }
  .shead {
    grid-column: 1 / -1; color: var(--dim);
    font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .07em;
    padding: 10px 4px 0;
  }
  .tile {
    background: var(--tile); border-radius: var(--radius);
    padding: var(--tile-pad-y, 12px) var(--tile-pad-x, 14px); min-height: var(--tile-h);
    border: 2px solid transparent;
    display: block;
    min-width: 0;               /* let grid columns shrink below content */
    transition: background .12s, border-color .12s;
  }
  .tile.span2 { grid-column: span 2; }
  .tile.focused {
    border-color: var(--accent);
    background: linear-gradient(0deg, var(--wash), var(--wash)), var(--tile-hi);
  }
  .tile.captured { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,179,0,.25), inset 0 0 22px rgba(255,179,0,.08); }
  .tile.confirm {
    border-color: var(--danger);
    background: linear-gradient(0deg, rgba(224,82,82,.14), rgba(224,82,82,.14)), var(--tile-hi);
  }
  .tile.confirm .sub { color: var(--danger) !important; font-weight: 600; }
  /* major-tile confirm cue: the screen's first tile pulses with the
     pending action's tone (red = about to turn OFF, accent = ON) */
  .tile.cfm-off {
    border-color: var(--danger);
    background: linear-gradient(0deg, rgba(224,82,82,.14), rgba(224,82,82,.14)), var(--tile-hi);
    animation: cfmpulse .9s ease-in-out infinite;
  }
  .tile.cfm-on {
    border-color: var(--accent);
    background: linear-gradient(0deg, var(--wash), var(--wash)), var(--tile-hi);
    animation: cfmpulse .9s ease-in-out infinite;
  }
  .tile .top { display: flex; align-items: center; gap: 10px; min-width: 0; }
  /* browse thumbnails that are brand WORDMARKS (v0.49.1: "SONOS"
     was center-cropping to "N") — contain on a light chip */
  .tile .top > img.contain, .tile.row .icwrap img.contain {
    object-fit: contain; background: #e8eaed; padding: 2px;
  }
  .tile .top > img {
    width: 28px; height: 28px; object-fit: cover;
    border-radius: 7px; flex: 0 0 auto;
  }
  .tile .top .lbl {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile .ic { font-size: 22px; width: 28px; text-align: center; }
  .tile .ic.material-symbols-outlined { font-size: 24px; }
  .tile .lbl { font-weight: var(--fw-1); }
  .tile .sub { color: var(--dim); font-family: var(--font-2); font-size: var(--fs-2); font-weight: var(--fw-2); margin-top: 6px; min-height: 17px; }
  /* inline sub: value on the title line, right-aligned, a notch bigger */
  .tile .sub.subin {
    margin: 0 0 0 auto; min-height: 0; flex-shrink: 0;
    font-size: var(--fs-1); padding-left: 8px;
  }
  .tile.on .ic, .tile.on .icwrap .material-symbols-outlined { color: var(--on); }
  .tile.on .sub { color: var(--accent); }
  /* per-tile accent (v0.48.3 — Suresh: "simply color the icon circle
     background and leave it at that"): an activity's ACCENT paints
     its icon circle — identity, not state; icon flips to bg ink for
     contrast on any accent shade */
  .tile.tacc.row .icwrap { background: var(--tacc); }   /* beats controls.css default */
  .tile.tacc .icwrap .ic,
  .tile.tacc .icwrap .material-symbols-outlined { color: var(--bg); }
  .tile .hint { font-size: 11px; color: var(--dim); margin-top: 4px; display: none; }
  .tile.captured .hint { display: block; color: var(--accent); }

  /* SLIM THEMED SCROLLBAR (v0.47.3 — desktop browsers drew the stock
     Windows bar; the kiosk's overlay bar auto-hides so it was never
     seen on-device). Touch + wheel unaffected. */
  #grid::-webkit-scrollbar { width: 6px; }
  #grid::-webkit-scrollbar-track { background: transparent; }
  #grid::-webkit-scrollbar-thumb {
    background: var(--tile-hi, #2c333d); border-radius: 3px; }
  #grid::-webkit-scrollbar-thumb:hover { background: var(--wash, #3a4250); }

  /* ---- BROWSE BANDS (v0.50 — Suresh's mock): fixed, vertically
     tight; the grid below keeps every remaining pixel ---- */
  #brbar { display: none; flex-direction: column; gap: 4px; padding: 2px 14px 6px; }
  #brbar.onbar { display: flex; }
  /* SLIM scrollbars (v0.50.2 — Suresh: "much more minimalist…
     a little padding between the options and the scrollbar"):
     standard properties only — Chrome IGNORES ::-webkit-scrollbar
     styling once scrollbar-width is set, which is why the fat
     native bar appeared */
  .brrow {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
    scrollbar-width: thin; scrollbar-color: var(--tile-hi) transparent;
  }
  .brroot {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
    gap: 2px; min-width: 84px; padding: 6px 10px 5px; cursor: pointer;
    background: var(--tile); color: var(--text);
    border: 1px solid transparent; border-radius: 10px; font: inherit;
  }
  .brroot.on {
    border-color: var(--accent);
    background: linear-gradient(0deg, var(--wash), var(--wash)), var(--tile-hi);
  }
  .brroot img {
    width: 34px; height: 34px; border-radius: 7px;
    object-fit: contain; background: #e8eaed; padding: 2px;
  }
  .brroot .material-symbols-outlined {
    font-size: 26px; height: 34px; display: flex; align-items: center;
  }
  .brl {
    font-size: 11.5px; max-width: 110px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brchips {
    display: flex; gap: 16px; overflow-x: auto; padding: 2px 2px 6px;
    scrollbar-width: thin; scrollbar-color: var(--tile-hi) transparent;
  }
  .brchip {
    flex: 0 0 auto; background: none; border: 0; cursor: pointer; font: inherit;
    color: var(--dim); font-weight: 750; letter-spacing: .07em;
    text-transform: uppercase; font-size: 12.5px; padding: 3px 1px 5px;
    border-bottom: 2px solid transparent;
  }
  .brchip.on { color: var(--accent); border-bottom-color: var(--accent); }
  /* browse ITEM tiles: art-forward, centered column */
  .tile.brw:not(.row) { text-align: center; }
  .tile.brw:not(.row) .top { flex-direction: column; gap: 6px; }
  .tile.brw:not(.row) .top > img { width: 58px; height: 58px; border-radius: 10px; }
  .tile.brw:not(.row) .top .lbl { width: 100%; }
  .tile.brw:not(.row) .ic.material-symbols-outlined { font-size: 34px; width: auto; height: 58px; display: inline-flex; align-items: center; }
  .tile.brw .sub { display: none; }
  /* browse tiles' trailing ▶ shrinks to a CORNER BADGE (v0.50) — the
     full-height right zone ate 60% of a narrow 3-col tile, so center
     taps played instead of drilling */
  .tile.brw.has-trail { padding-right: 0; }
  .tile.brw .trail {
    top: 4px; right: 4px; bottom: auto; left: auto;
    width: 28px; height: 28px; border-radius: 8px;
  }
  .tile.brw .trail .ic.material-symbols-outlined { font-size: 18px; }

  /* QUEUE rows (v0.51.1 — Suresh's mock): bigger art, bold title,
     artist · album on line two, live ▶ hard right.
     v0.52.1 (Suresh: "doesn't honor the theme… needs ellipsis"):
     the title RIDES Primary — weight is theme+100 (bolder than the
     house, never a hardcoded 700) — and both lines ellipsize instead
     of wrapping. */
  .tile.wgt-qrow { position: relative; }
  .tile.wgt-qrow .icwrap { width: 56px; height: 56px; border-radius: 10px; }
  /* weight/size come from the MUSIC theme fields (the queue is always
     font_scope: music — v0.53: no derived +100 opinion, the knob is
     the theme's) */
  .tile.wgt-qrow .lbl {
    font-size: calc(var(--fs-1) + 2px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile.wgt-qrow .txt { padding-right: 44px; }
  .tile.wgt-qrow .sub {
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .qnowic {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    color: var(--accent); font-size: 28px; display: none;
  }
  .tile.wgt-qrow.on .qnowic { display: block; }

/* trailing action: full-height touch zone on the tile's right edge */
  .tile.has-trail { position: relative; padding-right: 76px; }
  .trail {
    position: absolute; top: 6px; right: 6px; bottom: 6px; width: 60px;
    border: 2px solid transparent; border-radius: calc(var(--radius) - 4px);
    background: var(--tile-hi); color: var(--dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font: inherit; padding: 0; overflow: hidden;
  }
  .trail > * { pointer-events: none; }
  .trail .ic { width: auto; }
  .trail .ic.material-symbols-outlined { font-size: 26px; }
  .trail:active { background: var(--accent); color: #1a1400; }
  .trail.focused {
    border-color: var(--accent); color: var(--text);
    background: linear-gradient(0deg, var(--wash), var(--wash)), var(--tile-hi);
  }
  .meter { height: 4px; border-radius: 2px; background: #2c333d; margin-top: 8px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .15s; }

  /* touch buttons (dpad + volume) */
  .dpbtn {
    border: 0; color: var(--text); background: var(--tile-hi);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font: inherit; padding: 0;
  }
  .dpbtn:active { background: var(--accent); color: #1a1400; }
  .dpbtn > * { pointer-events: none; }
  .dpbtn { overflow: hidden; }
  .dp-wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0 4px; }
  .dp-side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .dp-side .dpbtn { width: 46px; height: 58px; border-radius: 14px; }
  .dp-cap { font-size: 10px; color: var(--dim); letter-spacing: .12em; }
  .dp-mid { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 1; }
  .dp-corners { width: 100%; max-width: 240px; display: flex; justify-content: space-between; }
  .dp-corners .dpbtn { width: 46px; height: 46px; border-radius: 50%; }
  .dp-pad {
    position: relative; width: 212px; height: 212px;
    border-radius: 50%; background: #2a313b;
    box-shadow: inset 0 2px 10px rgba(0,0,0,.35);
  }
  .dp-pad .dpbtn {
    position: absolute; width: 64px; height: 64px;
    border-radius: 50%; background: transparent;
  }
  .dp-pad .dpbtn:active { background: rgba(255,255,255,.14); color: var(--text); }
  .dp-pad .up { top: 4px; left: 50%; transform: translateX(-50%); }
  .dp-pad .dn { bottom: 4px; left: 50%; transform: translateX(-50%); }
  .dp-pad .lf { left: 4px; top: 50%; transform: translateY(-50%); }
  .dp-pad .rt { right: 4px; top: 50%; transform: translateY(-50%); }
  .dp-pad .ok {
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 76px; height: 76px;
    background: var(--accent); color: #1a1400; font-weight: 800;
  }
  .dp-pad .ok:active { background: var(--on); }
  .tile.wgt-dpad { min-height: 412px; }
  .volrow { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .volrow .dpbtn { width: 58px; height: 46px; border-radius: 12px; flex: 0 0 auto; }
  .volrow .meter { flex: 1; margin-top: 0; height: 6px; }

  /* list-row variant (grid.columns = 1) — height rides the global
     tile-height knob (6px slimmer than grid tiles, matching the 84/78
     defaults); --tile-row-h overrides independently (Code tab) */
  .tile.row {
    display: flex; flex-direction: row; align-items: center; gap: var(--tile-gap);
    min-height: var(--tile-row-h, calc(var(--tile-h) - 6px));
    padding: var(--tile-pad-y, 12px) var(--tile-pad-x, 16px);
  }
  .tile.row .icwrap {
    flex: 0 0 auto; width: var(--icon-zone); height: var(--icon-zone);
    border-radius: var(--icon-radius);
    background: #262c35; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .tile.row .icwrap .material-symbols-outlined { font-size: calc(var(--icon-zone) * .52); }
  .tile.row .icwrap .ic { width: auto; font-size: calc(var(--icon-zone) * .48); }
  .tile.row .icwrap img { width: 100%; height: 100%; object-fit: cover; }
  .tile.row .txt { flex: 1; min-width: 0; }
  .tile.row .lbl { font-size: calc(var(--fs-1) + 2px); }   /* rides Primary (15→17 default) */
  .tile.row .sub { margin-top: 3px; }

/* auth overlay */
  #auth {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; justify-content: center;
    padding: 32px; gap: 12px; z-index: 10;
  }
  #auth h2 { margin: 0 0 4px; font-weight: 650; }
  #auth p { color: var(--dim); margin: 0 0 10px; font-size: 14px; }
  #auth input {
    background: var(--tile); color: var(--text);
    border: 1px solid #2c333d; border-radius: 10px;
    padding: 12px; font-size: 14px; width: 100%;
  }
  #auth button {
    background: var(--accent); color: #1a1400; font-weight: 700;
    border: 0; border-radius: 10px; padding: 12px; font-size: 15px;
  }
  #auth .err { color: var(--danger); font-size: 13px; min-height: 17px; }
  .hidden { display: none !important; }

</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="backBtn" class="hidden"><span class="material-symbols-outlined">arrow_back</span></button>
    <button id="homeBtn" class="hidden"><span class="material-symbols-outlined">home</span></button>
    <span id="ptIc" class="material-symbols-outlined hidden">sports_esports</span>
    <span class="name" id="screenName">—</span>
    <span id="perf" class="hidden"></span>
    <button id="endBtn" class="hidden" title="End the running activity"><span class="material-symbols-outlined">power_settings_new</span></button>
    <span id="info" class="material-symbols-outlined" title="tap: status · hold: key capture">info</span>
    <span id="dot"></span>
  </div>
  <div id="dbg" class="hidden"></div>
  <div id="banner" class="hidden"></div>
  <div id="brbar"></div>
  <div id="grid"></div>
</div>

<div id="auth" class="hidden">
  <h2>Connect to Home Assistant</h2>
  <p>Create a long-lived access token in HA (Profile → Security) and paste it here. Stored only in this browser.</p>
  <input id="hostIn" placeholder="Host (e.g. 192.168.1.87:8123)">
  <input id="tokenIn" placeholder="Long-lived access token" autocomplete="off">
  <button id="connectBtn">Connect</button>
  <div class="err" id="authErr"></div>
</div>

<script>
"use strict";
/* ================================================================
   HA Remote — single-file engine.

   Architecture in one breath: config.json (pure data: screens,
   sections, tiles, activities, context, keymap, theme) is rendered
   by this engine over a filtered Home Assistant websocket —
   subscribe_entities with entity_ids means we receive diffs for
   ONLY the entities on the current screen (~20 msgs, not the
   full-instance firehose the stock frontend drinks).

   Load-bearing concepts, in reading order below:
   · Device profiles / CAPS   — capability set drives tile
     visibility (only/unless) and input behavior per device.
   · Context                  — screen `context` overlaid by the
     active activity's; `$context.slot` is the ONLY substitution.
   · Activities               — HA scripts + an input_select HA
     owns; select=start/open, hold|power=end (inline confirm).
   · Detail screens           — virtual screens generated per
     domain (power/stepper/chips); options come from attributes.
   · Widget catalog           — one tile chassis, per-type adapters
     (sub/isOn/meter/select/capture/body/wire/render).
   · Focus                    — spatial D-pad nav from DOM rects;
     capture mode gives a widget the D-pad; trailing zones and
     hero elements are extra focus stops.
   · Passthrough              — on screens declaring
     dpad_passthrough, PHYSICAL keys drive the device (Harmony
     rule); touch always drives the UI.
   ================================================================ */
const T0 = performance.now();

/* Gesture/flow tunables (ms). Candidates for shell settings later. */
const TIMING = {
  hold: 450,          // select held this long = hold gesture
  powerHold: 600,     // power held this long = All Off
  confirm: 5000,      // two-press confirm window (tile + status bar)
  presetPoll: 300     // ensure-activity: poll interval for state flip
};

/* ================================================================
   CONFIG — loaded from config.json at boot. Everything user-
   specific (screens, sections, activities, keymap, theme) is data.
   ================================================================ */
let CONFIG = null;
let WS = "main";  /* WORKSPACE (v0.34) — which world this remote lives
                     in. main = the repo-built config.json; any other
                     id loads config.<ws>.json (Studio-published).
                     Provisioned like `device`: #ws=bedroom once →
                     localStorage. Rides along on harmonium.* service
                     calls so sequences run from the right workspace. */
let DEVICE = {};                              // active device profile
let CAPS = new Set(["touch", "pointer"]);     // its capabilities

let KEYMAP = {                    // default shell quirk table
  "ArrowUp": "up", "ArrowDown": "down", "Tab": "down",
  "ArrowLeft": "left", "ArrowRight": "right",
  "Enter": "select", " ": "select",
  "+": "vol_up", "=": "vol_up", "-": "vol_down",
  "PageUp": "ch_up", "PageDown": "ch_down",
  "m": "mute", "M": "mute",
  "`": "mute", "AudioVolumeMute": "mute",      // Astrion mute = backtick (kc 192)
  "[": "back", "Escape": "back", "Backspace": "back",
  "]": "home", ";": "home",
  "F1": "home", "BrowserHome": "home",          // Astrion home = F1 (kc 112)
  "{": "back_hold", "}": "home_hold",           // shell long-press keys
  "#": "menu",                                   // Astrion menu key
  "@": "menu_hold",                              // menu long-press (KeyMapper)
  "F2": "power", "p": "power", "P": "power",
  "o": "power_hold", "O": "power_hold"
};

async function loadConfig(ws) {
  /* a non-main workspace reads its own deployed file; if it isn't
     there (deleted, never published) fall back to main so the remote
     still boots — with a flag the caller can surface */
  if (ws && ws !== "main") {
    const r = await fetch("config." + ws + ".json", { cache: "no-store" });
    if (r.ok) return { cfg: await r.json(), ws };
  }
  const r = await fetch("config.json", { cache: "no-store" });
  if (!r.ok) throw new Error("config.json: HTTP " + r.status);
  return { cfg: await r.json(), ws: "main", missed: ws && ws !== "main" ? ws : null };
}

let THEMED = [];   /* vars set by the last applyTheme — cleared first so
                      a REMOVED key falls back to the stylesheet default
                      (live Studio editing relies on this) */
function applyTheme(theme) {
  for (const k of THEMED) document.documentElement.style.removeProperty(k);
  THEMED = [];
  for (const [k, v] of Object.entries(theme || {})) {
    document.documentElement.style.setProperty("--" + k, v);
    THEMED.push("--" + k);
  }
}

/* ================================================================
   Websocket client: auth → filtered subscribe_entities → diffs.
   ================================================================ */
const S = {
  states: new Map(), ws: null, msgId: 0, pending: new Map(),
  subId: null, connected: false,
  screen: null, stack: [],
  focusId: null, captured: false,
  confirmTile: null, confirmTimer: null,
  lastAct: undefined, tileSig: null,
  msgCount: 0, painted: false
};

function haUrl() {
  const host = localStorage.getItem("hakr_host") ||
    (location.protocol.startsWith("http") ? location.host : "");
  const proto = (location.protocol === "https:") ? "wss" : "ws";
  return host ? `${proto}://${host}/api/websocket` : null;
}

function connect() {
  const url = haUrl(), token = localStorage.getItem("hakr_token");
  if (!url || !token) return showAuth("");
  const ws = new WebSocket(url);
  S.ws = ws;
  ws.onmessage = ev => {
    S.msgCount++;
    S.lastMsg = Date.now();
    const m = JSON.parse(ev.data);
    if (m.type === "auth_required") ws.send(JSON.stringify({ type: "auth", access_token: token }));
    else if (m.type === "auth_invalid") {
      const len = (token || "").length;
      localStorage.removeItem("hakr_token");
      showAuth(`Token rejected by HA (received ${len} chars — a valid token is ~180+). Recreate the token and retry.`);
    }
    else if (m.type === "auth_ok") { S.connected = true; dot(true); subscribeFor(S.screen); }
    else if (m.type === "result" && S.pending.has(m.id)) { S.pending.get(m.id)(m); S.pending.delete(m.id); }
    else if (m.type === "event" && m.id === S.subId) applyDiff(m.event);
  };
  ws.onclose = () => { S.connected = false; dot(false); setTimeout(connect, 1500 + Math.random() * 1500); };
  ws.onerror = () => ws.close();
}

/* STALENESS WATCHDOG (v0.33): kiosk webviews doze — the socket can die
   with no close event and the page silently freezes ("needs a refresh
   to pick up state"). Ping every 25s; a silent minute force-closes the
   socket so the reconnect loop heals it. Waking from hidden also
   resubscribes for fresh adds. */
setInterval(() => {
  if (!S.connected || !S.ws) return;
  if (Date.now() - (S.lastMsg || 0) > 60000) { try { S.ws.close(); } catch (e) {} return; }
  send({ type: "ping" });
}, 25000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.connected) subscribeFor(S.screen);
});

function send(msg, cb) {
  if (!S.connected && msg.type !== "auth") return;
  msg.id = ++S.msgId;
  if (cb) S.pending.set(msg.id, cb);
  S.ws.send(JSON.stringify(msg));
  return msg.id;
}

/* call_service that WANTS the response (v0.51: queue adapters probe
   platform services — sonos.get_queue, mass_queue.get_queue_items —
   and need both the payload and the failure) */
function callServiceResp(domain, service, data, entityId, cb) {
  const msg = { type: "call_service", domain, service,
    service_data: data || {}, return_response: true };
  if (entityId) msg.target = { entity_id: entityId };
  return send(msg, cb);
}

function callService(domain, service, data, entityId) {
  const msg = { type: "call_service", domain, service, service_data: data || {} };
  /* harmonium.* calls route to THIS remote's workspace — the ONE
     injection point, so run/set_activity always hit the right world.
     Main omits the key (byte-identical with pre-workspace payloads). */
  if (domain === "harmonium" && WS !== "main")
    msg.service_data = Object.assign({ workspace: WS }, msg.service_data);
  if (entityId) msg.target = { entity_id: entityId };
  send(msg);
}

/* ================================================================
   Context: screen context overlaid by the ACTIVE activity's context
   (activity read live from the state of global.activity_select).
   ================================================================ */
function currentActivityId() {
  /* PREVIEW IMPERSONATION (v0.46.1): the Studio names the activity
     being EDITED — the preview then renders the player exactly as
     that activity will see it (cast, dialect keys, apps), instead of
     whatever the live select happens to hold. Preview-only. */
  if (S.pvActivity && (CONFIG.activities || {})[S.pvActivity]) return S.pvActivity;
  const sel = CONFIG.global.activity_select;
  if (sel) {
    const v = st(sel).s;
    for (const [id, a] of Object.entries(CONFIG.activities || {}))
      if ((a.state_value || id) === v) return id === "off" ? null : id;
  }
  /* PENDING IMPERSONATION (v0.48 — Suresh: "I should never see that
     page. It should always fill in"): the select doesn't (yet, or at
     all) confirm an activity, but the user TAPPED one — render the
     player AS that activity anyway. Its tiles show the devices' true
     (off) state; only tile TRUTH (isActivityActive) stays with the
     select/device rules. Cleared naturally: the select confirming any
     activity wins above, and the next tap overwrites. */
  if (S.pendingActivity && (CONFIG.activities || {})[S.pendingActivity])
    return S.pendingActivity;
  return null;
}
function ctxFor(screenId) {
  const scCtx = (screenOf(screenId) || {}).context || {};
  const aid = currentActivityId();
  const aCtx = aid ? (CONFIG.activities[aid].context || {}) : {};
  return Object.assign({}, scCtx, aCtx);
}
function resolveEntity(ref, screenId) {
  if (!ref || typeof ref !== "string" || !ref.startsWith("$context.")) return ref;
  const v = ctxFor(screenId || S.screen)[ref.slice(9)];
  return typeof v === "string" ? v : null;
}

/* Per-entity display options from config.entity_options —
   e.g. { "cover.x": { invert_position: true } }. Display-layer only;
   services are never inverted. */
function entOpt(e, key) {
  const o = (CONFIG && CONFIG.entity_options) || {};
  return o[e] ? o[e][key] : undefined;
}

/* ---- Screen classes (v0.11 key-policy taxonomy) -------------------
   Physical keys carry a POLICY PER PAGE CLASS, not one behavior:
     room     — Home→system home · Power→All Off (confirm)
     group    — Home→parent room · Power→page devices off/on (confirm)
     detail   — Home→parent room · Power→device toggle (immediate)
     activity — Home→parent room · Power→end activity (confirm)
   Explicit `class` in config wins; otherwise inferred. `parent` names
   the screen Home laddering climbs to (multi-room proof). */
function classOf(sc, id) {
  if (sc.class) return sc.class;
  if (typeof id === "string" && id.startsWith("detail:")) return "detail";
  if (sc.dpad_passthrough) return "activity";
  if (id === (CONFIG && CONFIG.home_screen) || sc.banner) return "room";
  return "group";
}
/* group-power scope: switchable device entities on the page */
const POWER_DOMAINS = new Set(["light", "switch", "fan", "climate", "media_player"]);
function powerEntities(sc) {
  const set = new Set();
  tilesOf(sc).forEach(t => {
    const e = resolveEntity(t.entity);
    if (e && POWER_DOMAINS.has(e.split(".")[0])) set.add(e);
  });
  return [...set];
}

/* Capability-based tile visibility: tile.only / tile.unless name
   capabilities from the active device profile (string or array). */
function visibleTile(t) {
  const arr = v => Array.isArray(v) ? v : [v];
  /* a context-bound tile whose role is UNWIRED here hides itself —
     the Volume 2 tile only appears when the activity wires volume_2 */
  if (typeof t.entity === "string" && t.entity.startsWith("$context.") &&
      !resolveEntity(t.entity)) return false;
  if (t.only && !arr(t.only).every(c => CAPS.has(c))) return false;
  if (t.unless && arr(t.unless).some(c => CAPS.has(c))) return false;
  /* per-activity content overrides on a SHARED controller: one Watch
     TV page, many activities — tiles opt in/out declaratively.
       when: { activity: watch_smart }        show only then
       when: { not_activity: [watch_smart] }  hide then
     Re-render rides tileSig: the filtered set changes with the
     activity, so the grid refreshes on activity switches. */
  if (t.when) {
    const cur = currentActivityId();
    if (t.when.activity && !arr(t.when.activity).includes(cur)) return false;
    if (t.when.not_activity && arr(t.when.not_activity).includes(cur)) return false;
  }
  return true;
}

/* ---- $item expansion ----------------------------------------------
   A "presets_from" tile generates one preset tile per element of an
   entity's LIST attribute — the chips move at tile scale: content read
   live from an entity HA owns, riding the normal subscription.
   "$item.<field>" is the only substitution (whole-string values, any
   depth), the per-row sibling of "$context.<slot>". */
function substItem(v, item) {
  if (typeof v === "string" && v.startsWith("$item.")) {
    const x = item[v.slice(6)];
    return x === undefined ? null : x;
  }
  if (Array.isArray(v)) return v.map(x => substItem(x, item));
  if (v && typeof v === "object") {
    const o = {};
    for (const [k, x] of Object.entries(v)) o[k] = substItem(x, item);
    return o;
  }
  return v;
}
/* APP CLASSES (v0.30): the master list is IDENTITY (name/icon/image);
   a device class is the platform's launch dialect — its entry per app
   IS the curation (listed = offered). Entry forms:
     source: X            → select_source on $context.media_player
     action/target/data   → any HA-style action (default entity: ctx mp)
     sequence: <id>       → run a named Action
   (+ optional name/icon/image overrides riding the entry). */
function classLaunch(e) {
  if (e == null) return null;
  if (typeof e === "string")
    return e.startsWith("sequence:")
      ? { service: "harmonium.run", data: { sequence: e.slice(9) } }
      : { service: "media_player.select_source",
          entity: "$context.media_player", data: { source: e } };
  if (e.sequence) return { service: "harmonium.run", data: { sequence: e.sequence } };
  if (e.source) return { service: "media_player.select_source",
    entity: "$context.media_player", data: { source: e.source } };
  if (e.service) return e;
  if (e.action) return { service: e.action, data: e.data,
    entity: (e.target && e.target.entity_id) || e.entity || "$context.media_player" };
  return null;
}

function expandTile(t) {
  if (t.type === "activities") {
    /* the activities section GENERATES from the registry: one tile
       per activity owned by this hub (t.room), in registry order.
       Room functions ("off") are hold-Power territory, not tiles. */
    return Object.entries(CONFIG.activities || {})
      .filter(([id, a]) => id !== "off" && (a.room_view || null) === (t.room || null))
      .map(([id, a]) => ({
        type: "activity", activity: id, id: t.id + "_" + id,
        label: a.name || id, icon: a.icon || "material:play_circle",
        color: a.color,          /* ACCENT tints the tile's ON state */

       Resolution: tile `dialect` (legacy `class`; literal or $context

       when exactly one exists. Nothing resolves → empty drawer. */
    const ctx = ctxFor(S.screen);
    let clsId = t.dialect || t.class || ctx.dialect || ctx.app_class;
    if (typeof clsId === "string" && clsId.startsWith("$context."))
      clsId = ctx[clsId.slice(9)];
    const classes = CONFIG.dialects || CONFIG.app_classes || {};
    if (!clsId && Object.keys(classes).length === 1) clsId = Object.keys(classes)[0];
    const cls = classes[clsId];
    if (!cls) return [];
    const reg = CONFIG.apps || {};
    const entries = cls.apps || {};
    const ids = Array.isArray(t.include)
      ? t.include.filter((x) => entries[x] != null) : Object.keys(entries);
    return ids.map((aid) => {
      const e = entries[aid], meta = reg[aid] || {};

    const ctx = ctxFor(S.screen);

    if (typeof dId === "string" && dId.startsWith("$context."))

    const entries = (dial && dial.keys) || {};

      const e = entries[kid] || {};

    const mp = resolveEntity(t.entity || "$context.media_player");

    const L0 = B.nodes[browseKey(mp, null)];

    /* FAVORITES PROMOTION (v0.50.3 — Suresh: "promote the Show

       a FLAT tree with populated sensors synthesizes the Sonos shape:
       ⭐ Favorites (sensor-fed, the DEFAULT root) + Music Library

    const favList = () => [["Playlists", "playlists"], ["Artists", "artists"],

      .map(([lbl, k]) => ({ lbl, k,

          can_expand: true, can_play: false },

          media_content_type: "__synth", media_class: "lib_root",
          can_expand: true, can_play: false },

        const cats = fc.map(x => ({ title: x.lbl,
          media_content_id: "__fav:" + x.k, media_content_type: "__synth",
          media_class: "directory", can_expand: true, can_play: false }));

        B.cat = brRef(selCat);
        B.ui = { roots: SROOTS, cats };
        const fav = fc.find(x => "__fav:" + x.k === B.cat.id) || fc[0];
        const FICON = { playlists: "material:queue_music",
          artists: "material:person", albums: "material:album",
          tracks: "material:music_note", radio: "material:radio" };
        return fav.items.map((it, i) => ({
          type: "preset", id: t.id + "_" + i, label: it.name, brw: true,
          icon: FICON[fav.k] || "material:library_music",
          ...(it.image ? { icon_image: it.image } : {}),
          action: { service: "media_player.play_media", target: mp,
            data: { media_content_id: it.uri,

      const selCat = roots.find(c => brSame(c, B.cat)) || roots[0];
      B.cat = brRef(selCat);
      B.ui = { roots: SROOTS, cats: roots };

      return L2;

      /* while L1 loads, DON'T flash the raw tree roots into band 1

         DEEP (Sonos): roots hold a layer of pure directories → roots

          B.cat = null;

    if (B.sub.length) {
      const top = B.sub[B.sub.length - 1];
      const Ln = B.nodes[browseKey(mp, top)];
      if (!Ln) { browseFetch(mp, top); return loading; }
      out.push({ type: "preset", id: t.id + "_up", span: 2, brw: true,
        icon: "material:arrow_back",
        label: Ln.title ? "\u2039 " + Ln.title : "\u2039 Back",

       always in sync with Setup (the Studio's "Unlink" bakes them
       into plain tiles when page-level art direction is wanted).
       remote.* entities are skipped: the control surface's Remote
       pad IS their tile — a stateless remote row is noise.
       A BARE generator (stock controllers): the cast comes from the

       otherwise it derives from the screen's own default context.
       surface.devices === false (the per-activity "auto-populate

        castAid = cur;

    const ents = castAid ? castOf(castAid)
      : castFromCtx((screenOf(S.screen) || {}).context || {});
    /* the COMMANDS CHANNEL is plumbing, not a device (v0.46.3 —
       Suresh's screenshot: "Hisense Projector ADB · Off" as a tile is
       noise): skip the entity wired to commands unless it also plays

    const ctx2 = ctxFor(S.screen);
    const cmdEnt = typeof ctx2.commands === "string" ? ctx2.commands : null;
    return ents.filter(e => e.split(".")[0] !== "remote")
      .filter(e => !(cmdEnt && e === cmdEnt && e !== ctx2.media_player &&
        !(dopts[e] && dopts[e].tile === true)))
      .filter(e => !(dopts[e] && dopts[e].tile === false)).map(e => {

        icon: dom === "media_player"
            ? (s.a.device_class === "tv" ? "material:tv" : "material:speaker")

          : dom === "light" ? "material:lightbulb"
          : dom === "climate" ? "material:thermostat"

    const g = Object.assign({ type: "preset" }, substItem(t.item || {}, item));
    g.id = t.id + "_" + i;

    if (g.icon_image == null) delete g.icon_image;   // fall back to g.icon

}

/* An activity's CAST: explicit devices list (Studio Setup v2), else

function castFromCtx(ctx) {
  const seen = [];

function castOf(aid) {

  if (!CONFIG || !screenId) return;   // preview mode: config not yet injected
  if (S.subId) { send({ type: "unsubscribe_events", subscription: S.subId }); S.subId = null; }
  S.subId = send({ type: "subscribe_entities", entity_ids: entitiesFor(screenId) });

function applyDiff(ev) {
  if (ev.a) for (const [eid, x] of Object.entries(ev.a))
    S.states.set(eid, { s: x.s, a: x.a || {} });
  if (ev.c) for (const [eid, ch] of Object.entries(ev.c)) {
    const cur = S.states.get(eid) || { s: null, a: {} };
    const plus = ch["+"];
    if (plus) {
      if (plus.s !== undefined) cur.s = plus.s;
      if (plus.a) Object.assign(cur.a, plus.a);
    }
    if (ch["-"] && ch["-"].a) ch["-"].a.forEach(k => delete cur.a[k]);
    S.states.set(eid, cur);
  }
  if (ev.r) ev.r.forEach(eid => S.states.delete(eid));

  /* activity changed → context may rebind: resubscribe current screen */
  const aid = currentActivityId();
  if (aid !== S.lastAct) { S.lastAct = aid; if (S.connected) subscribeFor(S.screen); }

  renderStates();
  if (!S.painted) {
    S.painted = true;
    S.bootMs = Math.round(performance.now() - T0);
    perf();
  }
}

/* ================================================================

       on:                                   # any of these shapes:
         all: [ {entity, state|equals|in|not_in, attribute?} ... ]
         any: [ ...conds ]

  if (!c || !c.entity) return false;

  if (c.state !== undefined)
    return Array.isArray(c.state) ? c.state.includes(v) : v === c.state;
  if (c.in) return Array.isArray(c.in) && c.in.includes(v);
  if (c.not_in) return Array.isArray(c.not_in) && !c.not_in.includes(v);
