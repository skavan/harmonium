       music players have no rewind service — but the engine already
       tracks live position (same interpolation the progress bar
       uses), so {seek: ±N} scrubs any seekable player. */
    const e = resolveEntity(a.target || a.entity || "$context.media_player");
    if (!e) { flashBar("No player wired"); return; }
    const s = st(e);
    let p = s.a.media_position || 0;
    if (s.s === "playing" && s.a.media_position_updated_at)
      p += (Date.now() - Date.parse(s.a.media_position_updated_at)) / 1000;
    let tp = p + (+a.seek || 0);
    if (s.a.media_duration) tp = Math.min(s.a.media_duration - 1, tp);
    tp = Math.max(0, tp);
    callService("media_player", "media_seek", { seek_position: Math.round(tp) }, e);
    flashBar((+a.seek >= 0 ? "⏩ +" : "⏪ −") + Math.abs(+a.seek) + "s");
    return;
  }
  const parts = (a.service || "").split(".");
  if (parts.length !== 2) return;
  const ref = a.target || a.entity;
  const target = resolveEntity(ref);
  if (ref && !target) return;   // unresolved context → no-op, never untargeted
  callService(parts[0], parts[1], a.data, target);
}

/* Presets: one-tap content shortcuts. If the preset names an activity,
   ensure it's running first (Harmony-favorite behavior), then fire. */
function firePreset(t) {
  /* BROWSE taps (v0.49) navigate the library tree, no service call */
  if (t.action && t.action.browse !== undefined) {
    browseGo(t.action.browse);
    return true;
  }
  /* resolve the target NOW — a drawer screen may navigate away before
     a deferred run() fires, and $context must be the drawer's own */
  const a = t.action || {}, parts = (a.service || "").split(".");
  const ref = a.target || a.entity;
  const target = resolveEntity(ref);
  const run = () => {
    if (parts.length !== 2) return;
    /* unresolved $context → SAY SO (v0.48.2 — Suresh's silent
       playlist: no music activity on the deck meant no player wired,
       and the tap just shrugged) */
    if (ref && !target) {
      flashBar("No player wired — start an activity that casts one");
      return;
    }
    callService(parts[0], parts[1], a.data, target);
  };
  if (t.activity && !isActivityActive(t.activity)) {
    if (!startActivity(t.activity)) return false;   // switch-confirm pending
    let n = 0;                                  // poll the activity select
    const iv = setInterval(() => {              // (~12s budget) before firing
      if (isActivityActive(t.activity)) { clearInterval(iv); run(); }
      else if (++n > 40) { clearInterval(iv); flashBar("Activity didn't start"); }
    }, TIMING.presetPoll);
  } else run();
  return true;
}
/* An activity's start/stop is an ACTION REF:
     sequence:<id>  — a building-block sequence from the config,
                      executed HA-side by the integration
                      (harmonium.run); first-class citizen
     script.<x>     — a plain HA script entity; 2nd-class but
                      supported forever */
function runActionRef(ref) {
  if (!ref) return;
  if (ref.startsWith("sequence:"))
    callService("harmonium", "run", { sequence: ref.slice(9) });
  else callService("script", "turn_on", null, ref);
}
function startActivity(id) {
  const a = (CONFIG.activities || {})[id];
  if (!a) return false;
  /* optional switch guard: starting an activity while ANOTHER runs
     usually ends it (the HA scripts are exclusive) — when
     confirm_switch is set (per-activity, else global), ask first via
     the status bar. Returns false while the confirm is pending. */
  const cur = currentActivityId();
  const guard = a.confirm_switch != null ? a.confirm_switch
    : !!CONFIG.global.confirm_switch;
  if (cur && cur !== id && guard &&
      !barConfirm("actsw", "Press again to switch to " + (a.name || id), "on"))
    return false;
  /* NO START ACTION is legal (v0.47 — Suresh's blank-player report):
     the activity still becomes ACTIVE (display state + context) so
     the player renders; orchestration is opt-in, not a prerequisite */
  if (a.start) runActionRef(a.start);
  else callService("harmonium", "set_activity", { activity: id });
  /* the tap IS the intent: the player renders as this activity from
     this moment (see currentActivityId's pending impersonation) —
     never the "No activity is active" page — even while the select
     lags or the start action fails. */
  S.pendingActivity = id;
  if (a.screen) navigate(a.screen);
  return true;
}
function endActivity(a) {
  /* the activity's own stop; WITHOUT one it falls back to its page's
     hold-Power binding (the authored sledgehammer), then the current
     page's, then the global one. The special "off" activity is gone
     (v0.28) — All Off is just an Action a binding points at. */
  if (a.stop) { runActionRef(a.stop); return; }
  const owner = a.room_view && CONFIG.screens && CONFIG.screens[a.room_view];
  const b = (owner && owner.buttons && owner.buttons.power_hold) ||
    ((screenOf(S.screen) || {}).buttons || {}).power_hold ||
    (CONFIG.global.buttons || {}).power_hold;
  if (b) runAction(b);
  else flashBar("No stop action set");
}
function requestEnd(t, a) {
  if (a.confirm_end && S.confirmTile !== t.id) {
    S.confirmTile = t.id;
    clearTimeout(S.confirmTimer);
    S.confirmTimer = setTimeout(() => { S.confirmTile = null; renderStates(); }, TIMING.confirm);
    renderStates();
    return;
  }
  clearTimeout(S.confirmTimer); S.confirmTile = null;
  endActivity(a);
  renderStates();
}
function clearConfirm() {
  if (!S.confirmTile) return;
  clearTimeout(S.confirmTimer); S.confirmTile = null;
}

/* Status-bar two-press confirm (no tile to turn red): first press
   flashes the prompt — pulsing red for OFF-flavored confirms, accent
   for ON (tone, default "off") — second within TIMING.confirm
   returns true. */
function barConfirm(key, msg, tone) {
  const t = (barConfirm._t ??= {});
  if (Date.now() - (t[key] || 0) > TIMING.confirm) {
    t[key] = Date.now();
    flashBar(msg, tone || "off", TIMING.confirm);
    return false;
  }
  t[key] = 0;
  cfmClear();          // confirmed: stop the pulse — the action is happening
  return true;
}

/* ================================================================
   MEDIA BROWSE (v0.50 — Suresh's mock: "90% of the time the user
   wants Favorites >> Something"): the STANDARD HA contract
   (media_player/browse_media + media_player.play_media — no service
   hardcoding), presented as THREE BANDS instead of a page-per-level
   crawl:

     band 1 — ROOTS: the tree's curated top level (Favorites, Music
              Library…) + the section's other tiles (Pull Music Here),
              one tight fixed row
     band 2 — CATEGORIES: the selected root's children WHEN they are
              all pure directories (Sonos: Playlists/Albums/Tracks) —
              a thin horizontally-scrollable chip strip. When they
              aren't (Music Assistant's root children ARE categories,
              their children are items), the strip simply doesn't
              appear — the rule generalizes across services.
     grid   — ITEMS: auto-descended on open, scrolls; expandables
              drill in place (‹ up tile), playables play.

   Navigation: tap roots/chips · CH▲▼ steps categories (wraps) ·
   horizontal SWIPE on the grid steps categories too.
   ================================================================ */
S.browse = { mp: null, root: null, cat: null, sub: [], nodes: {}, signed: {},
  busy: {}, ui: null, barTiles: [], _active: false };

const BROWSE_ICON = {
  playlist: "material:queue_music", album: "material:album",
  artist: "material:person", track: "material:music_note",
  directory: "material:folder", genre: "material:category",
  podcast: "material:podcasts", channel: "material:radio",
  tv_show: "material:tv", movie: "material:movie",
  app: "material:apps", url: "material:link",
  fav_root: "material:star", lib_root: "material:library_music",
};

/* a PURE DIRECTORY — expandable, not playable. Bands are built from
   these; anything else is an item. */
const brDir = c => !!c.can_expand && !c.can_play;
const brRef = c => ({ id: c.media_content_id, type: c.media_content_type,
  title: c.title });
const brSame = (c, sel) => !!sel && c.media_content_id === sel.id &&
  c.media_content_type === sel.type;

/* the key carries TYPE and id — Sonos's Favorites / Music Library
   root children have an EMPTY media_content_id (v0.49.1): an empty
   id is NOT the root; only a null node is. */
function browseKey(mp, node) {
  return mp + "|" + (node ? (node.type || "") + ":" + (node.id ?? "") : "");
}

function browseFetch(mp, node) {
  const key = browseKey(mp, node);
  if (S.browse.nodes[key] || S.browse.busy[key]) return;
  S.browse.busy[key] = true;
  const msg = { type: "media_player/browse_media", entity_id: mp };
  if (node) {
    msg.media_content_id = node.id ?? "";
    msg.media_content_type = node.type;
  }
  send(msg, m => {
    delete S.browse.busy[key];
    if (!m.success) {
      S.browse.nodes[key] = {
        title: "Library", children: [],
        error: (m.error && m.error.message) || "This player can't browse media",
      };
      if (S.screen) navigate(S.screen, true);
      return;
    }
    const r = m.result || {};
    const kids = (r.children || []).slice(0, 200);
    /* thumbnails: HA-relative paths need auth/sign_path (exactly what
       the HA frontend does); absolute URLs pass straight through */
    let waiting = 0;
    const done = () => {
      S.browse.nodes[key] = { title: r.title, children: kids };
      if (S.screen) navigate(S.screen, true);
    };
    kids.forEach(c => {
      const t = c.thumbnail;
      if (!t) return;
      if (!t.startsWith("/")) { c._thumb = t; return; }
      if (S.browse.signed[t]) { c._thumb = S.browse.signed[t]; return; }
      waiting++;
      send({ type: "auth/sign_path", path: t }, sm => {
        if (sm.success && sm.result && sm.result.path)
          c._thumb = S.browse.signed[t] = sm.result.path;
        if (--waiting === 0) done();
      });
    });
    if (!waiting) done();
  });
}

/* ---- selection (each re-renders the screen) ---- */
function brSelRoot(c) {
  S.browse.root = brRef(c);
  S.browse.cat = null; S.browse.sub = [];
  navigate(S.screen, true);
}
function brSelCat(c) {
  S.browse.cat = brRef(c);
  S.browse.sub = [];
  navigate(S.screen, true);
}
function brStepCat(dir) {
  const ui = S.browse.ui;
  if (!ui || !ui.cats || ui.cats.length < 2) return false;
  const cur = ui.flat ? S.browse.root : S.browse.cat;
  const i = ui.cats.findIndex(c => brSame(c, cur));
  const n = ui.cats[((i < 0 ? 0 : i) + dir + ui.cats.length) % ui.cats.length];
  if (ui.flat) brSelRoot(n); else brSelCat(n);
  flashBar(n.title);
  return true;
}
/* in-grid drill below the bands (deep trees: artist → albums → …) */
function browseGo(ref) {
  if (ref === "__up") S.browse.sub.pop();
  else S.browse.sub.push(ref);
  navigate(S.screen, true);
}

/* ---- THE BAR (#brbar): bands 1+2, fixed above the grid ---- */
function browseBar() {
  const bar = document.getElementById("brbar");
  if (!bar) return;
  const B = S.browse;
  if (!B._active || !B.ui) {
    bar.classList.remove("onbar"); bar.innerHTML = ""; return;
  }
  bar.classList.add("onbar");
  const ic = c => c._thumb
    ? `<img src="${c._thumb}" alt="">`
    : `<span class="material-symbols-outlined">${
        (BROWSE_ICON[c.media_class] || "material:library_music").slice(9)}</span>`;
  /* FLAT TREES (v0.50.2 — Suresh: "Sonos is better"): when the top
     level IS the categories (Music Assistant), the chips carry the
     selection and the roots row shrinks to the section's own tiles
     (Pull Music Here) — or disappears entirely. */
  let html = "";
  if (B.barTiles.length || B.ui.roots.length) {
    html += `<div class="brrow">`;
    B.barTiles.forEach((t, i) => {
      html += `<button class="brroot" data-brt="${i}">` +
        (t.icon && t.icon.startsWith("material:")
          ? `<span class="material-symbols-outlined">${t.icon.slice(9)}</span>` : "") +
        `<span class="brl">${t.label || ""}</span></button>`;
    });
    B.ui.roots.forEach((c, i) => {
      html += `<button class="brroot${brSame(c, B.root) ? " on" : ""}" data-brr="${i}">` +
        ic(c) + `<span class="brl">${c.title}</span></button>`;
    });
    html += `</div>`;
  }
  if (B.ui.cats) {
    const sel = B.ui.flat ? B.root : B.cat;
    html += `<div class="brchips">` + B.ui.cats.map((c, i) =>
      `<button class="brchip${brSame(c, sel) ? " on" : ""}" data-brc="${i}">${c.title}</button>`
    ).join("") + `</div>`;
  }
  bar.innerHTML = html;
  bar.querySelectorAll("[data-brt]").forEach(b =>
    b.addEventListener("click", () => {
      const t = B.barTiles[+b.dataset.brt];
      const w = WIDGETS[t.type];
      if (w && w.select) w.select(resolveEntity(t.entity), t);
    }));
  bar.querySelectorAll("[data-brr]").forEach(b =>
    b.addEventListener("click", () => {
      const c = B.ui.roots[+b.dataset.brr];
      /* an expandable root selects; a playable-only root just PLAYS
         (a favorite station pinned at the top level) */
      if (c.can_expand) brSelRoot(c);
      else callService("media_player", "play_media",
        { media_content_id: c.media_content_id,
          media_content_type: c.media_content_type }, B.mp);
    }));
  bar.querySelectorAll("[data-brc]").forEach(b =>
    b.addEventListener("click", () => {
      const c = B.ui.cats[+b.dataset.brc];
      if (B.ui.flat) brSelRoot(c); else brSelCat(c);
    }));
  /* horizontal SWIPE on the grid steps categories (touch) */
  if (!browseBar._swipe) {
    browseBar._swipe = true;
    const g = document.getElementById("grid");
    let sx = 0, sy = 0, st = 0;
    g.addEventListener("pointerdown", e => {
      sx = e.clientX; sy = e.clientY; st = Date.now();
    }, { passive: true });
    g.addEventListener("pointerup", e => {
      if (!S.browse._active) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Date.now() - st < 600 && Math.abs(dx) > 70 && Math.abs(dy) < 50)
        brStepCat(dx < 0 ? 1 : -1);
    }, { passive: true });
  }
}

/* ================================================================
   QUEUE (v0.51 — Suresh: "One thing that would be nice for all
   music players is the queue… Each item would be a full row tile.
   Click and we jump to that song.")

   The queue is NOT part of HA's standard media_player contract, so
   this speaks per-platform services through ADAPTER PROBING — no
   name-guessing: each adapter is TRIED (a call with return_response)
   and the first that answers owns the entity from then on. Probed
   live 2026-07-31 on Suresh's HA:
     · Music Assistant — mass_queue.get_queue_items {entity,
       limit_before, limit_after} → [items]; jump =
       mass_queue.play_queue_item {entity, queue_item_id}
     · Sonos — sonos.get_queue @entity → [{media_title,
       media_artist, media_album_name, …}]; jump =
       sonos.play_queue {queue_position} (list order)
   Neither answers → "Queue not available for this player".
   ================================================================ */
S.queue = { ent: null, items: null, busy: false, err: null, adapter: {} };

const QUEUE_ADAPTERS = [
  {
    id: "ma",
    get: (e, cb) => callServiceResp("mass_queue", "get_queue_items",
      { entity: e, limit_before: 30, limit_after: 170 }, null, cb),
    map: (it, i) => ({
      title: it.media_title || it.title || it.name || "…",
      artist: it.media_artist || it.artist || "",
      album: it.media_album_name || it.album || "",
      image: it.media_image || it.image || null,
      action: { service: "mass_queue.play_queue_item",
        data: { entity: null /* stamped below */, queue_item_id:
          it.queue_item_id || it.item_id || null } },
    }),
  },
  {
    id: "sonos",
    get: (e, cb) => callServiceResp("sonos", "get_queue", {}, e, cb),
    map: (it, i) => ({
      title: it.media_title || "…",
      artist: it.media_artist || "",
      album: it.media_album_name || "",
      image: null,
      action: { service: "sonos.play_queue", target: null /* stamped */,
        data: { queue_position: i } },
    }),
  },
];

function queueFetch(ent) {
  const Q = S.queue;
  if (Q.busy) return;
  Q.busy = true; Q.err = null;
  const known = Q.adapter[ent];
  const order = known
    ? QUEUE_ADAPTERS.filter(a => a.id === known)
    : QUEUE_ADAPTERS;
  const tryAt = (i) => {
    if (i >= order.length) {
      Q.busy = false; Q.ent = ent; Q.items = [];
      Q.err = "Queue not available for this player";
      if (S.screen === "queue:" + ent) navigate(S.screen, true);
      return;
    }
    const ad = order[i];
    ad.get(ent, m => {
      if (!m.success) { tryAt(i + 1); return; }
      Q.adapter[ent] = ad.id;
      const resp = (m.result && m.result.response) || {};
      const raw = resp[ent] || [];
      Q.busy = false; Q.ent = ent;
      Q.items = raw.slice(0, 200).map((it, i2) => {
        const r = ad.map(it, i2);
        /* stamp the entity into the jump action */
        if (r.action.data && "entity" in r.action.data)
          r.action.data.entity = ent;
        if ("target" in r.action) r.action.target = ent;
        return r;
      });
      if (S.screen === "queue:" + ent) navigate(S.screen, true);
    });
  };
  tryAt(0);
}

/* the virtual QUEUE screen: full-row tiles, ▶ marks the playing one
   (matched on the player's live media_title), tap = jump */
function queueScreen(eid) {
  if (!eid) return null;
  const Q = S.queue;
  const fn = st(eid).a.friendly_name;
  const name = (fn || eid.split(".")[1].replace(/_/g, " ")) + " · Queue";
  let tiles;
  if (Q.ent !== eid || Q.items === null) {
    queueFetch(eid);
    tiles = [{ id: "q_ld", type: "preset", icon: "material:hourglass_empty",
      label: "Loading queue…", action: {} }];
  } else if (Q.err) {
    tiles = [{ id: "q_err", type: "preset", icon: "material:error_outline",
      label: Q.err, action: {} }];
  } else if (!Q.items.length) {
    tiles = [{ id: "q_mt", type: "preset", icon: "material:queue_music",
      label: "The queue is empty", action: {} }];
  } else {
    /* qrow tiles (v0.51.1 — Suresh's mock): art left · bold title ·
       "artist · album" on line two · ▶ HARD RIGHT — and the mark is
       LIVE (each row carries the player entity, so state updates
       re-evaluate isOn instead of a baked-at-build label) */
    tiles = Q.items.map((r, i) => ({
      id: "q_" + i, type: "qrow", entity: eid,
      label: r.title,
      sub_label: [r.artist, r.album].filter(Boolean).join(" · "),
      q_title: r.title, q_artist: r.artist,
      icon: "material:music_note",
      ...(r.image ? { icon_image: r.image } : {}),
      action: r.action,
    }));
  }
  const nowT = st(eid).a.media_title;
  const nowRow = tiles.find(x => x.q_title === nowT);
  return {
    name, virtual: true, class: "group", font_scope: "music",
    grid: { columns: 1 },
    tiles,
    initial_focus: (nowRow || tiles[0]).id,
  };
}

/* ================================================================
   KEY CAPTURE (v0.55 — Suresh: "we need a v1 capture helper") — a
   VIRTUAL SCREEN (the queue: pattern: an address, no config
   authoring). Open it, press keys on whatever remote is paired to
   this device, and every arriving event renders as a row — raw
   key · code · keyCode, plus what the CURRENT keymap resolves it
   to. UNMAPPED rows get the accent ring: those are the codes you
   are hunting when learning a new remote. While this screen is
   up, the engine SWALLOWS every key (logging is the point — a
   captured "back" must not navigate); exit is the title-bar ‹
   chevron (touch/mouse — this is a setup surface, someone is
   holding the device). Rows are newest-first, capped at 60.

   v0.56 — CAPTURE-ASSIGN (Suresh: "in next iteration of capture, I
   can hit the remote key, and on the tile, press to assign the
   physical key!"). The screen now leads with THE REMOTE: the
   profile's soft_layout (the Studio's ✎ layout builder — the same
   data, the same order, blanks included) rendered as slot tiles.
   The flow is two gestures and no typing: press a key on the
   physical remote (it becomes PENDING, shown in the hint tile),
   then tap the slot it belongs to. 💾 Save reads the live config
   over the authenticated Studio API, merges the assignments into
   remotes.<this device>.keymap, POSTs it back (the integration
   validates + deploys), and applies them to the running KEYMAP
   immediately — so the very next press already routes.

   Custom slot names are first-class by v0.54's open button
   vocabulary: assigning "Red" mints the logical button `Red`,
   bindable from any screen's `buttons:` map with zero engine
   edits.
   ================================================================ */
S.keycap = [];
S.keyPending = null;    // last raw key captured — the thing to assign
S.keyAssign = {};       // raw key → logical slot name (this session)

/* the glyph vocabulary, mirrored from the Studio's soft remote so the
   slot grid READS as the remote's face. Plain text on purpose — no
   icon font between you and a diagnostic surface. A CUSTOM slot name
   (Red, "..", anything Suresh types into the layout builder) has no
   glyph and doesn't get a dot: its own name is the legend, and the
   stylesheet promotes a glyph-less slot's label to key size. */
const KEYCAP_GLYPHS = {
  back: "↩", home: "⌂", power: "⏻", menu: "≡",
  up: "▲", down: "▼", left: "◀", right: "▶", select: "OK",
  vol_up: "＋", vol_down: "－", ch_up: "CH＋", ch_down: "CH－",
  mute: "🔇", info: "ⓘ",
};
const keycapGlyph = n => KEYCAP_GLYPHS[n] || "";

/* the stock arrangement, mirrored from the Studio's soft-remote
   editor: what a remote looks like before anyone describes one */
const KEYCAP_DEFAULT_LAYOUT = [
  ["back", "home", "power"],
  ["vol_up", "up", "ch_up"],
  ["left", "select", "right"],
  ["vol_down", "down", "ch_down"],
  ["menu", "mute", null],
];

function keycapLog(e) {
  S.keycap.unshift({
    key: e.key, code: e.code || "?", kc: e.keyCode,
    mapped: keycapMap()[e.key] || null,
  });
  if (S.keycap.length > 60) S.keycap.length = 60;
  S.keyPending = e.key;
  if (S.screen === "keys:") navigate(S.screen, true);
}

/* effective map = what the profile ships + what this session has
   assigned but not yet saved (so a slot's sub tells the truth the
   instant you tap it, before the round trip) */
function keycapMap() { return Object.assign({}, KEYMAP, S.keyAssign); }

/* every raw key that currently emits this logical button */
function keysForSlot(name) {
  const m = keycapMap();
  return Object.keys(m).filter(k => m[k] === name);
}

function keycapLayout() {
  const L = (DEVICE && DEVICE.soft_layout) || KEYCAP_DEFAULT_LAYOUT;
  return Array.isArray(L) && L.length ? L : KEYCAP_DEFAULT_LAYOUT;
}

/* tap a slot = the pending key becomes this slot's key. Reassigning
   a raw key simply overwrites — one key, one logical button. */
function keycapAssign(name) {
  if (!S.keyPending) {
    flashBar("Press a key on the remote first", "off");
    return;
  }
  const k = S.keyPending;
  S.keyAssign[k] = name;
  S.keyPending = null;
  /* the log rows show resolutions — refresh them with the new truth */
  S.keycap.forEach(r => { r.mapped = keycapMap()[r.key] || null; });
  /* re-render FIRST: navigate() rewrites the bar title, so the flash
     has to land after it or it never gets read */
  navigate("keys:", true);
  flashBar(JSON.stringify(k) + " → " + name);
}

/* Save: GET the live config for THIS workspace, merge the session's
   assignments into this remote's keymap, POST it back. The Studio
   API is the same authenticated endpoint the Studio itself uses —
   the integration validates and deploys, so the change reaches
   every remote on this workspace, not just the one in your hand. */
function keycapApiBase() {
  const host = localStorage.getItem("hakr_host");
  return (host && host !== location.host)
    ? location.protocol + "//" + host : "";
}
async function keycapSave() {
  const n = Object.keys(S.keyAssign).length;
  if (!n) { flashBar("Nothing to save — capture a key, then tap a slot", "off"); return; }
  const dev = S.deviceName || "default";
  const url = keycapApiBase() + "/api/harmonium/config" +
    (WS && WS !== "main" ? "?ws=" + encodeURIComponent(WS) : "");
  const auth = { Authorization: "Bearer " + (localStorage.getItem("hakr_token") || "") };
  let msg, tone;
  try {
    const g = await fetch(url, { headers: auth, cache: "no-store" });
    if (!g.ok) throw new Error("GET " + g.status);
    const cfg = await g.json();
    if (!cfg.remotes) cfg.remotes = {};
    const p = cfg.remotes[dev] ||
      (cfg.remotes[dev] = { capabilities: ["touch", "pointer"] });
    /* a profile with no keymap of its own has been riding the global
       one — inherit it once, so saving never silently narrows it */
    p.keymap = Object.assign({}, p.keymap || cfg.keymap || {}, S.keyAssign);
    const q = await fetch(url, {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, auth),
      body: JSON.stringify(cfg),
    });
    if (!q.ok) throw new Error("POST " + q.status);
    /* live, immediately: the next press already routes */
    KEYMAP = Object.assign({}, KEYMAP, S.keyAssign);
    if (DEVICE) DEVICE.keymap = Object.assign({}, p.keymap);
    if (CONFIG) {
      if (!CONFIG.remotes) CONFIG.remotes = {};
      CONFIG.remotes[dev] = p;
    }
    S.keyAssign = {};
    msg = "Saved " + n + " key" + (n > 1 ? "s" : "") + " to '" + dev + "'";
    tone = "on";
  } catch (err) {
    msg = "Save failed: " + err.message;
    tone = "off";
  }
  /* re-render first (the sub lines and the Save tile change), then
     flash — navigate() would otherwise overwrite the message */
  navigate("keys:", true);
  flashBar(msg, tone);
}

function keysScreen() {
  const dev = S.deviceName || "default";
  const pend = S.keyPending;
  const nAssign = Object.keys(S.keyAssign).length;

  /* --- band 1: THE REMOTE (the slot grid, in the profile's order) */
  const slots = [];
  keycapLayout().forEach((row, ri) => (row || []).forEach((name, ci) => {
    const id = "ks_" + ri + "_" + ci;
    if (!name) {           // a blank in the physical grid stays a blank
      slots.push({ id, type: "kslot", blank: true, icon: " ", label: "" });
      return;
    }
    slots.push({ id, type: "kslot", slot: name, icon: keycapGlyph(name), label: name });
  }));

  /* --- band 2: the pending readout + save */
  const tools = [{
    id: "kc_hint", type: "preset",
    icon: "material:" + (pend ? "touch_app" : "keyboard"),
    ...(pend ? { color: "var(--accent)" } : {}),
    label: pend ? "Pending: " + JSON.stringify(pend) : "Press a key on the remote…",
    sub_label: pend
      ? "now tap the slot it belongs to"
      : "then tap its slot above · accent ring below = unmapped · exit with ‹",
    action: {},
  }, {
    id: "kc_save", type: "kslot", save: true, icon: "💾",
    label: nAssign ? "Save " + nAssign + " to '" + dev + "'" : "Save",
    sub_label: nAssign ? "writes this remote's keymap and deploys"
      : "nothing assigned yet",
  }];

  /* --- band 3: RECENT KEYS (the v0.55 log, unchanged in spirit) */
  const rows = S.keycap.map((r, i) => ({
    id: "kc_" + i, type: "preset",
    icon: "material:" + (r.mapped ? "keyboard_return" : "help"),
    ...(r.mapped ? {} : { color: "var(--accent)" }),
    label: JSON.stringify(r.key) + " · " + r.code + " · kc " + r.kc,
    sub_label: r.mapped ? "→ " + r.mapped : "unmapped in '" + dev + "'",
    action: {},
  }));

  return {
    name: "Key capture", virtual: true, class: "group",
    grid: { columns: 1 },
    sections: [
      { title: "The remote — " + dev, hero_label: "Remote",
        columns: 3, tiles: slots },
      { columns: 1, tiles: tools },
      { title: "Recent keys", hero_label: "Keys", columns: 1, tiles: rows },
    ],
    initial_focus: "kc_hint",
  };
}

/* ================================================================
   Device detail screens — VIRTUAL screens, generated per domain.
   navigate("detail:<entity_id>") composes generic primitives
   (power / stepper / chips). Chip options and stepper values come
   from the entity's own attributes, so no config is needed and the
   choices are always what the device actually supports.
   ================================================================ */

/* stepper bindings: one adjustable range per kind */
const STEP_KINDS = {
  temperature: {
    get: e => st(e).a.temperature, fmt: v => (v ?? "–") + "°", step: 1,
    set: (e, v) => callService("climate", "set_temperature", { temperature: v }, e)
  },
  brightness: {
    get: e => st(e).s === "on" ? Math.round((st(e).a.brightness || 0) / 2.55) : 0,
    fmt: v => (v ?? 0) + "%", step: 10, min: 0, max: 100, slider: "h",
    set: (e, v) => callService("light", "turn_on", { brightness_pct: v }, e)
  },
  volume: {
    get: e => Math.round((st(e).a.volume_level || 0) * 100),
    fmt: v => (v ?? 0) + "%", step: 3, min: 0, max: 100, slider: "h",
    set: (e, v) => callService("media_player", "volume_set", { volume_level: v / 100 }, e)
  },
  percentage: {
    get: e => st(e).a.percentage ?? 0,
    fmt: v => (v ?? 0) + "%", step: 10, min: 0, max: 100, slider: "h",
    set: (e, v) => callService("fan", "set_percentage", { percentage: v }, e)
  },
  position: {
    /* invert_position: display = deployment (100 - HA position), so a
       retracted projector screen reads 0%. get/set both invert, so
       slider, −/+, and VOL stay coherent; cover SERVICES never invert. */
    get: e => {
      const p = st(e).a.current_position ?? 0;
      return entOpt(e, "invert_position") ? 100 - p : p;
    },
    fmt: v => (v ?? 0) + "%", step: 10, min: 0, max: 100, slider: "v",
    set: (e, v) => callService("cover", "set_cover_position",
      { position: entOpt(e, "invert_position") ? 100 - v : v }, e)
  }
};
function nudgeStep(e, kind, dir) {
  const k = STEP_KINDS[kind];
  if (!k || !e) return;
  let v = (+k.get(e) || 0) + dir * k.step;
  if (k.min != null) v = Math.max(k.min, v);
  if (k.max != null) v = Math.min(k.max, v);
  k.set(e, v);
}

/* chip bindings: an options list (from attributes) + a setter */
const CHIP_KINDS = {
  hvac_mode: { options: e => st(e).a.hvac_modes, current: e => st(e).s,
    set: (e, v) => callService("climate", "set_hvac_mode", { hvac_mode: v }, e) },
  fan_mode: { options: e => st(e).a.fan_modes, current: e => st(e).a.fan_mode,
    set: (e, v) => callService("climate", "set_fan_mode", { fan_mode: v }, e) },
  preset: { options: e => st(e).a.preset_modes, current: e => st(e).a.preset_mode,
    set: (e, v) => callService((e || "").split(".")[0], "set_preset_mode", { preset_mode: v }, e) },
  source: { options: e => st(e).a.source_list, current: e => st(e).a.source,
    set: (e, v) => callService("media_player", "select_source", { source: v }, e) },
  effect: { options: e => st(e).a.effect_list, current: e => st(e).a.effect,
    set: (e, v) => callService("light", "turn_on", { effect: v }, e) }
};
function cycleChip(e, t, dir) {
  const k = CHIP_KINDS[t.kind], opts = (k && k.options(e)) || [];
  if (!opts.length) return;
  const i = Math.max(0, opts.indexOf(k.current(e)));
  k.set(e, opts[(i + dir + opts.length) % opts.length]);
}

/* Roving highlight for button-row widgets (coverbtns, transport):
   while the row tile is merely FOCUSED, ◀▶ move a highlight across
   its buttons and select presses the highlighted one — no capture
   step, matches "a row of physical buttons". Buttons are located by
   data-<attr>; default index 1 = the center button (Stop/Play-Pause). */
function roveBtns(t, attr) {
  const el = document.getElementById("tile_" + t.id);
  return el ? [el, [...el.querySelectorAll(`[data-${attr}]`)]] : [null, []];
}
function roveMove(t, attr, d) {
  const [el, btns] = roveBtns(t, attr);
  if (!btns.length) return;
  el._ci = ((el._ci ?? 1) + d + btns.length) % btns.length;
  btns.forEach((b, i) => b.classList.toggle("cvsel", i === el._ci));
}
function rovePick(t, attr) {
  const [el, btns] = roveBtns(t, attr);
  return btns.length ? btns[el._ci ?? 1].dataset[attr] : null;
}

/* per-domain detail composition (chips with no options self-hide).
   Layout doctrine (v0.9.3): row 1 = power toggle (back is the GLOBAL
   status-bar chevron); NO headings — a small dim icon marks each
   row's meaning; option buttons are preset-tile sized. */
const DETAIL_TILES = {
  climate: e => [
    { id: "dp", type: "power", entity: e, label: "", span: 2 },
    { id: "ds", type: "stepper", kind: "temperature", entity: e, icon: "material:thermostat", label: "", span: 2 },
    { id: "dm", type: "chips", kind: "hvac_mode", entity: e, icon: "material:hvac", label: "", span: 2 },
    { id: "df", type: "chips", kind: "fan_mode", entity: e, icon: "material:mode_fan", label: "", span: 2 },
    { id: "dpr", type: "chips", kind: "preset", entity: e, icon: "material:tune", label: "", span: 2 }
  ],
  light: e => [
    { id: "dp", type: "power", entity: e, label: "", span: 2 },
    { id: "ds", type: "stepper", kind: "brightness", entity: e, icon: "material:light_mode", label: "", span: 2 },
    { id: "de", type: "chips", kind: "effect", entity: e, icon: "material:auto_awesome", label: "", span: 2 }
  ],
  media_player: e => [
    { id: "dp", type: "power", entity: e, label: "", span: 2 },
    { id: "dt", type: "transport", entity: e, label: "", span: 2 },
    { id: "ds", type: "stepper", kind: "volume", entity: e, icon: "material:volume_up", label: "", span: 2 },
    { id: "dsrc", type: "chips", kind: "source", entity: e, icon: "material:input", label: "", span: 2 }
  ],
  cover: e => [
    { id: "dc", type: "coverbtns", entity: e, label: "", span: 2 },
    { id: "ds", type: "stepper", kind: "position", entity: e, icon: "material:height", label: "", span: 2 }
  ],
  fan: e => [
    { id: "dp", type: "power", entity: e, label: "", span: 2 },
    { id: "ds", type: "stepper", kind: "percentage", entity: e, icon: "material:mode_fan", label: "", span: 2 },
    { id: "dpr", type: "chips", kind: "preset", entity: e, icon: "material:tune", label: "", span: 2 }
  ],
  switch: e => [
    { id: "dp", type: "power", entity: e, label: "", span: 2 }
  ]
};
/* VOL keys retarget to the device's primary range ON ITS DETAIL SCREEN
   ONLY (everywhere else VOL stays room/activity audio). */
const DETAIL_VOL_KIND = {
  climate: "temperature", light: "brightness",
  media_player: "volume", cover: "position", fan: "percentage"
};

/* the STOCK domain controllers (config.controllers.<domain>, tiles
   bound to "$device") are the editable form of DETAIL_TILES; a
   per-device CUSTOM copy (variant_of: <domain>, entity: <eid>) wins
   for its device. Fallback: the hardcoded composition. */
function bindDeviceTiles(tiles, eid) {
  const sub = v => v === "$device" ? eid
    : Array.isArray(v) ? v.map(sub)
    : (v && typeof v === "object")
      ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, sub(x)]))
      : v;
  return tiles.map(sub);
}
function detailDef(eid) {
  const dom = eid.split(".")[0];
  const cs = (CONFIG && CONFIG.controllers) || {};
  for (const c of Object.values(cs))
    if (c && c.variant_of && c.domain === dom && c.entity === eid) return c;
  const stock = cs[dom];
  return (stock && stock.domain === dom) ? stock : null;
}
function detailScreen(eid) {
  const def = detailDef(eid);
  const raw = def
    ? ((def.tiles && def.tiles.length) ? def.tiles
        : (def.sections || []).flatMap(x => x.tiles || []))
    : (DETAIL_TILES[eid.split(".")[0]] || (() => null))(eid);
  if (!raw || !raw.length) return null;
  const tiles = def ? bindDeviceTiles(raw, eid) : raw;
  return {
    name: st(eid).a.friendly_name || eid.split(".")[1].replace(/_/g, " "),
    virtual: true,
    tiles,
    initial_focus: tiles.some(t => t.id === "ds") ? "ds" : tiles[0].id
  };
}
/* SOURCES detail (v0.35): navigate("sources:<entity>") — the input
   picker as a virtual screen. One chips row (kind source): the live
   source_list, current highlighted, pick → select_source. Launched
   by the `sources` tile and the repurposed title-bar input button. */
function sourcesScreen(eid) {
  if (!eid) return null;
  const fn = st(eid).a.friendly_name;
  return {
    name: (fn || eid.split(".")[1].replace(/_/g, " ")) + " · Inputs",
    virtual: true,
    tiles: [{ id: "dsrc", type: "chips", kind: "source", entity: eid,
      icon: "material:input", label: "", span: 2 }],
    initial_focus: "dsrc"
  };
}

/* screen id resolution: config screens + virtual detail screens +
   LIBRARY CONTROLLERS ("controller:<id>" → config.controllers — the
   shared control surfaces; the active activity's context overlay
   parameterizes them, same as any screen) */
function screenOf(id) {
  if (typeof id === "string" && id.startsWith("detail:"))
    return detailScreen(id.slice(7));
  if (typeof id === "string" && id.startsWith("sources:"))
    return sourcesScreen(id.slice(8));
  if (typeof id === "string" && id.startsWith("queue:"))
    return queueScreen(id.slice(6));
  if (id === "keys:")           /* key capture (v0.55) */
    return keysScreen();
  if (typeof id === "string" && id.startsWith("controller:"))
    return (CONFIG && CONFIG.controllers && CONFIG.controllers[id.slice(11)]) || null;
  return (CONFIG && CONFIG.screens && CONFIG.screens[id]) || null;
}

/* effective trailing action for a tile: explicit config wins
   (trailing: false suppresses); detailable device tiles default to
   a settings icon opening their generated detail screen */
function trailingOf(t) {
  if (!t) return null;
  if (t.trailing !== undefined) return t.trailing || null;
  const w = WIDGETS[t.type] || {};
  if (!w.detailable) return null;
  const de = resolveEntity(t.entity);
  return (de && DETAIL_TILES[de.split(".")[0]])
    ? { icon: "material:tune", action: { navigate: "detail:" + de } }
    : null;
}

/* ================================================================
   Widget catalog (chassis adapters).
   ================================================================ */
const pct = v => Math.round(v * 100) + "%";
const st = eid => S.states.get(eid) || { s: "…", a: {} };
const ACTIVE = s => !["off", "idle", "unavailable", "unknown", "standby", null, "…"].includes(s);

/* Shared capture map for device-remote widgets (dpad, passthrough):
   while captured, direction keys go to the tile's remote entity,
   translated through cmdFor (so activity dpad_commands apply). */
const DPAD_CAPTURE = {};
["up", "down", "left", "right", "select", "back"].forEach(k =>
  DPAD_CAPTURE[k] = (e, t) => rc(e, cmdFor(t, k)));

/* Wire a widget body's <button data-ATTR="x"> children to a handler.
   stopPropagation keeps the tap from also firing the tile's select. */
function wireTaps(el, attr, fn) {
  el.querySelectorAll(`[data-${attr}]`).forEach(b =>
    b.addEventListener("click", ev => { ev.stopPropagation(); fn(b.dataset[attr]); }));
}

const WIDGETS = {};

/* LIGHT tile — on/off + brightness%; tap toggles; meter = brightness. */
WIDGETS.light = {
    sub: e => st(e).s === "on"
      ? "On · " + Math.round((st(e).a.brightness || 255) / 2.55) + "%"
      : cap(st(e).s),
    isOn: e => st(e).s === "on",
    meter: e => st(e).s === "on" ? (st(e).a.brightness || 255) / 255 : 0,
    select: e => callService("light", "toggle", null, e),
    detailable: true,
    holdCapture: true, captureHint: "▲▼ brightness · back releases",
    capture: {
      up:   e => nudgeLight(e, +26), down: e => nudgeLight(e, -26),
      select: e => callService("light", "toggle", null, e)
    }
  };

/* FAN tile — on/off + percentage summary; tap toggles. */
WIDGETS.fan = {
  /* fan tile: tap = toggle; state line shows speed % (or preset);
     hold captures the D-pad for speed; ⚙ trail → generated detail
     (power + speed slider + preset buttons from preset_modes). */
  sub: e => {
    const s = st(e), p = s.a.percentage;
    return cap(s.s) + (s.s === "on" && p ? " · " + p + "%"
      : s.a.preset_mode ? " · " + s.a.preset_mode : "");
  },
  isOn: e => st(e).s === "on",
  meter: e => (st(e).a.percentage ?? 0) / 100,
  select: e => callService("fan", "toggle", null, e),
  detailable: true,
  holdCapture: true, captureHint: "▲▼ speed · back releases",
  capture: {
    up:   e => nudgeStep(e, "percentage", +1),
    down: e => nudgeStep(e, "percentage", -1),
    select: e => callService("fan", "toggle", null, e)
  }
};

/* SCRIPT tile — runs an HA script; lit while it runs. */
WIDGETS.script = {
    sub: e => st(e).s === "on" ? "Running…" : "Press to run",
    isOn: e => st(e).s === "on",
    select: e => callService("script", "turn_on", null, e)
  };

/* NAV CARD — one tile type that opens another page, in four styles:
     plain   — icon + label button (the old `nav`)
     image   — photo tile (the old `room`)
     summary — live "<n> entities · <k> active" derived from the
               target page's tiles (the old `group`)
     auto    — resolved at render: tile has an image → image; target
               page is a room → image; target page has entities →
               summary; else plain.
   Doctrine (2026-07-23): groups are just views; the tile that points
   at one is a nav card. Tap = go there — the target page owns all
   behaviour. */
function navStyle(t) {
  if (t.style && t.style !== "auto") return t.style;
  if (t.image) return "image";
  const sc = t.target ? screenOf(t.target) : null;
  if (sc && sc.room) return "image";
  if (navTargetEntities(t).length) return "summary";
  return "plain";
}
/* summary entities: the explicit list, else DERIVED live from the
   target page's tiles — one source of truth, no baked duplicates */
function navTargetEntities(t) {
  if (Array.isArray(t.entities) && t.entities.length) return t.entities;
  if (!t.target) return [];
  const sc = screenOf(t.target);
  if (!sc) return [];
  return rawTilesOf(sc).map(x => x.entity)
    .filter(e => typeof e === "string" && e.includes("."));
}

WIDGETS.nav = {
  sub: (e, t) => {
    if (navStyle(t) !== "summary") return (t && t.sub) || "";
    const ents = navTargetEntities(t);
    const on = ents.filter(x => ACTIVE(st(x).s)).length;
    return `${ents.length} entities · ${on} active`;
  },
  isOn: (e, t) =>
    navStyle(t) === "summary" && navTargetEntities(t).some(x => ACTIVE(st(x).s)),
  body: t => navStyle(t) === "image"
    ? `<img class="roomimg" src="${t.image || ""}" alt="">`
    : `<div class="meter hidden"><i></i></div>`,
  /* style rides in as a class (nav-plain / nav-image / nav-summary)
     so the CSS can shape each without a separate widget type */
  wire: (el, t) => el.classList.add("nav-" + navStyle(t)),
  select: (e, t) => { if (t.target) navigate(t.target); else flashBar("No page linked yet"); },
};

/* PRESET tile — icon square that fires an app/preset (warm-start:
   ensures its activity first); drawer screens pop back after firing. */
WIDGETS.preset = {
    sub: (e, t) => t.sub_label || "",
    isOn: (e, t) => !!(t.activity && isActivityActive(t.activity)),
    select: (e, t) => {
      /* BROWSE taps (v0.49) navigate WITHIN the drawer — stepping
         into Albums must not pop the drawer shut */
      if (t.action && t.action.browse !== undefined) {
        browseGo(t.action.browse);
        return;
      }
      const fired = firePreset(t);
      /* drawer screens (apps, music library): picking an item is a
         one-shot — fire it, announce it, and pop back to where the
         drawer was opened from (physical keys drive the UI here, so
         the user shouldn't have to Back out by hand) */
      const sc = screenOf(S.screen) || {};
      if (fired && sc.drawer) {
        flashBar(t.label);
        if (S.stack.length) navigate(S.stack.pop(), true);
        else if (sc.parent && screenOf(sc.parent)) navigate(sc.parent, true);
      }
    }
  };

/* the QUEUE ROW widget — see queueScreen above. isOn is the LIVE
   playing test (title + artist beats duplicate titles); the ▶ mark
   and the accent highlight both ride renderStates. */
WIDGETS.qrow = {
  sub: (e, t) => t.sub_label || "",
  isOn: (e, t) => !!e && st(e).a.media_title === t.q_title &&
    (!t.q_artist || !st(e).a.media_artist ||
      st(e).a.media_artist === t.q_artist),
  select: (e, t) => runAction(t.action),
  body: () => `<span class="qnowic material-symbols-outlined">play_arrow</span>`,
};

/* TRANSPORT strip — prev · play/pause · next for a media_player. */
WIDGETS.transport = {
    /* transport row: rew / play-pause / ff. D-pad: ◀▶ move the roving
       highlight while focused (same model as coverbtns — the music
       screen has no dpad_passthrough, so the row IS the transport),
       select presses the highlighted control (default play-pause). */
    sub: () => "",
    isOn: e => st(e).s === "playing",
    keys: {

    select: (e, t) =>
      callService("media_player", rovePick(t, "tr") || "media_play_pause", null, e),
    body: () => `<div class="trow">
      <button class="dpbtn" data-tr="media_previous_track"><span class="material-symbols-outlined">skip_previous</span></button>
      <button class="dpbtn trbig cvsel" data-tr="media_play_pause"><span class="material-symbols-outlined">play_pause</span></button>
      <button class="dpbtn" data-tr="media_next_track"><span class="material-symbols-outlined">skip_next</span></button>
    </div>`,

  const bar = el.querySelector(".npprog");
  if (!bar) return;
  const d = s.a.media_duration;
  if (!d) { bar.classList.add("hidden"); return; }
  let p = s.a.media_position || 0;
  if (s.s === "playing" && s.a.media_position_updated_at)
    p += (Date.now() - Date.parse(s.a.media_position_updated_at)) / 1000;
  bar.classList.remove("hidden");
  bar.firstElementChild.style.width =
    Math.max(0, Math.min(100, Math.round(p / d * 100))) + "%";
}

  document.querySelectorAll(".tile.wgt-media.art").forEach(el => {

/* STEPPER — the − value + row (brightness, setpoint, position,
   percentage…); kind picks entity attribute + service. */
WIDGETS.stepper = {
    /* big −/value/+ row bound to a STEP_KINDS range (t.kind).
       Kinds with a bounded 0-100 range also get a fat slider track
       (slider: "h" | "v" in STEP_KINDS) above the row — drag or tap
       sets the value directly; −/+ remain the precision control. */
    sub: () => "",
    isOn: e => ACTIVE(st(e).s),
    selectCaptures: true, captureHint: "▲▼ adjust · back releases",
    capture: {
      up:   (e, t) => nudgeStep(e, t.kind, +1),
      down: (e, t) => nudgeStep(e, t.kind, -1)
    },
    body: t => {
      const k = STEP_KINDS[t.kind] || {};
      const sl = k.slider
        ? `<div class="sldr${k.slider === "v" ? " vert" : ""}"><i></i></div>` : "";
      return sl + `<div class="steprow">
      <button class="dpbtn" data-st="-1"><span class="material-symbols-outlined">remove</span></button>
      <div class="stepval">–</div>
      <button class="dpbtn" data-st="1"><span class="material-symbols-outlined">add</span></button>
    </div>`;
    },
    wire(el, t) {
      wireTaps(el, "st", d => nudgeStep(resolveEntity(t.entity), t.kind, +d));
      const k = STEP_KINDS[t.kind], sl = el.querySelector(".sldr");
      if (!k || !sl) return;
      /* drag/tap on the track → proportional set. Optimistic fill for
         responsiveness; service calls throttled, final on release. */
      const apply = (ev, final) => {
        const r = sl.getBoundingClientRect();
        let f = k.slider === "v"
          ? 1 - (ev.clientY - r.top) / r.height
          : (ev.clientX - r.left) / r.width;
        f = Math.max(0, Math.min(1, f));
        sl.firstElementChild.style[k.slider === "v" ? "height" : "width"] =
          Math.round(f * 100) + "%";
        const min = k.min ?? 0, max = k.max ?? 100;
        const v = Math.round(min + f * (max - min));
        const now = Date.now();
        if ((final || now - (sl._t || 0) > 150) && v !== sl._lastV) {
          sl._t = now; sl._lastV = v;
          k.set(resolveEntity(t.entity), v);
        }
      };
      sl.addEventListener("click", ev => ev.stopPropagation());
      sl.addEventListener("pointerdown", ev => {
        ev.stopPropagation();
        sl.setPointerCapture(ev.pointerId);
        sl._drag = true;
        apply(ev, false);
      });
      sl.addEventListener("pointermove", ev => { if (sl._drag) apply(ev, false); });
      sl.addEventListener("pointerup", ev => {
        if (sl._drag) { sl._drag = false; apply(ev, true); }
      });
      sl.addEventListener("pointercancel", () => { sl._drag = false; });
    },
    render(el, e, t) {
      const k = STEP_KINDS[t.kind];
      el.querySelector(".stepval").textContent = k ? k.fmt(k.get(e)) : "–";
      const sl = el.querySelector(".sldr");
      if (sl && k && k.slider && !sl._drag) {   // don't fight the finger
        const min = k.min ?? 0, max = k.max ?? 100;
        const f = Math.max(0, Math.min(1, ((+k.get(e) || 0) - min) / (max - min)));
        sl.firstElementChild.style[k.slider === "v" ? "height" : "width"] =
          Math.round(f * 100) + "%";
      }
    }
  };

/* DEVICE tile — ONE entity, everything else resolved from its domain
   (the Studio's "just pick the entity" tile). Doctrine:
   - tap = the domain's obvious verb (play/pause a playing/paused
     media_player, toggle a light/switch/fan). No clean verb (an OFF
     media player, a thermostat, a remote) → open the device's page
     instead: starting things properly is the activity's job
     (warm-start doctrine), not a naked turn_on from a tile.
   - hold (touch long-press) = always the page.
   - the page ("Opens") is INFERRED when not set: the view of the
     activity whose primary media_player / dpad is this entity — the
     Porch TV tile knows about the tv screen because Watch Smart TV
     declared it. tile.target overrides.
   - tile.tap overrides the verb: "toggle" | "play_pause" | "open". */
const DEVICE_VERB = {
  media_player: e => ["playing", "paused", "buffering"].includes(st(e).s)
    ? () => callService("media_player", "media_play_pause", null, e) : null,
  light: e => () => callService("light", "toggle", null, e),
  switch: e => () => callService("switch", "toggle", null, e),
  fan: e => () => callService("fan", "toggle", null, e),
  input_boolean: e => () => callService("input_boolean", "toggle", null, e),
};

function deviceTarget(t) {
  if (t.target) return t.target;
  for (const a of Object.values(CONFIG.activities || {})) {
    const c = a.context || {};
    const scr = a.screen || a.view;
    if (scr && (c.media_player === t.entity || c.dpad === t.entity)) return scr;
  }
  return null;
}

WIDGETS.device = {
