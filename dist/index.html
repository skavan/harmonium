       resumes untouched the moment search closes. */
    if (B.qon) {
      /* DRILLING A RESULT (v0.66): an artist can't be share-linked to
         Sonos, but MA marks it expandable — so stepping into one lists
         their albums FROM MA, and those albums play on Sonos like any
         other result. The fetch has to use the ENGINE's player: the
         ids are its own and the tree's player has never heard of them. */
      if (B.sub.length) {
        const top = B.sub[B.sub.length - 1];
        const Ln = B.nodes[browseKey(B.qmp, top)];
        B.ui = { roots: [], cats: null, search: true };
        if (!Ln) { browseFetch(B.qmp, top); return loading; }
        Ln.viaMa = B.qmp;
        return mkItems(Ln, [{ type: "preset", id: t.id + "_up", span: 2,
          brw: true, icon: "material:arrow_back",
          label: Ln.title ? "\u2039 " + Ln.title : "\u2039 Back",
          action: { browse: "__up" } }]);
      }
      const items = (B.qres && B.qres.items) || [];
      const kinds = [];
      items.forEach(c => {
        const k = c.media_class || "item";
        if (!kinds.some(x => x.qclass === k))
          kinds.push({ title: BR_KIND_NAME[k] || k, qclass: k,
            media_content_id: "__q:" + k, media_content_type: "__qkind" });
      });
      /* SHOW THE SLICES BEFORE THERE IS ANYTHING TO SLICE (v0.68.1 —
         Suresh: "Its not obvious what Im looking at, I think we should
         have the tab bar (artists/playlists etc..) shown. Not just the
         magnifying icon. If there is no search text, the tabs are
         disabled."). With no results the strip collapsed to a lone
         magnifier, which says nothing about what search even DOES.
         The declared `classes` already name the answer's shape, so
         draw them — greyed and unpressable until an answer exists. */
      const cats = items.length
        ? [{ title: "All", qclass: "", media_content_id: "__q:",
             media_content_type: "__qkind" }].concat(kinds)
        : [{ title: "All", qclass: "", disabled: true,
             media_content_id: "__q:", media_content_type: "__qkind" }].concat(
            (B.qclasses || []).map(k => ({
              title: BR_KIND_NAME[k] || k, qclass: k, disabled: true,
              media_content_id: "__q:" + k, media_content_type: "__qkind" })));
      B.ui = { roots: [], cats: cats, search: true };
      /* SAY THAT WE ARE LOOKING (v0.68.1 — "there is no visual
         feedback"). A centred line, not the library's hourglass tile:
         this is a search in flight, not a page loading. */
      if (B.qbusy && !items.length)
        return [{ type: "preset", id: t.id + "_qw", brw: true,
          /* no `span`: .brwait takes 1/-1 in CSS, and an inline span
             from the v0.68 proportional rule would out-specify it */
          cls: "brwait", icon: "material:search",
          label: "Searching…", action: {} }];
      if (B.qerr)
        return [{ type: "preset", id: t.id + "_qe", span: 2, brw: true,
          icon: "material:error_outline", label: B.qerr, action: {} }];
      /* AN EMPTY QUERY SHOWS NOTHING (v0.67.2 — Suresh, of the tile
         that used to sit here: "What is the point of that great big
         button? Type to search ma bar?"). None: the query line right
         above it already says "type to search", and a tile that does
         nothing when tapped is furniture. Silence is the answer. */
      if (!B.q.trim()) return [];
      const shown = B.qcat
        ? items.filter(c => (c.media_class || "item") === B.qcat) : items;
      if (!shown.length)
        return [{ type: "preset", id: t.id + "_qn", span: 2, brw: true,
          icon: "material:search_off",
          label: "Nothing for “" + B.q.trim() + "”", action: {} }];
      /* SAY THAT THE WELL IS DEEPER (v0.67.3 — "It should show that
         there are more, must be thousands!"), and SAY WHICH (v0.67.5 —
         "The There's more should appear in the tab results too, if
         true"). It always did appear in a tab whose kind was capped —
         but an unnamed note in All that vanishes on a tab reads as a
         bug rather than as an answer. Naming the kinds makes the rule
         visible: the limit is PER KIND, so All can be deep in artists
         while tracks are exhausted. */
      const cap = (B.qres && B.qres.capped) || [];
      const capShown = B.qcat
        ? (cap.indexOf(B.qcat) >= 0 ? [B.qcat] : []) : cap;
      const deep = capShown.length
        ? "More " + capShown.map(k =>
            (BR_KIND_NAME[k] || k).toLowerCase()).join(" · ") +
          " — add a word to narrow it down"
        : 0;
      /* the SAME item renderer the tree uses — thumbnails, play,
         drill-in and the ▶ badge all come along. Results MIX kinds by
         nature, which is exactly what the v0.62 badge is for. */
      return mkItems({ title: "Search", children: shown, viaMa: B.qmp,
        more: deep,
        badges: shown.map(c => BROWSE_ICON[c.media_class] ||
          "material:library_music") }, []);
    }
    let gridNode = null;
    /* a sticky __synth selection must not be stomped by the tree
       defaulting below — re-enter synthetic mode directly */
    if (B.root && B.root.type === "__synth") {
      const fc = favList();
      if (fc.length) {
        const r = synth(fc);
        if (Array.isArray(r)) return r;
        gridNode = r;
      } else { B.root = B.cat = null; }   /* sensors emptied → tree */
    }
    if (!gridNode) {
      /* selected ROOT: sticky → tile default_root (title, advisory) →
         first expandable → first. */
      let selRoot = roots.find(c => brSame(c, B.root)) || null;
      if (!selRoot && t.default_root)
        selRoot = roots.find(c => String(c.title || "").toLowerCase() ===
          String(t.default_root).toLowerCase()) || null;
      selRoot = selRoot || roots.find(c => c.can_expand) || roots[0];
      B.root = brRef(selRoot);
      if (!selRoot.can_expand) {         /* playable-only root: no grid */
        B.ui = { roots, cats: null };
        return [];
      }
      const L1 = B.nodes[browseKey(mp, B.root)];
      /* while L1 loads, DON'T flash the raw tree roots into band 1
         (v0.51 — Suresh: "a row of folders pops onto the top row for
         a second"): keep the previous bar (or none on first load) —
         the real shape decides once L1 lands */
      if (!L1) { browseFetch(mp, B.root); return loading; }
      /* CATEGORY STRIP (v0.50.2): two tree shapes, one look.
         DEEP (Sonos): roots hold a layer of pure directories → roots
         row + those directories as chips. FLAT (Music Assistant): the
         top level IS the categories → chips (favorites-promoted when
         the sensors are live, plain otherwise). */
      if (L1.children.length && L1.children.every(brDir)) {
        const real = brOrder(L1.children, t.categories);
        /* THE "ALL" CHIP (v0.62 — Suresh: "what Sonos is returning is
           ALL favorites and then we're slicing them by category, which
           is useful, but sometimes artificial. What's the difference
           between a coffee shop playlist and coffee shop radio?").
           So when this root is the only one — i.e. the categories ARE
           the whole library — offer the unsliced view first. Each item
           carries a badge naming the folder it came from, which is the
           thing the slicing was for. */
        const wantAll = roots.length === 1 && real.length > 1 &&
          t.all !== false;
        const cats = wantAll ? [BR_ALL].concat(real) : real;
        const selCat = cats.find(c => brSame(c, B.cat)) || cats[0];
        B.cat = brRef(selCat);
        B.ui = { roots, cats };
        if (B.cat.type === BR_ALL.media_content_type) {
          const keys = real.map(c => browseKey(mp, brRef(c)));
          const missing = real.filter((c, i) => !B.nodes[keys[i]]);
          if (missing.length) {
            missing.forEach(c => browseFetch(mp, brRef(c)));
            return loading;
          }
          /* badges ride ALONGSIDE the children, never ON them: the
             child objects are the shared node cache, and stamping
             them would leave badges behind in the single-category
             grids once you had visited All */
          const kids = [], badges = [];
          let more = 0;
          real.forEach((c, i) => {
            const n = B.nodes[keys[i]];
            more += n.more || 0;
            (n.children || []).forEach(k => {
              kids.push(k);
              badges.push(brBadge(c.title, k));
            });
          });
          gridNode = { title: "All", children: kids, more: more, badges: badges };
        } else {
          const L2 = B.nodes[browseKey(mp, B.cat)];
          if (!L2) { browseFetch(mp, B.cat); return loading; }
          gridNode = L2;
        }
      } else if (roots.length > 1 && roots.every(brDir)) {
        const fc = favList();
        if (fc.length) {
          B.root = { id: "__fav", type: "__synth", title: "Favorites" };
          B.cat = null;
          const r = synth(fc);
          if (Array.isArray(r)) return r;
          gridNode = r;
        } else {
          B.ui = { roots: [], cats: brOrder(roots, t.categories), flat: true };
          gridNode = L1;
        }
      } else {
        B.ui = { roots, cats: null };
        gridNode = L1;
      }
    }
    if (gridNode === loading) return loading;
    /* deep drill below the bands (artist → albums → tracks …) */
    const out = [];
    if (B.sub.length) {
      const top = B.sub[B.sub.length - 1];
      const Ln = B.nodes[browseKey(mp, top)];
      if (!Ln) { browseFetch(mp, top); return loading; }
      out.push({ type: "preset", id: t.id + "_up", span: 2, brw: true,
        icon: "material:arrow_back",
        label: Ln.title ? "\u2039 " + Ln.title : "\u2039 Back",
        action: { browse: "__up" } });
      gridNode = Ln;
    }
    return mkItems(gridNode, out);
  }
  /* NOTE: `sources` stopped being a generator in v0.35 — it's a plain
     tile now (widgets/sources.js) that opens the sources:<mp> detail.
     The v0.33 inline expansion (one preset per input) was clunky. */
  if (t.type === "devices") {
    /* the activity's CAST generates device tiles — primary first,
       always in sync with Setup (the Studio's "Unlink" bakes them
       into plain tiles when page-level art direction is wanted).
       remote.* entities are skipped: the control surface's Remote
       pad IS their tile — a stateless remote row is noise.
       A BARE generator (stock controllers): the cast comes from the
       ACTIVE activity only when that activity actually TARGETS this
       surface (music playing must not put a Sonos on the TV page);
       otherwise it derives from the screen's own default context.
       surface.devices === false (the per-activity "auto-populate
       devices" switch) suppresses it. */
    let castAid = t.activity || null;
    if (!castAid) {
      const cur = renderActivityId();
      const act = cur && (CONFIG.activities || {})[cur];
      if (act && act.screen === S.screen) {
        if (act.surface && act.surface.devices === false) return [];
        castAid = cur;
      }
    }
    /* CAST CURATION (v0.36): Setup's per-device visibility toggle —
       device_options[entity].tile === false keeps a cast member out
       of the Devices section (it stays wired to its roles) */
    const dopts = (castAid && ((CONFIG.activities || {})[castAid] || {}).device_options) || {};
    const ents = castAid ? castOf(castAid)
      : castFromCtx((screenOf(S.screen) || {}).context || {});
    /* the COMMANDS CHANNEL is plumbing, not a device (v0.46.3 —
       Suresh's screenshot: "Hisense Projector ADB · Off" as a tile is
       noise): skip the entity wired to commands unless it also plays

    const ctx2 = ctxFor(S.screen);
    const cmdEnt = typeof ctx2.commands === "string" ? ctx2.commands : null;
    return ents.filter(e => e.split(".")[0] !== "remote")
      .filter(e => !(cmdEnt && e === cmdEnt && e !== ctx2.media_player &&

      .filter(e => !(dopts[e] && dopts[e].tile === false)).map(e => {
      const s = st(e), dom = e.split(".")[0];
      return {
        type: "device", id: t.id + "_" + e.replace(/[^a-zA-Z0-9]+/g, "_"),
        entity: e,

        icon: dom === "media_player"

          : dom === "light" ? "material:lightbulb"
          : dom === "climate" ? "material:thermostat"

  if (t.type === "volumes") {
    /* VOLUME CAST (v0.57 — Suresh: "there might be 8 volumes; think of

       device that declares roles.volume. Label and icon come from the
       DEVICE registry, so the shared controller stays generic and each
       house names its own zones — no volume_2/volume_3 slots, no
       per-room controller fork. Treatment follows global.style.volume
       ("compact" | "slider" | "stepper"), overridable on the generator
       tile and per device via device_options[entity].volume_style. */
    /* v0.57.1: bind to the RUNNING activity, NOT to "the activity whose
       screen I am standing on". The old test (act.screen === S.screen)
       meant the generator produced nothing anywhere except the
       activity's own controller — so a zones view reached by nav came
       up empty, and a nav summary could not expand it either. */
    let aid = t.activity && t.activity !== "$current" ? t.activity : null;
    if (!aid) {
      const cur = renderActivityId();
      if (cur && (CONFIG.activities || {})[cur]) aid = cur;
    }
    const act = aid && (CONFIG.activities || {})[aid];
    if (!act) return [];
    /* WHICH ROLE THIS INSTANCE DRAWS (v0.59 — Suresh: "it's not
       intuitive right now"). Was: infer the master from the activity
       wiring and call everything else "the rest". Nothing declared it,
       so nothing could show it or set it — zones were invisible.
       Now the DEVICE says which it is:
         roles.volume       -> a control on the controller (the master)
         roles.volume_zone  -> a room this feeds, behind the Zones card

    const role = t.role || "volume";
    /* a device inside a group is drawn on the GROUP's page, not here */
    const grouped = groupedDeviceIds(act);
    const dopts = act.device_options || {};
    const dflt = t.style || ((CONFIG.global || {}).style || {}).volume || "compact";
    const out = [];
    castDeviceIds(act).forEach(did => {
      if (grouped.indexOf(did) >= 0) return;
      const d = (CONFIG.devices || {})[did];
      if (!d) return;
      const roles = d.roles || {};

   flashes the prompt — pulsing red for OFF-flavored confirms, accent
   for ON (tone, default "off") — second within TIMING.confirm
   returns true. */
function barConfirm(key, msg, tone) {
  if (barConfirm._t == null) barConfirm._t = {};
  const t = barConfirm._t;
  if (Date.now() - (t[key] || 0) > TIMING.confirm) {
    t[key] = Date.now();
    flashBar(msg, tone || "off", TIMING.confirm);
    return false;
  }
  t[key] = 0;
  cfmClear();          // confirmed: stop the pulse — the action is happening
  return true;
}

/* ================================================================
   MEDIA BROWSE (v0.50 — Suresh's mock: "90% of the time the user
   wants Favorites >> Something"): the STANDARD HA contract
   (media_player/browse_media + media_player.play_media — no service
   hardcoding), presented as THREE BANDS instead of a page-per-level
   crawl:

     band 1 — ROOTS: the tree's curated top level (Favorites, Music
              Library…) + the section's other tiles (Pull Music Here),
              one tight fixed row
     band 2 — CATEGORIES: the selected root's children WHEN they are
              all pure directories (Sonos: Playlists/Albums/Tracks) —
              a thin horizontally-scrollable chip strip. When they
              aren't (Music Assistant's root children ARE categories,
              their children are items), the strip simply doesn't
              appear — the rule generalizes across services.
     grid   — ITEMS: auto-descended on open, scrolls; expandables
              drill in place (‹ up tile), playables play.

   Navigation: tap roots/chips · CH▲▼ steps categories (wraps) ·
   horizontal SWIPE on the grid steps categories too.
   ================================================================ */
S.browse = { mp: null, root: null, cat: null, sub: [], nodes: {}, signed: {},
  busy: {}, ui: null, barTiles: [], _active: false,
  /* SEARCH (v0.65): q = what's typed, qon = the mode, qres = the last
     answer, qcat = which media_class chip filters it */
  q: "", qon: false, qres: null, qbusy: false, qerr: "", qcat: "",
  qmp: null, qseq: 0, qclasses: null, qengine: "",
  /* qkb — is the on-screen keyboard down? (v0.67.2 — Suresh: "I need
     a way to hide/show the keyboard. We can use the input line.") The
     tablet has room for it; once you've typed, the results want the
     space back. Sticky for the session: decided once, not per search. */
  qkb: true };

/* the on-screen keyboard. Deliberately a GRID (Chromium 75 has grid
   gap; flex gap is 84 — see compat.css) and deliberately made of
   buttons, so touch and the D-pad's pointer both just work. */
const KB_ROWS = ["1234567890", "qwertyuiop", "asdfghjkl", "zxcvbnm"];
/* what the result KINDS are called on the chip strip */
const BR_KIND_NAME = {
  artist: "Artists", album: "Albums", track: "Tracks",
  playlist: "Playlists", genre: "Genres", podcast: "Podcasts",
  channel: "Radio", directory: "More", movie: "Films", tv_show: "Shows",
};

/* per-node child cap — the tree can be enormous, the grid cannot */
const BROWSE_CAP = 200;
/* the integration's own per-category favourites cap (sensor.py LIMIT) —
   mirrored here only so the grid can SAY when it has been reached */
const FAV_SENSOR_CAP = 100;

const BROWSE_ICON = {
  playlist: "material:queue_music", album: "material:album",
  artist: "material:person", track: "material:music_note",
  directory: "material:folder", genre: "material:category",
  podcast: "material:podcasts", channel: "material:radio",
  tv_show: "material:tv", movie: "material:movie",
  app: "material:apps", url: "material:link",
  fav_root: "material:star", lib_root: "material:library_music",
};

/* THE BADGE (v0.62 — Suresh: "in All, we could have a tiny badge
   indicating playlist, album, artist, radio, track"). Keyed on the
   FOLDER an item came from, not its media_class: Sonos reports its
   radio favorites as media_class "genre", so the folder is the more
   truthful label. media_class is the fallback. */
const BADGE_BY_CAT = {
  playlists: "material:queue_music", playlist: "material:queue_music",
  albums: "material:album", album: "material:album",
  artists: "material:person", artist: "material:person",
  tracks: "material:audiotrack", track: "material:audiotrack",
  radio: "material:radio", stations: "material:radio",
  podcasts: "material:podcasts", genres: "material:category",
  folders: "material:folder",
};
const brBadge = (catTitle, c) =>
  BADGE_BY_CAT[String(catTitle || "").toLowerCase()] ||
  BROWSE_ICON[c.media_class] || "material:library_music";

/* CHIP ORDER (v0.62 — Suresh: "Can we change the order of the media
   sections"). Until now the SOURCE decided: Sonos hands back Albums /
   Playlists / Radio / Tracks and we never sorted, so that is what you
   saw. `categories: [titles]` on the browse tile reorders AND filters
   by title, case-insensitively; anything unlisted drops. Absent — or
   matching nothing — leaves the source order untouched, so no
   existing tile changes behaviour. */
function brOrder(cats, want) {
  if (!Array.isArray(cats) || !Array.isArray(want) || !want.length) return cats;
  const rank = {};
  want.forEach((w, i) => { rank[String(w).toLowerCase()] = i; });
  const key = c => String(c.title || "").toLowerCase();
  const out = cats.filter(c => rank[key(c)] != null)
    .sort((a, b) => rank[key(a)] - rank[key(b)]);
  return out.length ? out : cats;
}

/* ---- SEARCH (v0.65) ------------------------------------------------
   HA's `media_player/search_media` is the whole backend — no service
   hardcoding, same doctrine as browse. The catch, found by asking the
   house rather than the docs: **Sonos answers an empty list.** Sonos
   has no search; MUSIC ASSISTANT does, and the MA player drives the
   same physical speaker. So search runs against a player that can,
   named by the tile (`search_entity`), and its results play there too
   — the content ids it returns are MA's and mean nothing to Sonos. */
/* the query is USER TEXT going into innerHTML — escape it */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
/* MA → SONOS (v0.66 — Suresh: "The sonos player is the target!").
   MA hands back `spotify--<instance>://track/<id>`; the tail is a real
   Spotify base-62 id, so a canonical `spotify:track:<id>` falls out —
   and HA's Sonos integration checks `share_link.is_share_link(media_id)`
   BEFORE any media_type branch, so Sonos takes it as-is. Verified
   against SoCo's SpotifyShare regex,
       spotify.*[:/](album|episode|playlist|show|track)[:/](\w+)
   which is also why ARTIST is absent below: Sonos cannot share-link an
   artist. Those (and MA's own `library://…`) fall back to the MA
   player, which can always play its own ids. */
const SPOTIFY_SHARE_KINDS = { album: 1, episode: 1, playlist: 1, show: 1, track: 1 };
function brSpotifyUri(id) {
  if (typeof id !== "string") return null;
  let m = /^spotify[^:]*:\/\/([a-z]+)\/([A-Za-z0-9]+)/.exec(id);   /* MA */
  if (!m) m = /^spotify:([a-z]+):([A-Za-z0-9]+)/.exec(id);            /* canonical */
  if (!m) m = /open\.spotify\.com\/([a-z]+)\/([A-Za-z0-9]+)/.exec(id);  /* share URL */
  if (!m || !SPOTIFY_SHARE_KINDS[m[1]]) return null;
  return "spotify:" + m[1] + ":" + m[2];
}

/* ================================================================
   FIVE IS NOT A SEARCH (v0.67.3 — Suresh: "Type 'Love' into search.
   We get 18 result tiles. It should show that there are more, must be
   thousands! Now tap Tracks… I get 5.")

   He read it as a rescope to favourites. It isn't — measured on his
   own box, `media_player/search_media` for "love" returns exactly 5
   per class, and asking for `media_filter_classes: ["track"]` ALONE
   still returns 5. The cap is HA's generic search-media contract and
   it exposes no `limit`. So the tile filter wasn't lying; the well
   was only ever five deep.

   Music Assistant's OWN service does take one:

       music_assistant.search {config_entry_id, name, media_type[],
                               limit, library_only}

   Same query, limit 25 → 23 tracks, mixing `library://` (his ripped
   CDs) with `spotify--<instance>://` (the catalogue) — which is also
   the direct disproof of "scoped to favourites". So when the tile
   DECLARES which Music Assistant answers (`search.config_entry`), we
   ask MA properly and adapt its reply into browse items; without that
   declaration the standard contract still runs, five-deep, unchanged.
   The engine stays dumb: it knows the shape of MA's answer, not which
   MA, nor how deep to dig.
   ================================================================ */
const MA_SEARCH_LIMIT = 25;
/* our browse media_class → MA's media_type argument */
const MA_TYPE = { artist: "artist", album: "album", track: "track",
  playlist: "playlist", channel: "radio", podcast: "podcast",
  audiobook: "audiobook" };
/* …and the bucket MA answers in, per class */
const MA_BUCKET = { artist: "artists", album: "albums", track: "tracks",
  playlist: "playlists", channel: "radio", podcast: "podcasts",
  audiobook: "audiobooks" };
/* MA's image is a URL string on current builds and an object on older
   ones — take either, refuse to care which */
function maImage(o) {
  const im = o && o.image;
  if (!im) return null;
  if (typeof im === "string") return im;
  return im.path || null;
}
/* one MA object → one browse item, so mkItems / brSpotifyUri / the
   badge / the play path all keep working with no idea where it came
   from. `uri` IS a media_content_id: spotify--<inst>://track/<id> is
   exactly what v0.66 already rewrites into a Sonos share link. */
function maItem(o, cls) {
  const who = (Array.isArray(o.artists) ? o.artists : [])
    .map(a => a && a.name).filter(Boolean).join(", ");
  const nm = o.name || "";
  return {
    title: (cls === "album" || cls === "track") && who ? who + " - " + nm : nm,
    media_class: cls, media_content_type: "music",
    media_content_id: o.uri, thumbnail: maImage(o),
    can_play: true, can_expand: cls !== "track", children: [],
  };
}

/* HA-relative thumbnails need auth/sign_path (what the HA frontend
   does); absolute URLs pass straight through. Shared by the tree and
   — new in v0.67.3 — by search results, which never had artwork. */
function brThumbs(list, done) {
  let waiting = 0;
  list.forEach(c => {
    const t = c.thumbnail;
    if (!t || typeof t !== "string") return;
    if (!t.startsWith("/")) { c._thumb = t; return; }
    if (S.browse.signed[t]) { c._thumb = S.browse.signed[t]; return; }
    waiting++;
    send({ type: "auth/sign_path", path: t }, sm => {
      if (sm.success && sm.result && sm.result.path)
        c._thumb = S.browse.signed[t] = sm.result.path;
      if (--waiting === 0) done();
    });
  });
  if (!waiting) done();
}

function brSearchRun(q) {
  const B = S.browse;
  const mp = B.qmp;
  q = (q || "").trim();
  if (!mp || q.length < 2) { B.qres = null; B.qbusy = false; brBusy(false); return; }
  const seq = ++B.qseq;
  B.qbusy = true; B.qerr = "";
  /* PAINT THE WAIT (v0.68.3 — Suresh: "As soon as we fire off any
     search, it should display a line searching for… all i get is a
     blank screen for 30+ seconds").

     v0.68.1 shipped TWO fixes that cancelled each other and I did not
     notice, because I tested them one at a time. The speed fix made
     typing repaint only the query TEXT (brEcho) instead of the whole
     page — right, and it stands. But "Searching…" lives in the GRID,
     and the grid is only built by navigate(). So the one render that
     would have drawn it was the render I had just removed: qbusy went
     true, brBusy() lit the little dot in the bar, and the grid kept
     the empty-query [] it was already showing. Thirty seconds of
     nothing, exactly as reported.

     One render HERE, when a search actually begins — after the 350ms
     debounce, so it is once per query and not once per keystroke. The
     per-keystroke win is untouched. */
  brBusy(true);
  if (S.screen) navigate(S.screen, true);
  const want = (Array.isArray(B.qclasses) && B.qclasses.length)
    ? B.qclasses : ["artist", "album", "track", "playlist"];
  /* `capped` names the kinds that came back FULL — the well is deeper
     than what's on screen, and saying so is the v0.62 no-silent-
     truncation rule applied to search (his "It should show that there
     are more, must be thousands!") */
  const land = (items, capped) => {
    if (seq !== B.qseq) return;             /* a later keystroke won */
    B.qbusy = false;
    brThumbs(items, () => {
      if (seq !== B.qseq) return;
      B.qres = { q: q, items: items, capped: capped || [] };
      if (S.screen) navigate(S.screen, true);
    });
  };
  const fail = msg => {
    if (seq !== B.qseq) return;
    B.qbusy = false; B.qres = { q: q, items: [] }; B.qerr = msg;
    if (S.screen) navigate(S.screen, true);
  };

  /* ---- MA's own search: LOCAL FIRST, THEN THE WORLD ----
     v0.68.3 — Suresh, still: "Still takes a long time for anything to
     display… As soon as we fire off any search, it should display a
     line searching for."

     v0.68.1 split one four-kind call into one call per kind so the
     first kind could paint alone. It helped, but every one of those
     calls still had to go out to Spotify, so the floor was whatever
     the slowest provider round-trip cost — tens of seconds on a bad
     day. Measured on his box: the SAME query with `library_only: true`
     comes back with his own ripped tracks essentially instantly.

     So each kind is now asked TWICE: his library first (local, fast,
     painted the moment it lands) and the providers second (slow,
     merged in as they arrive). Deduped per kind by `uri`, which also
     puts HIS music above the catalogue's — the right order anyway.
     `capped` is judged on the provider wave only; the library wave is
     not the deep well the note is about. */
  if (B.qengine === "music_assistant" && B.qentry) {
    const lim = B.qlimit || MA_SEARCH_LIMIT;
    const acc = {}, seen = {}, capped = [];
    let pending = want.length * 2, failed = 0;
    const paint = () => {
      const items = [];
      want.forEach(c2 => {
        if (acc[c2]) items.push.apply(items, acc[c2]);
      });
      B.qres = { q: q, items: items.slice(0, BROWSE_CAP), capped: capped };
      if (S.screen) navigate(S.screen, true);
    };
    const wave = (cls, libraryOnly) => {
      callServiceResp("music_assistant", "search", {
        config_entry_id: B.qentry, name: q,
        media_type: [MA_TYPE[cls] || cls], limit: lim,
        library_only: !!libraryOnly,
      }, null, m => {
        if (seq !== B.qseq) return;             /* a later keystroke won */
        pending--;
        const fresh = [];
        if (!m.success) { failed++; }
        else {
          const r = (m.result && m.result.response) || m.result || {};
          const bucket = r[MA_BUCKET[cls] || cls];
          if (Array.isArray(bucket)) {
            if (!acc[cls]) { acc[cls] = []; seen[cls] = {}; }
            bucket.forEach(o => {
              if (!o || !o.uri || seen[cls][o.uri]) return;
              seen[cls][o.uri] = 1;
              const it = maItem(o, cls);
              acc[cls].push(it); fresh.push(it);
            });
            if (!libraryOnly && bucket.length >= lim &&
                capped.indexOf(cls) < 0) capped.push(cls);
          }
        }
        if (!pending) { B.qbusy = false; brBusy(false); }
        if (!pending && failed === want.length * 2)
          return fail("Music Assistant didn't answer");
        /* repaint when there is something new to show — or at the end,
           so the "Searching…" line always gets cleared */
        if (!fresh.length && pending) return;
        brThumbs(fresh, () => { if (seq === B.qseq) paint(); });
      });
    };
    want.forEach(cls => { wave(cls, true); wave(cls, false); });
    return;
  }

  /* ---- the standard contract: any player, five deep ---- */
  const msg = { type: "media_player/search_media", entity_id: mp,
    search_query: q };
  if (want.length) msg.media_filter_classes = want;
  send(msg, m => {
    if (seq !== B.qseq) return;
    if (!m.success)
      return fail((m.error && m.error.message) || "This player can't search");
    /* HA's generic search caps at 5 per class and never says so —
       declare `search.config_entry` to get MA's deeper answer */
    const got = (((m.result || {}).result) || []).slice(0, BROWSE_CAP);
    const cnt = {};
    got.forEach(c => { const k = c.media_class || "item";
      cnt[k] = (cnt[k] || 0) + 1; });
    land(got, Object.keys(cnt).filter(k => cnt[k] >= 5));
  });
}
let brQT = null;
function brSearchSoon() {
  clearTimeout(brQT);
  brQT = setTimeout(() => brSearchRun(S.browse.q), TIMING.searchDebounce || 350);
}
/* TYPING MUST NOT REBUILD THE PAGE (v0.67.5 — Suresh: "Its a bit
   slow"). Every keystroke was calling navigate(), which tears the grid
   down, re-runs every generator, rebuilds up to 200 tiles, re-focuses,
   repaints all states AND does an unsubscribe/subscribe round trip on
   the socket. One more letter in the query changes NONE of that. So
   when the only thing that moved is the text, repaint the text —
   ~200 DOM nodes and a websocket exchange per keypress become one
   assignment. Returns false if the line isn't on screen, so the
   caller can fall back to a real render. */
function brEcho() {
  const B = S.browse;
  const bar = document.getElementById("brbar");
  const el = bar && bar.querySelector(".brqt");
  if (!el) return false;
  el.innerHTML = B.q ? esc(B.q)
    : `<i class="brqp">${B.qkb ? "type to search…" : "tap to type…"}</i>`;
  return true;
}
/* the busy dot lives in the DOM permanently now (hidden when idle) so
   it can be toggled without a re-render */
function brBusy(on) {
  const bar = document.getElementById("brbar");
  const el = bar && bar.querySelector(".brqs");
  if (el) el.classList.toggle("hidden", !on);
}
/* every key the search bar can send: a character, ⌫, or clear */
function brKey(ch) {
  const B = S.browse;
  if (!B.qon) return;
  /* a filter or a drill-in that has to be dropped DOES change the
     grid — that one needs the full render */
  const gridMoves = !!B.qcat || B.sub.length > 0 || ch === "!";
  if (ch === "<") B.q = B.q.slice(0, -1);
  else if (ch === "!") { B.q = ""; B.qres = null; B.qerr = ""; }
  else if (ch === "_") B.q += " ";
  else B.q += ch;
  B.qcat = "";
  B.sub = [];                 /* a new query leaves any drill behind */
  brSearchSoon();
  if (gridMoves || !brEcho()) navigate(S.screen, true);
}
function brSearchToggle() {
  const B = S.browse;
  B.qon = !B.qon;
  B.sub = [];
  /* opening search always opens the keyboard — you came here to type */
  if (B.qon) B.qkb = true;
  else { B.q = ""; B.qres = null; B.qerr = ""; B.qcat = ""; }
  navigate(S.screen, true);
}
/* the query line IS the keyboard's switch (v0.67.2) */
function brKbToggle() {
  S.browse.qkb = !S.browse.qkb;
  navigate(S.screen, true);
}

/* the synthetic first chip: every category at once, unsliced */
const BR_ALL = {
  title: "All", media_content_id: "__all", media_content_type: "__brall",
  media_class: "directory", can_expand: true, can_play: false,
};

/* a PURE DIRECTORY — expandable, not playable. Bands are built from
   these; anything else is an item. */
const brDir = c => !!c.can_expand && !c.can_play;
const brRef = c => ({ id: c.media_content_id, type: c.media_content_type,
  title: c.title });
const brSame = (c, sel) => !!sel && c.media_content_id === sel.id &&
  c.media_content_type === sel.type;

/* the key carries TYPE and id — Sonos's Favorites / Music Library
   root children have an EMPTY media_content_id (v0.49.1): an empty
   id is NOT the root; only a null node is. */
function browseKey(mp, node) {
  return mp + "|" + (node ? (node.type || "") + ":" + (node.id != null ? node.id : "") : "");
}

function browseFetch(mp, node) {
  const key = browseKey(mp, node);
  if (S.browse.nodes[key] || S.browse.busy[key]) return;
  S.browse.busy[key] = true;
  const msg = { type: "media_player/browse_media", entity_id: mp };
  if (node) {
    msg.media_content_id = node.id != null ? node.id : "";
    msg.media_content_type = node.type;
  }
  send(msg, m => {
    delete S.browse.busy[key];
    if (!m.success) {
      S.browse.nodes[key] = {
        title: "Library", children: [],
        error: (m.error && m.error.message) || "This player can't browse media",
      };
      if (S.screen) navigate(S.screen, true);
      return;
    }
    const r = m.result || {};
    /* NO SILENT TRUNCATION (v0.62): the cap has always been here; what
       was missing was saying so. `more` counts what this node holds
       and we don't show — our own slice plus whatever HA already
       withheld (not_shown) — and mkItems prints a final row. */
    const all = r.children || [];
    const kids = all.slice(0, BROWSE_CAP);
    const more = (all.length - kids.length) + (r.not_shown || 0);
    /* thumbnails via brThumbs (v0.67.3 — the same pass search now
       uses; it was inline here and search had none at all) */
    brThumbs(kids, () => {
      S.browse.nodes[key] = { title: r.title, children: kids, more: more };
      if (S.screen) navigate(S.screen, true);
    });
  });
}

/* ---- selection (each re-renders the screen) ---- */
function brSelRoot(c) {
  S.browse.root = brRef(c);
  S.browse.cat = null; S.browse.sub = [];
  navigate(S.screen, true);
}
function brSelCat(c) {
  S.browse.cat = brRef(c);
  S.browse.sub = [];
  navigate(S.screen, true);
}
function brStepCat(dir) {
  const ui = S.browse.ui;
  if (!ui || !ui.cats || ui.cats.length < 2) return false;
  /* the placeholder strip drawn before an answer exists (v0.68.1) is a
     LABEL, not a control — CH▲▼ and swipe must not step it */
  if (ui.cats.some(c => c.disabled)) return false;
  /* SEARCH CHIPS STEP TOO (v0.68.1): in search mode the strip filters
     results by media_class and the selection lives in `qcat`, so the
     tree's root/cat refs never matched and CH▲▼ silently did nothing */
  if (S.browse.qon) {
    const cats = ui.cats;
    const at = cats.findIndex(c => (c.qclass || "") === (S.browse.qcat || ""));
    const nx = cats[((at < 0 ? 0 : at) + dir + cats.length) % cats.length];
    S.browse.qcat = nx.qclass || "";
    flashBar(nx.title);
    navigate(S.screen, true);
    return true;
  }
  const cur = ui.flat ? S.browse.root : S.browse.cat;
  const i = ui.cats.findIndex(c => brSame(c, cur));
  const n = ui.cats[((i < 0 ? 0 : i) + dir + ui.cats.length) % ui.cats.length];
  if (ui.flat) brSelRoot(n); else brSelCat(n);
  flashBar(n.title);
  return true;
}
/* in-grid drill below the bands (deep trees: artist → albums → …) */
function browseGo(ref) {
  if (ref === "__up") S.browse.sub.pop();
  else S.browse.sub.push(ref);
  navigate(S.screen, true);
}

/* ---- THE BAR (#brbar): bands 1+2, fixed above the grid ---- */
function browseBar() {
  const bar = document.getElementById("brbar");
  if (!bar) return;
  const B = S.browse;
  if (!B._active || !B.ui) {
    bar.classList.remove("onbar"); bar.innerHTML = ""; return;
  }
  bar.classList.add("onbar");
  const ic = c => c._thumb
    ? `<img src="${c._thumb}" alt="">`
    : `<span class="material-symbols-outlined">${
        (BROWSE_ICON[c.media_class] || "material:library_music").slice(9)}</span>`;
  /* FLAT TREES (v0.50.2 — Suresh: "Sonos is better"): when the top
     level IS the categories (Music Assistant), the chips carry the
     selection and the roots row shrinks to the section's own tiles
     (Pull Music Here) — or disappears entirely. */
  let html = "";
  /* A CONTROL WITH ONE OPTION IS NOT A CONTROL (v0.62 — Suresh, of
     the lone Sonos "Favorites" badge: "What does the favorite icon at
     the top do?"). Nothing: it selects the only root there is, because
     the other eight are media-source:// and hidden. So the row only
     renders when it carries a real choice — or a tile of its own. It
     comes back by itself the moment a second root exists. */
  if (B.barTiles.length || B.ui.roots.length > 1) {
    html += `<div class="brrow">`;
    B.barTiles.forEach((t, i) => {
      html += `<button class="brroot" data-brt="${i}">` +
        (t.icon && t.icon.startsWith("material:")
          ? `<span class="material-symbols-outlined">${t.icon.slice(9)}</span>` : "") +
        `<span class="brl">${t.label || ""}</span></button>`;
    });
    B.ui.roots.forEach((c, i) => {
      html += `<button class="brroot${brSame(c, B.root) ? " on" : ""}" data-brr="${i}">` +
        ic(c) + `<span class="brl">${c.title}</span></button>`;
    });
    html += `</div>`;
  }
  /* SEARCH (v0.65): the query line + keyboard sit ABOVE the chips, so
     the chips keep meaning "which slice of what I'm looking at" in
     both modes — categories while browsing, result KINDS while
     searching. */
  if (B.qon) {
    const shown = B.q ? esc(B.q)
      : `<i class="brqp">${B.qkb ? "type to search…" : "tap to type…"}</i>`;
    /* THE LINE IS THE SWITCH (v0.67.2): tapping anywhere on the query
       line that isn't ⌫ or ✕ raises/lowers the keyboard. The trailing
       chevron button says so out loud for anyone who wouldn't guess. */
    html += `<div class="brq" data-brkb="1">` +
      `<span class="material-symbols-outlined brqi">search</span>` +
      `<span class="brqt">${shown}</span>` +
      `<span class="brqs${B.qbusy ? "" : " hidden"}">…</span>` +
      `<button class="brqb" data-brk="&lt;" title="Backspace">⌫</button>` +
      /* clear-text only exists while there IS text — so the ✕ next to
         the close button is never ambiguous (v0.68.1) */
      (B.q ? `<button class="brqb" data-brk="!" title="Clear">✕</button>` : "") +
      `<button class="brqb brqk" data-brkb="1" title="${
        B.qkb ? "Hide keyboard" : "Show keyboard"}">` +
      `<span class="material-symbols-outlined">${
        B.qkb ? "keyboard_hide" : "keyboard"}</span></button>` +
      /* LEAVING SEARCH NEEDS A DOOR (v0.68.1 — Suresh: "Clicking the
         magnifying glass takes me out of search mode, but its not
         obvious. Maybe we have a close icon after the keyboard icon").
         The magnifier chip still toggles; this is the obvious way. */
      `<button class="brqb brqx" data-brqx="1" title="Close search">` +
      `<span class="material-symbols-outlined">close</span></button></div>`;
    if (B.qkb)
      html += `<div class="brkb">` + KB_ROWS.map(r =>
        `<div class="brkr">` + r.split("").map(ch =>
          `<button class="brk" data-brk="${ch}">${ch}</button>`).join("") + `</div>`
      ).join("") +
        `<div class="brkr"><button class="brk brksp" data-brk="_">space</button></div>` +
        `</div>`;
  }
  if (B.ui.cats || B.qmp) {
    const sel = B.ui.flat ? B.root : B.cat;
    /* WHICH CHIP AM I ON? (v0.67.5 — Suresh: "when I click a tab like
       Tracks in search mode, that should highlight"). The tree's chips
       are compared by media id; the SEARCH chips are synthetic and the
       selection lives in `qcat` (a media_class), so brSame() looked at
       B.cat — never set in search mode — and nothing ever lit up. */
    const onChip = c => B.qon
      ? (c.qclass || "") === (B.qcat || "")
      : brSame(c, sel);
    html += `<div class="brchips">`;
    /* the magnifier is a CHIP: the strip is already where you choose
       what you're looking at, and a lone root row may not exist */
    if (B.qmp)
      html += `<button class="brchip brchipq${B.qon ? " on" : ""}" data-brq="1"` +
        ` title="Search the library"><span class="material-symbols-outlined">search</span></button>`;
    html += (B.ui.cats || []).map((c, i) =>
      `<button class="brchip${onChip(c) ? " on" : ""}" data-brc="${i}"${
        c.disabled ? " disabled" : ""}>${c.title}</button>`
    ).join("") + `</div>`;
  }
  bar.innerHTML = html;
  bar.querySelectorAll("[data-brt]").forEach(b =>
    b.addEventListener("click", () => {
      const t = B.barTiles[+b.dataset.brt];
      const w = WIDGETS[t.type];
      if (w && w.select) w.select(resolveEntity(t.entity), t);
    }));
  bar.querySelectorAll("[data-brr]").forEach(b =>
    b.addEventListener("click", () => {
      const c = B.ui.roots[+b.dataset.brr];
      /* an expandable root selects; a playable-only root just PLAYS
         (a favorite station pinned at the top level) */
      if (c.can_expand) brSelRoot(c);
      else callService("media_player", "play_media",
        { media_content_id: c.media_content_id,
          media_content_type: c.media_content_type }, B.mp);
    }));
  bar.querySelectorAll("[data-brc]").forEach(b =>
    b.addEventListener("click", () => {
      const c = B.ui.cats[+b.dataset.brc];
      /* in search mode the chips filter the RESULTS by media_class */
      if (B.qon) { B.qcat = c.qclass || ""; navigate(S.screen, true); return; }
      if (B.ui.flat) brSelRoot(c); else brSelCat(c);
    }));
  bar.querySelectorAll("[data-brq]").forEach(b =>
    b.addEventListener("click", brSearchToggle));
  bar.querySelectorAll("[data-brk]").forEach(b =>
    b.addEventListener("click", ev => {
      ev.stopPropagation();       /* ⌫/✕ sit INSIDE the toggling line */
      brKey(b.dataset.brk);
    }));
  bar.querySelectorAll("[data-brkb]").forEach(b =>
    b.addEventListener("click", ev => { ev.stopPropagation(); brKbToggle(); }));
  bar.querySelectorAll("[data-brqx]").forEach(b =>
    b.addEventListener("click", ev => { ev.stopPropagation(); brSearchToggle(); }));
  /* horizontal SWIPE on the grid steps categories (touch) */
  if (!browseBar._swipe) {
    browseBar._swipe = true;
    const g = document.getElementById("grid");
    let sx = 0, sy = 0, st = 0;
    g.addEventListener("pointerdown", e => {
      sx = e.clientX; sy = e.clientY; st = Date.now();
    }, { passive: true });
    g.addEventListener("pointerup", e => {
      if (!S.browse._active) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Date.now() - st < 600 && Math.abs(dx) > 70 && Math.abs(dy) < 50)
        brStepCat(dx < 0 ? 1 : -1);
    }, { passive: true });
  }
}

/* ================================================================
   QUEUE (v0.51 — Suresh: "One thing that would be nice for all
   music players is the queue… Each item would be a full row tile.
   Click and we jump to that song.")

   The queue is NOT part of HA's standard media_player contract, so
   this speaks per-platform services through ADAPTER PROBING — no
   name-guessing: each adapter is TRIED (a call with return_response)
   and the first that answers owns the entity from then on. Probed
   live 2026-07-31 on Suresh's HA:
     · Music Assistant — mass_queue.get_queue_items {entity,
       limit_before, limit_after} → [items]; jump =
       mass_queue.play_queue_item {entity, queue_item_id}
     · Sonos — sonos.get_queue @entity → [{media_title,
       media_artist, media_album_name, …}]; jump =
       sonos.play_queue {queue_position} (list order)
   Neither answers → "Queue not available for this player".
   ================================================================ */
S.queue = { ent: null, items: null, busy: false, err: null, adapter: {} };

const QUEUE_ADAPTERS = [
  {
    id: "ma",
    get: (e, cb) => callServiceResp("mass_queue", "get_queue_items",
      { entity: e, limit_before: 30, limit_after: 170 }, null, cb),
    map: (it, i) => ({
      title: it.media_title || it.title || it.name || "…",
      artist: it.media_artist || it.artist || "",
      album: it.media_album_name || it.album || "",
      image: it.media_image || it.image || null,
      action: { service: "mass_queue.play_queue_item",
        data: { entity: null /* stamped below */, queue_item_id:
          it.queue_item_id || it.item_id || null } },
    }),
  },
  {
    id: "sonos",
    get: (e, cb) => callServiceResp("sonos", "get_queue", {}, e, cb),
    map: (it, i) => ({
      title: it.media_title || "…",
      artist: it.media_artist || "",
      album: it.media_album_name || "",
      image: null,
      action: { service: "sonos.play_queue", target: null /* stamped */,
        data: { queue_position: i } },
    }),
  },
];

function queueFetch(ent) {
  const Q = S.queue;
  if (Q.busy) return;
  Q.busy = true; Q.err = null;
  const known = Q.adapter[ent];
  const order = known
    ? QUEUE_ADAPTERS.filter(a => a.id === known)
    : QUEUE_ADAPTERS;
  const tryAt = (i) => {
    if (i >= order.length) {
      Q.busy = false; Q.ent = ent; Q.items = [];
      Q.err = "Queue not available for this player";
      if (S.screen === "queue:" + ent) navigate(S.screen, true);
      return;
    }
    const ad = order[i];
    ad.get(ent, m => {
      if (!m.success) { tryAt(i + 1); return; }
      Q.adapter[ent] = ad.id;
      const resp = (m.result && m.result.response) || {};
      const raw = resp[ent] || [];
      Q.busy = false; Q.ent = ent;
      Q.items = raw.slice(0, 200).map((it, i2) => {
        const r = ad.map(it, i2);
        /* stamp the entity into the jump action */
        if (r.action.data && "entity" in r.action.data)
          r.action.data.entity = ent;
        if ("target" in r.action) r.action.target = ent;
        return r;
      });
      if (S.screen === "queue:" + ent) navigate(S.screen, true);
    });
  };
  tryAt(0);
}

/* the virtual QUEUE screen: full-row tiles, ▶ marks the playing one
   (matched on the player's live media_title), tap = jump */
function queueScreen(eid) {
  if (!eid) return null;
  const Q = S.queue;
  const fn = st(eid).a.friendly_name;
  const name = (fn || eid.split(".")[1].replace(/_/g, " ")) + " · Queue";
  let tiles;
  if (Q.ent !== eid || Q.items === null) {
    queueFetch(eid);
    tiles = [{ id: "q_ld", type: "preset", icon: "material:hourglass_empty",
      label: "Loading queue…", action: {} }];
  } else if (Q.err) {
    tiles = [{ id: "q_err", type: "preset", icon: "material:error_outline",
      label: Q.err, action: {} }];
  } else if (!Q.items.length) {
    tiles = [{ id: "q_mt", type: "preset", icon: "material:queue_music",
      label: "The queue is empty", action: {} }];
  } else {
    /* qrow tiles (v0.51.1 — Suresh's mock): art left · bold title ·
       "artist · album" on line two · ▶ HARD RIGHT — and the mark is
       LIVE (each row carries the player entity, so state updates
       re-evaluate isOn instead of a baked-at-build label) */
    tiles = Q.items.map((r, i) => ({
      id: "q_" + i, type: "qrow", entity: eid,
      label: r.title,
      sub_label: [r.artist, r.album].filter(Boolean).join(" · "),
      q_title: r.title, q_artist: r.artist,
      icon: "material:music_note",
      ...(r.image ? { icon_image: r.image } : {}),
      action: r.action,
    }));
  }
  const nowT = st(eid).a.media_title;
  const nowRow = tiles.find(x => x.q_title === nowT);
  return {
    name, virtual: true, class: "group", font_scope: "music",
    grid: { columns: 1 },
    tiles,
    initial_focus: (nowRow || tiles[0]).id,
  };
}

/* ================================================================
   KEY CAPTURE (v0.55 — Suresh: "we need a v1 capture helper") — a
   VIRTUAL SCREEN (the queue: pattern: an address, no config
   authoring). Open it, press keys on whatever remote is paired to
   this device, and every arriving event renders as a row — raw
   key · code · keyCode, plus what the CURRENT keymap resolves it
   to. UNMAPPED rows get the accent ring: those are the codes you
   are hunting when learning a new remote. While this screen is
   up, the engine SWALLOWS every key (logging is the point — a
   captured "back" must not navigate); exit is the title-bar ‹
   chevron (touch/mouse — this is a setup surface, someone is
   holding the device). Rows are newest-first, capped at 60.

   v0.56 — CAPTURE-ASSIGN (Suresh: "in next iteration of capture, I
   can hit the remote key, and on the tile, press to assign the
   physical key!"). The screen now leads with THE REMOTE: the
   profile's soft_layout (the Studio's ✎ layout builder — the same
   data, the same order, blanks included) rendered as slot tiles.
   The flow is two gestures and no typing: press a key on the
   physical remote (it becomes PENDING, shown in the hint tile),
   then tap the slot it belongs to. 💾 Save reads the live config
   over the authenticated Studio API, merges the assignments into
   remotes.<this device>.keymap, POSTs it back (the integration
   validates + deploys), and applies them to the running KEYMAP
   immediately — so the very next press already routes.

   Custom slot names are first-class by v0.54's open button
   vocabulary: assigning "Red" mints the logical button `Red`,
   bindable from any screen's `buttons:` map with zero engine
   edits.
   ================================================================ */
S.keycap = [];
S.keyPending = null;    // last raw key captured — the thing to assign
S.keyAssign = {};       // raw key → logical slot name (this session)

/* the glyph vocabulary, mirrored from the Studio's soft remote so the
   slot grid READS as the remote's face. Plain text on purpose — no
   icon font between you and a diagnostic surface. A CUSTOM slot name
   (Red, "..", anything Suresh types into the layout builder) has no
   glyph and doesn't get a dot: its own name is the legend, and the
   stylesheet promotes a glyph-less slot's label to key size. */
const KEYCAP_GLYPHS = {
  back: "↩", home: "⌂", power: "⏻", menu: "≡",
  up: "▲", down: "▼", left: "◀", right: "▶", select: "OK",
  vol_up: "＋", vol_down: "－", ch_up: "CH＋", ch_down: "CH－",
  mute: "🔇", info: "ⓘ",
};
const keycapGlyph = n => KEYCAP_GLYPHS[n] || "";

/* the stock arrangement, mirrored from the Studio's soft-remote
   editor: what a remote looks like before anyone describes one */
const KEYCAP_DEFAULT_LAYOUT = [
  ["back", "home", "power"],
  ["vol_up", "up", "ch_up"],
  ["left", "select", "right"],
  ["vol_down", "down", "ch_down"],
  ["menu", "mute", null],
];

function keycapLog(e) {
  S.keycap.unshift({
    key: e.key, code: e.code || "?", kc: e.keyCode,
    mapped: keycapMap()[e.key] || null,
  });
  if (S.keycap.length > 60) S.keycap.length = 60;
  S.keyPending = e.key;
  if (S.screen === "keys:") navigate(S.screen, true);
}

/* effective map = what the profile ships + what this session has
   assigned but not yet saved (so a slot's sub tells the truth the
   instant you tap it, before the round trip) */
function keycapMap() { return Object.assign({}, KEYMAP, S.keyAssign); }

/* every raw key that currently emits this logical button */
function keysForSlot(name) {
  const m = keycapMap();
  return Object.keys(m).filter(k => m[k] === name);
}

function keycapLayout() {
  const L = (DEVICE && DEVICE.soft_layout) || KEYCAP_DEFAULT_LAYOUT;
  return Array.isArray(L) && L.length ? L : KEYCAP_DEFAULT_LAYOUT;
}

/* tap a slot = the pending key becomes this slot's key. Reassigning
   a raw key simply overwrites — one key, one logical button. */
function keycapAssign(name) {
  if (!S.keyPending) {
    flashBar("Press a key on the remote first", "off");
    return;
  }
  const k = S.keyPending;
  S.keyAssign[k] = name;
  S.keyPending = null;
  /* the log rows show resolutions — refresh them with the new truth */
  S.keycap.forEach(r => { r.mapped = keycapMap()[r.key] || null; });
  /* re-render FIRST: navigate() rewrites the bar title, so the flash
     has to land after it or it never gets read */
  navigate("keys:", true);
  flashBar(JSON.stringify(k) + " → " + name);
}

/* Save: GET the live config for THIS workspace, merge the session's
   assignments into this remote's keymap, POST it back. The Studio
   API is the same authenticated endpoint the Studio itself uses —
   the integration validates and deploys, so the change reaches
   every remote on this workspace, not just the one in your hand. */
function keycapApiBase() {
  const host = localStorage.getItem("hakr_host");
  return (host && host !== location.host)
    ? location.protocol + "//" + host : "";
}
async function keycapSave() {
  const n = Object.keys(S.keyAssign).length;
  if (!n) { flashBar("Nothing to save — capture a key, then tap a slot", "off"); return; }
  const dev = S.deviceName || "default";
  const url = keycapApiBase() + "/api/harmonium/config" +
    (WS && WS !== "main" ? "?ws=" + encodeURIComponent(WS) : "");
  const auth = { Authorization: "Bearer " + (localStorage.getItem("hakr_token") || "") };
  let msg, tone;
  try {
    const g = await fetch(url, { headers: auth, cache: "no-store" });
    if (!g.ok) throw new Error("GET " + g.status);
    const cfg = await g.json();
    if (!cfg.remotes) cfg.remotes = {};
    const p = cfg.remotes[dev] ||
      (cfg.remotes[dev] = { capabilities: ["touch", "pointer"] });
    /* a profile with no keymap of its own has been riding the global
       one — inherit it once, so saving never silently narrows it */
    p.keymap = Object.assign({}, p.keymap || cfg.keymap || {}, S.keyAssign);
    const q = await fetch(url, {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, auth),
      body: JSON.stringify(cfg),
    });
    if (!q.ok) throw new Error("POST " + q.status);
    /* live, immediately: the next press already routes */
    KEYMAP = Object.assign({}, KEYMAP, S.keyAssign);
    if (DEVICE) DEVICE.keymap = Object.assign({}, p.keymap);
    if (CONFIG) {
      if (!CONFIG.remotes) CONFIG.remotes = {};
      CONFIG.remotes[dev] = p;
    }
    S.keyAssign = {};
    msg = "Saved " + n + " key" + (n > 1 ? "s" : "") + " to '" + dev + "'";
    tone = "on";
  } catch (err) {
    msg = "Save failed: " + err.message;
    tone = "off";
  }
  /* re-render first (the sub lines and the Save tile change), then
     flash — navigate() would otherwise overwrite the message */
  navigate("keys:", true);
  flashBar(msg, tone);
}

function keysScreen() {
  const dev = S.deviceName || "default";
  const pend = S.keyPending;
  const nAssign = Object.keys(S.keyAssign).length;

  /* --- band 1: THE REMOTE (the slot grid, in the profile's order) */
  const slots = [];
  keycapLayout().forEach((row, ri) => (row || []).forEach((name, ci) => {
    const id = "ks_" + ri + "_" + ci;
    if (!name) {           // a blank in the physical grid stays a blank
      slots.push({ id, type: "kslot", blank: true, icon: " ", label: "" });
      return;
    }
    slots.push({ id, type: "kslot", slot: name, icon: keycapGlyph(name), label: name });
  }));

  /* --- band 2: the pending readout + save */
  const tools = [{
    id: "kc_hint", type: "preset",
    icon: "material:" + (pend ? "touch_app" : "keyboard"),
    ...(pend ? { color: "var(--accent)" } : {}),
    label: pend ? "Pending: " + JSON.stringify(pend) : "Press a key on the remote…",
    sub_label: pend
      ? "now tap the slot it belongs to"
      : "then tap its slot above · accent ring below = unmapped · exit with ‹",
    action: {},
  }, {
    id: "kc_save", type: "kslot", save: true, icon: "💾",
    label: nAssign ? "Save " + nAssign + " to '" + dev + "'" : "Save",
    sub_label: nAssign ? "writes this remote's keymap and deploys"
      : "nothing assigned yet",
  }];

  /* --- band 3: RECENT KEYS (the v0.55 log, unchanged in spirit) */
  const rows = S.keycap.map((r, i) => ({
    id: "kc_" + i, type: "preset",
    icon: "material:" + (r.mapped ? "keyboard_return" : "help"),
    ...(r.mapped ? {} : { color: "var(--accent)" }),
    label: JSON.stringify(r.key) + " · " + r.code + " · kc " + r.kc,
    sub_label: r.mapped ? "→ " + r.mapped : "unmapped in '" + dev + "'",
    action: {},
  }));

  return {
    name: "Key capture", virtual: true, class: "group",
    grid: { columns: 1 },
    sections: [
      { title: "The remote — " + dev, hero_label: "Remote",
        columns: 3, tiles: slots },
      { columns: 1, tiles: tools },
      { title: "Recent keys", hero_label: "Keys", columns: 1, tiles: rows },
    ],
    initial_focus: "kc_hint",
  };
}

/* ================================================================
   Device detail screens — VIRTUAL screens, generated per domain.
   navigate("detail:<entity_id>") composes generic primitives
   (power / stepper / chips). Chip options and stepper values come
   from the entity's own attributes, so no config is needed and the
   choices are always what the device actually supports.
   ================================================================ */

/* stepper bindings: one adjustable range per kind */
const STEP_KINDS = {
  temperature: {
    get: e => st(e).a.temperature, fmt: v => (v != null ? v : "–") + "°", step: 1,
    set: (e, v) => callService("climate", "set_temperature", { temperature: v }, e)
  },
  brightness: {
    get: e => st(e).s === "on" ? Math.round((st(e).a.brightness || 0) / 2.55) : 0,
    fmt: v => (v != null ? v : 0) + "%", step: 10, min: 0, max: 100, slider: "h",
    set: (e, v) => callService("light", "turn_on", { brightness_pct: v }, e)
  },
  volume: {
    get: e => Math.round((st(e).a.volume_level || 0) * 100),
    fmt: v => (v != null ? v : 0) + "%", step: 3, min: 0, max: 100, slider: "h",
    set: (e, v) => callService("media_player", "volume_set", { volume_level: v / 100 }, e)
  },
  percentage: {
    get: e => { const p = st(e).a.percentage; return p != null ? p : 0; },
    fmt: v => (v != null ? v : 0) + "%", step: 10, min: 0, max: 100, slider: "h",
    set: (e, v) => callService("fan", "set_percentage", { percentage: v }, e)
  },
  position: {
    /* invert_position: display = deployment (100 - HA position), so a
       retracted projector screen reads 0%. get/set both invert, so
       slider, −/+, and VOL stay coherent; cover SERVICES never invert. */
    get: e => {
      const cp = st(e).a.current_position; const p = cp != null ? cp : 0;
      return entOpt(e, "invert_position") ? 100 - p : p;
    },
    fmt: v => (v != null ? v : 0) + "%", step: 10, min: 0, max: 100, slider: "v",
    set: (e, v) => callService("cover", "set_cover_position",
      { position: entOpt(e, "invert_position") ? 100 - v : v }, e)
  }
};
function nudgeStep(e, kind, dir) {
  const k = STEP_KINDS[kind];
  if (!k || !e) return;
  let v = (+k.get(e) || 0) + dir * k.step;
  if (k.min != null) v = Math.max(k.min, v);
  if (k.max != null) v = Math.min(k.max, v);
  k.set(e, v);
}

/* chip bindings: an options list (from attributes) + a setter */
const CHIP_KINDS = {
  hvac_mode: { options: e => st(e).a.hvac_modes, current: e => st(e).s,
    set: (e, v) => callService("climate", "set_hvac_mode", { hvac_mode: v }, e) },
  fan_mode: { options: e => st(e).a.fan_modes, current: e => st(e).a.fan_mode,
    set: (e, v) => callService("climate", "set_fan_mode", { fan_mode: v }, e) },
  preset: { options: e => st(e).a.preset_modes, current: e => st(e).a.preset_mode,
    set: (e, v) => callService((e || "").split(".")[0], "set_preset_mode", { preset_mode: v }, e) },
  source: { options: e => st(e).a.source_list, current: e => st(e).a.source,
    set: (e, v) => callService("media_player", "select_source", { source: v }, e) },
  effect: { options: e => st(e).a.effect_list, current: e => st(e).a.effect,
    set: (e, v) => callService("light", "turn_on", { effect: v }, e) },
  /* v0.57: receivers publish listening modes — MultiChannel Stereo on
     the Onkyo's own page beats bouncing it through Harmony IR */
  sound_mode: { options: e => st(e).a.sound_mode_list, current: e => st(e).a.sound_mode,
    set: (e, v) => callService("media_player", "select_sound_mode", { sound_mode: v }, e) }
};
function cycleChip(e, t, dir) {
  const k = CHIP_KINDS[t.kind], opts = (k && k.options(e)) || [];
  if (!opts.length) return;
  const i = Math.max(0, opts.indexOf(k.current(e)));
  k.set(e, opts[(i + dir + opts.length) % opts.length]);
}

/* Roving highlight for button-row widgets (coverbtns, transport):
   while the row tile is merely FOCUSED, ◀▶ move a highlight across
   its buttons and select presses the highlighted one — no capture
   step, matches "a row of physical buttons". Buttons are located by
   data-<attr>; default index 1 = the center button (Stop/Play-Pause). */
function roveBtns(t, attr) {
  const el = document.getElementById("tile_" + t.id);
  return el ? [el, [...el.querySelectorAll(`[data-${attr}]`)]] : [null, []];
}
function roveMove(t, attr, d) {
  const [el, btns] = roveBtns(t, attr);
  if (!btns.length) return;
  el._ci = ((el._ci != null ? el._ci : 1) + d + btns.length) % btns.length;
  btns.forEach((b, i) => b.classList.toggle("cvsel", i === el._ci));
}
function rovePick(t, attr) {
  const [el, btns] = roveBtns(t, attr);
  return btns.length ? btns[el._ci != null ? el._ci : 1].dataset[attr] : null;
}

/* per-domain detail composition (chips with no options self-hide).
   Layout doctrine (v0.9.3): row 1 = power toggle (back is the GLOBAL
   status-bar chevron); NO headings — a small dim icon marks each
   row's meaning; option buttons are preset-tile sized. */
const DETAIL_TILES = {
  climate: e => [
    { id: "dp", type: "power", entity: e, label: "", span: 2 },
    { id: "ds", type: "stepper", kind: "temperature", entity: e, icon: "material:thermostat", label: "", span: 2 },
    { id: "dm", type: "chips", kind: "hvac_mode", entity: e, icon: "material:hvac", label: "", span: 2 },
    { id: "df", type: "chips", kind: "fan_mode", entity: e, icon: "material:mode_fan", label: "", span: 2 },
    { id: "dpr", type: "chips", kind: "preset", entity: e, icon: "material:tune", label: "", span: 2 }
  ],
  light: e => [
    { id: "dp", type: "power", entity: e, label: "", span: 2 },
    { id: "ds", type: "stepper", kind: "brightness", entity: e, icon: "material:light_mode", label: "", span: 2 },
    { id: "de", type: "chips", kind: "effect", entity: e, icon: "material:auto_awesome", label: "", span: 2 }
  ],

    { id: "ds", type: "stepper", kind: "volume", entity: e, icon: "material:volume_up", label: "", span: 2 },
    { id: "dsrc", type: "chips", kind: "source", entity: e, icon: "material:input", label: "", span: 2 },
    { id: "dsnd", type: "chips", kind: "sound_mode", entity: e, icon: "material:graphic_eq", label: "", span: 2 }
  ],

    { id: "ds", type: "stepper", kind: "position", entity: e, icon: "material:height", label: "", span: 2 }
  ],
  fan: e => [
    { id: "dp", type: "power", entity: e, label: "", span: 2 },
    { id: "ds", type: "stepper", kind: "percentage", entity: e, icon: "material:mode_fan", label: "", span: 2 },
    { id: "dpr", type: "chips", kind: "preset", entity: e, icon: "material:tune", label: "", span: 2 }

};
/* VOL keys retarget to the device's primary range ON ITS DETAIL SCREEN
   ONLY (everywhere else VOL stays room/activity audio). */
const DETAIL_VOL_KIND = {
  climate: "temperature", light: "brightness",
  media_player: "volume", cover: "position", fan: "percentage"
};

/* the STOCK domain controllers (config.controllers.<domain>, tiles
   bound to "$device") are the editable form of DETAIL_TILES; a
   per-device CUSTOM copy (variant_of: <domain>, entity: <eid>) wins
   for its device. Fallback: the hardcoded composition. */
function bindDeviceTiles(tiles, eid) {
  const sub = v => v === "$device" ? eid
    : Array.isArray(v) ? v.map(sub)
    : (v && typeof v === "object")
      ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, sub(x)]))
      : v;
  return tiles.map(sub);
}
function detailDef(eid) {
  const dom = eid.split(".")[0];
  const cs = (CONFIG && CONFIG.controllers) || {};
  for (const c of Object.values(cs))
    if (c && c.variant_of && c.domain === dom && c.entity === eid) return c;
  const stock = cs[dom];
  return (stock && stock.domain === dom) ? stock : null;
}
function detailScreen(eid) {
  const def = detailDef(eid);
  const raw = def
    ? ((def.tiles && def.tiles.length) ? def.tiles
        : (def.sections || []).flatMap(x => x.tiles || []))
    : (DETAIL_TILES[eid.split(".")[0]] || (() => null))(eid);
  if (!raw || !raw.length) return null;
  const tiles = def ? bindDeviceTiles(raw, eid) : raw;
  return {
    name: st(eid).a.friendly_name || eid.split(".")[1].replace(/_/g, " "),
    virtual: true,
    tiles,
    initial_focus: tiles.some(t => t.id === "ds") ? "ds" : tiles[0].id
  };
}
/* SOURCES detail (v0.35): navigate("sources:<entity>") — the input
   picker as a virtual screen. One chips row (kind source): the live
   source_list, current highlighted, pick → select_source. Launched
   by the `sources` tile and the repurposed title-bar input button. */
function sourcesScreen(eid) {
  if (!eid) return null;
  const fn = st(eid).a.friendly_name;
  return {
    name: (fn || eid.split(".")[1].replace(/_/g, " ")) + " · Inputs",
    virtual: true,
    tiles: [{ id: "dsrc", type: "chips", kind: "source", entity: eid,
      icon: "material:input", label: "", span: 2 }],
    initial_focus: "dsrc"
  };
}

/* GROUPS (v0.60): navigate("group:<id>") renders one group from the
   running activity's cast — its members, each drawn as `shows`. It is
   the SAME mechanism as Devices > Add Nav Card; the only variable is
   what the children render as, which is the whole insight (Suresh:
   "Maybe that is TYPE").

   Virtual, so a shared controller carries one groups generator and
   every room gets its own cards for free. A group with an explicit
   `target` never reaches here — the nav card goes straight to the
   authored page, which then owns everything on it. */
function groupScreen(gid) {
  /* v0.61: presumed too — a group page reached with nothing running
     fills in from the surface its card was on */
  const aid = renderActivityId();
  const act = aid && (CONFIG.activities || {})[aid];
  if (!act) return null;
  const g = castGroup(act, gid);
  if (!g) return null;
  const shows = g.shows || "device";
  const tiles = (g.members || [])
    .map(did => groupChildTile(did, shows, "g_" + gid))
    .filter(Boolean);
  if (!tiles.length) return null;
  return {
    name: (act.name ? act.name + " · " : "") + (g.name || gid),
    virtual: true,
    grid: { columns: (g.grid && g.grid.columns) || 1 },
    tiles
  };
}

/* screen id resolution: config screens + virtual detail screens +
   LIBRARY CONTROLLERS ("controller:<id>" → config.controllers — the
   shared control surfaces; the active activity's context overlay
   parameterizes them, same as any screen) */
function screenOf(id) {
  if (typeof id === "string" && id.startsWith("detail:"))
    return detailScreen(id.slice(7));
  if (typeof id === "string" && id.startsWith("sources:"))
    return sourcesScreen(id.slice(8));
  if (typeof id === "string" && id.startsWith("queue:"))
    return queueScreen(id.slice(6));
  if (id === "keys:")           /* key capture (v0.55) */
    return keysScreen();
  if (typeof id === "string" && id.startsWith("group:"))
    return groupScreen(id.slice(6));   /* a cast group (v0.60) */
  if (typeof id === "string" && id.startsWith("controller:"))
    return (CONFIG && CONFIG.controllers && CONFIG.controllers[id.slice(11)]) || null;
  return (CONFIG && CONFIG.screens && CONFIG.screens[id]) || null;
}

/* effective trailing action for a tile: explicit config wins
   (trailing: false suppresses); detailable device tiles default to
   a settings icon opening their generated detail screen */
function trailingOf(t) {
  if (!t) return null;
  if (t.trailing !== undefined) return t.trailing || null;
  const w = WIDGETS[t.type] || {};
  if (!w.detailable) return null;
  const de = resolveEntity(t.entity);
  return (de && DETAIL_TILES[de.split(".")[0]])
    ? { icon: "material:tune", action: { navigate: "detail:" + de } }
    : null;
}

/* ================================================================
   Widget catalog (chassis adapters).
   ================================================================ */
const pct = v => Math.round(v * 100) + "%";
const st = eid => S.states.get(eid) || { s: "…", a: {} };
const ACTIVE = s => !["off", "idle", "unavailable", "unknown", "standby", null, "…"].includes(s);

/* Shared capture map for device-remote widgets (dpad, passthrough):
   while captured, direction keys go to the tile's remote entity,
   translated through cmdFor (so activity dpad_commands apply). */
const DPAD_CAPTURE = {};
["up", "down", "left", "right", "select", "back"].forEach(k =>
  DPAD_CAPTURE[k] = (e, t) => rc(e, cmdFor(t, k)));

/* Wire a widget body's <button data-ATTR="x"> children to a handler.
   stopPropagation keeps the tap from also firing the tile's select. */
function wireTaps(el, attr, fn) {
  el.querySelectorAll(`[data-${attr}]`).forEach(b =>
    b.addEventListener("click", ev => { ev.stopPropagation(); fn(b.dataset[attr]); }));
}

const WIDGETS = {};

/* LIGHT tile — on/off + brightness%; tap toggles; meter = brightness. */

    }

     hold captures the D-pad for speed; ⚙ trail → generated detail
     (power + speed slider + preset buttons from preset_modes). */
  sub: e => {
    const s = st(e), p = s.a.percentage;
    return cap(s.s) + (s.s === "on" && p ? " · " + p + "%"
      : s.a.preset_mode ? " · " + s.a.preset_mode : "");
  },

  select: e => callService("fan", "toggle", null, e),

  capture: {
    up:   e => nudgeStep(e, "percentage", +1),
    down: e => nudgeStep(e, "percentage", -1),
    select: e => callService("fan", "toggle", null, e)
  }
};

/* SCRIPT tile — runs an HA script; lit while it runs. */
WIDGETS.script = {
    sub: e => st(e).s === "on" ? "Running…" : "Press to run",
    isOn: e => st(e).s === "on",
    select: e => callService("script", "turn_on", null, e)
  };

/* NAV CARD — one tile type that opens another page, in four styles:
     plain   — icon + label button (the old `nav`)
     image   — photo tile (the old `room`)
     summary — live "<n> entities · <k> active" derived from the
               target page's tiles (the old `group`)
     auto    — resolved at render: a picture to show → image; target
               page has entities → summary; else plain.
   Doctrine (2026-07-23): groups are just views; the tile that points
   at one is a nav card. Tap = go there — the target page owns all
   behaviour. */
/* THE PICTURE A ROOM CARD SHOWS (v0.67.2 — Suresh: "I added a nav
   tile to Bar. Not rendering properly."): `auto` used to pick the
   IMAGE style for any card pointing at a room, picture or no picture,
   so a card without `image` rendered <img src=""> — a broken-image
   glyph in a photo-shaped tile. A room already declares its picture
   once, in its banner: BORROW it rather than make the author paste
   the same path twice, and only wear the photo shape when there is
   actually a photo. */
function navImage(t) {
  if (t.image) return t.image;
  const sc = t.target ? screenOf(t.target) : null;
  const b = sc && sc.banner;
  if (b && b.enabled !== false && b.image) return b.image;
  return "";
}
function navStyle(t) {
  /* an explicit image: with nothing to show is still a broken image —
     fall through to the ladder rather than render void */
  if (t.style && t.style !== "auto" &&
      !(t.style === "image" && !navImage(t))) return t.style;
  if (navImage(t)) return "image";
  if (navTargetEntities(t).length) return "summary";
  return "plain";
}
/* summary entities: the explicit list, else DERIVED live from the
   target page's tiles — one source of truth, no baked duplicates */
let _navDepth = 0;
function navTargetEntities(t) {
  if (Array.isArray(t.entities) && t.entities.length) return t.entities;
  if (!t.target) return [];
  const sc = screenOf(t.target);
  if (!sc) return [];
  /* SEE THROUGH GENERATORS (v0.57.1): a zones view whose volumes come
     from a `volumes` tile has no raw .entity to read, so the summary
     used to report "0 entities · 0 active" and `auto` fell back to
     plain. Expand instead — but STAND ON THE TARGET while doing it,
     because generators resolve $context against S.screen and would
     otherwise answer for the wrong room. Depth-guarded: a target that
     carries a nav card pointing back here must not recurse. */
  let tiles;
  if (_navDepth) {
    tiles = rawTilesOf(sc);
  } else {
    const prev = S.screen;
    _navDepth++;
    try { S.screen = t.target; tiles = tilesOf(sc); }
    catch (err) { tiles = rawTilesOf(sc); }
    finally { S.screen = prev; _navDepth--; }
  }
  return tiles.map(x => x.entity)
    .filter(e => typeof e === "string" && e.includes("."));
}

WIDGETS.nav = {
  /* v0.57.1: opt-in — a summary card that summarises NOTHING is
     chrome. Lets the shared controllers carry a "Zones" card that
     simply is not there in a room with a single volume. Opt-in so no
     existing card changes behaviour. */
  hidden: (e, t) => !!t.hide_when_empty && navStyle(t) === "summary" &&
    !navTargetEntities(t).length,
  sub: (e, t) => {
    if (navStyle(t) !== "summary") return (t && t.sub) || "";
    const ents = navTargetEntities(t);
    const on = ents.filter(x => ACTIVE(st(x).s)).length;
    return `${ents.length} entities · ${on} active`;
  },
  isOn: (e, t) =>
    navStyle(t) === "summary" && navTargetEntities(t).some(x => ACTIVE(st(x).s)),
  body: t => navStyle(t) === "image"
    ? `<img class="roomimg" src="${navImage(t)}" alt="">`
    : `<div class="meter hidden"><i></i></div>`,
  /* style rides in as a class (nav-plain / nav-image / nav-summary)
     so the CSS can shape each without a separate widget type */
  wire: (el, t) => el.classList.add("nav-" + navStyle(t)),
  select: (e, t) => { if (t.target) navigate(t.target); else flashBar("No page linked yet"); },
};

/* PRESET tile — icon square that fires an app/preset (warm-start:
   ensures its activity first); drawer screens pop back after firing. */
WIDGETS.preset = {
    sub: (e, t) => t.sub_label || "",
    isOn: (e, t) => !!(t.activity && isActivityActive(t.activity)),
    select: (e, t) => {
      /* BROWSE taps (v0.49) navigate WITHIN the drawer — stepping
         into Albums must not pop the drawer shut */
      if (t.action && t.action.browse !== undefined) {
        browseGo(t.action.browse);
        return;
      }
      const fired = firePreset(t);
      /* drawer screens (apps, music library): picking an item is a
         one-shot — fire it, announce it, and pop back to where the
         drawer was opened from (physical keys drive the UI here, so
         the user shouldn't have to Back out by hand) */
      const sc = screenOf(S.screen) || {};
      /* an explicit `navigate` (v0.68.7) IS the declared landing —
         firePreset has already gone there; popping would undo it */
      if (fired && sc.drawer && !t.navigate) {
        flashBar(t.label);
        if (S.stack.length) navigate(S.stack.pop(), true);
        else if (sc.parent && screenOf(sc.parent)) navigate(sc.parent, true);
      }
    }
  };

/* the QUEUE ROW widget — see queueScreen above. isOn is the LIVE
   playing test (title + artist beats duplicate titles); the ▶ mark
   and the accent highlight both ride renderStates. */
WIDGETS.qrow = {

};

/* TRANSPORT strip — prev · play/pause · next for a media_player. */

    hidden: e => !!e && !sfHas(e, MPF.PAUSE | MPF.PLAY | MPF.NEXT | MPF.PREV | MPF.STOP),

      <button class="dpbtn trbig cvsel" data-tr="media_play_pause"><span class="material-symbols-outlined">play_pause</span></button>
      <button class="dpbtn" data-tr="media_next_track"><span class="material-symbols-outlined">skip_next</span></button>

/* MEDIA buttons — transport-adjacent named keys (rew/ff/…) for

WIDGETS.mediabtns = {
    /* media mode bar: shuffle + repeat for the tile's player.

       ◀▶ rove while focused, select presses (coverbtns model).
       Accent icon = mode active; repeat shows repeat_one on "one". */
    sub: () => "",
    isOn: () => false,
    keys: {
      left:  (e, t) => roveMove(t, "mb", -1),
      right: (e, t) => roveMove(t, "mb", +1)
    },
    select: (e, t) => mbPress(e, rovePick(t, "mb") || "shuffle"),
    body: () => `<div class="btnrow">
      <button class="dpbtn cvsel" data-mb="shuffle"><span class="material-symbols-outlined">shuffle</span></button>
      <button class="dpbtn" data-mb="repeat"><span class="material-symbols-outlined">repeat</span></button>
      <button class="dpbtn" data-mb="queue"><span class="material-symbols-outlined">queue_music</span></button>
    </div>`,
    wire: (el, t) => {
      el._ci = 0;                       // roving default = shuffle (matches cvsel)
      wireTaps(el, "mb", k => mbPress(resolveEntity(t.entity), k));
    },
    render: (el, e) => {
      const a = st(e).a;
      const sh = el.querySelector('[data-mb="shuffle"]');
      const rp = el.querySelector('[data-mb="repeat"]');
      if (sh) sh.classList.toggle("mbon", !!a.shuffle);
      if (rp) {
        rp.classList.toggle("mbon", !!a.repeat && a.repeat !== "off");
        rp.firstElementChild.textContent =
          a.repeat === "one" ? "repeat_one" : "repeat";
      }
    }
  };

function mbPress(e, k) {
  if (!e) return;
  const a = st(e).a;
  /* QUEUE (v0.51 — Suresh: "one thing that would be nice for all music
     players is the queue"): opens the queue view; adapter probing
     decides how (core/queue.js) — refetched fresh on every open */
  if (k === "queue") { S.queue.items = null; navigate("queue:" + e); return; }
  if (k === "shuffle")
    callService("media_player", "shuffle_set", { shuffle: !a.shuffle }, e);
  else {
    const next = { off: "all", all: "one", one: "off" }[a.repeat || "off"] || "all";
    callService("media_player", "repeat_set", { repeat: next }, e);
  }
}

/* BUTTONS strip — a row of named device keys (back/home/menu/…)
