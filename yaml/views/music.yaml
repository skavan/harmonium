id: music
name: Music
kind: activity
parent: porch
activities: [music]

context:
  media_player: media_player.ma_sonos_basement
  power: media_player.ma_sonos_basement
  volume: media_player.ma_sonos_basement

control_target:
  label: $activity.name
  power: $context.power
  volume: $context.volume

buttons:
  ch_up: { service: media_player.media_next_track, entity: $context.media_player }
  ch_down: { service: media_player.media_previous_track, entity: $context.media_player }
  menu_hold: { navigate: music_library }

layout:
  tiles:
    - id: m_np
      type: media
      art: true
      entity: $context.media_player
      icon: material:music_note
      label: Now Playing
      span: 2
      trailing:
        icon: material:library_music
        action: { navigate: music_library }
    - { id: m_tr, type: transport, entity: $context.media_player, label: Transport, span: 2 }
    - { id: m_cmd, type: mediabtns, entity: $context.media_player, label: Modes, span: 2 }
    - { id: m_vol, type: volume, entity: $context.volume, icon: material:volume_up, label: Volume, span: 2 }
