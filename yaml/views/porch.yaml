# PORCH ROOM
# This file describes what the room offers, how its activities behave, and
# exactly what appears on its main page.
id: porch
name: Porch
kind: room
parent: overview

activity_state: input_select.porch_activity
context:
  volume: media_player.ma_soundbar_porch

header:
  image: /local/images/Porch_Render.jpg
  image_opacity: 0.5
  height: 230px
  min_height: 150px
  show_time: true
  overview_view: overview

# Activities belong to the room that offers them. HA scripts own the actual
# orchestration; Harmonium owns display state, routing context, and controls.
activities:
  watch_firetv:
    name: Watch Fire TV
    icon: material:live_tv
    color: "#d97b3a"
    start: script.activity_watch_firetv
    view: tv
    confirm_end: true
    context:
      media_player: media_player.fire_tv_family_192_168_1_65
      dpad: remote.fire_tv_family_192_168_1_65
      power: media_player.sts_samsung_q90_porch
      volume: media_player.sts_samsung_q90_porch
      volume_level: media_player.ma_soundbar_porch
    controls:
      navigation: $context.dpad
      back: { command: back, entity: $context.dpad }
      home: { command: home, entity: $context.dpad }
      power: { service: media_player.toggle, entity: $context.power }
      volume: $context.volume
    state:
      entities:
        - media_player.fire_tv_family_192_168_1_65
        - media_player.sts_samsung_q90_porch
      on:
        all:
          - { entity: media_player.sts_samsung_q90_porch, state: "on" }
          - entity: media_player.sts_samsung_q90_porch
            attribute: source
            in: [Fire TV, TV/HDMI]

  watch_smart:
    name: Watch Smart TV
    icon: material:tv
    color: "#e89b17"
    start: script.activity_watch_smart
    view: tv
    confirm_end: true
    context:
      media_player: media_player.sts_samsung_q90_porch
      dpad: remote.sts_samsung_q90_porch
      power: media_player.sts_samsung_q90_porch
      volume: media_player.sts_samsung_q90_porch
      volume_level: media_player.ma_soundbar_porch
      dpad_commands:
        up: KEY_UP
        down: KEY_DOWN
        left: KEY_LEFT
        right: KEY_RIGHT
        select: KEY_ENTER
        back: KEY_RETURN
        home: KEY_HOME
        menu: KEY_MENU
        info: KEY_INFO
        ch_up: KEY_CHUP
        ch_down: KEY_CHDOWN
    controls:
      navigation: $context.dpad
      back: { command: back, entity: $context.dpad }
      home: { command: home, entity: $context.dpad }
      power: { service: media_player.toggle, entity: $context.power }
      volume: $context.volume
    state:
      entities: [media_player.sts_samsung_q90_porch]
      on:
        all:
          - { entity: media_player.sts_samsung_q90_porch, state: "on" }
          - entity: media_player.sts_samsung_q90_porch
            attribute: source
            not_in: [Fire TV, Unknown (HDMI 1), TV/HDMI]

  music:
    name: Listen to Music
    icon: material:music_note
    color: "#1e8a82"
    start: script.activity_music
    stop: script.activity_music_stop
    view: music
    context:
      media_player: media_player.ma_sonos_basement
      power: media_player.ma_sonos_basement
      volume: media_player.ma_sonos_basement
    controls:
      power: { service: media_player.toggle, entity: $context.power }
      volume: $context.volume
    state:
      entities: [media_player.ma_sonos_basement]
      on: { any_state: ["on", playing, paused, buffering] }

  off:
    name: All Off
    icon: material:power_settings_new
    start: script.activity_off
    confirm_end: true

layout:
  columns: 1
  sections:
    - label: Activities
      tiles:
        - { id: act_firetv, activity: watch_firetv }
        - { id: act_music, activity: music }
        - { id: act_smart, activity: watch_smart }

    - label: Presets
      heading: Presets
      columns: 3
      tiles:
        - id: p_netflix
          type: preset
          label: Netflix
          icon: material:movie
          activity: watch_firetv
          action:
            service: media_player.select_source
            target: $context.media_player
            data: { source: Netflix }
        - id: p_ytv
          type: preset
          label: YouTube TV
          icon: material:live_tv
          activity: watch_firetv
          action:
            service: media_player.select_source
            target: $context.media_player
            data: { source: YouTube TV }
        - id: p_dim
          type: preset
          label: Porch 30%
          icon: material:lightbulb
          action:
            service: light.turn_on
            target: light.porch_lights
            data: { brightness_pct: 30 }

    - label: Devices
      heading: Devices
      tiles:
        - id: grp_hvac
          type: group
          label: HVAC & Lights
          icon: material:layers
          target: comfort
          entities:
            - climate.room_air_conditioner
            - light.porch_lights
            - light.remote_3_button_backlight
            - cover.maestroscreen_04_fr
