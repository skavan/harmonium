id: apps
name: Apps
type: library
parent: tv

context:
  media_player: media_player.fire_tv_family_192_168_1_65
  dpad: remote.fire_tv_family_192_168_1_65
  power: media_player.sts_samsung_q90_porch
  volume: media_player.sts_samsung_q90_porch
  volume_level: media_player.ma_soundbar_porch

# DRAWER RULE: on a drawer ALL navigation keys drive the UI — pick a
# tile and it auto-returns; tap-Back escapes without picking. Only
# Power passes through (it still means "the TV"). Arrows/select/back/
# home stay app-side. (Field-settled 2026-07-20: full pass_through
# here re-broke apps nav; device-back on a drawer is a silent trap.)
control_target:
  label: $activity.name
  navigation: $context.dpad
  power: $context.power
  volume: $context.volume
  pass_through: [power]

# The grid is GENERATED from the house app registry (apps.yaml):
# one tile per app launchable on this drawer's $context.media_player
# (override first, else default source in the live source_list).
layout:
  columns: 3
  tiles:
    - id: apps_grid
      type: apps
      # conscious curation: WHICH apps this drawer offers, in order
      include: [netflix, youtube, youtubetv]
