id: music_library
name: Music Library
type: library
parent: music

context:
  media_player: media_player.ma_sonos_basement
  volume: media_player.ma_sonos_basement

# CATEGORIES (v0.31): favorites only, published by the integration as
# sensor.harmonium_music_<category> (hourly from Music Assistant).
# Navigation: the header strip chips jump (touch) · CH▲▼ steps
# categories · MENU tours them (wraps). Playlists/Artists/Albums are
# the default sections; Tracks/Radio are one more section when wanted.
header:
  height: 118px
  min_height: 96px
  show_time: false

layout:
  columns: 3
  sections:
    - label: Playlists
      heading: Playlists
      tiles:
        - id: mq_pull
          type: preset
          activity: music
          icon: material:swap_horiz
          label: Pull Music Here
          action:
            service: music_assistant.transfer_queue
            target: $context.media_player
            data: { auto_play: true }
        - id: m_pl
          type: presets_from
          entity: sensor.harmonium_music_playlists
          attribute: items
          item:
            label: $item.name
            icon_image: $item.image
            icon: material:queue_music
            activity: music
          action:
            service: music_assistant.play_media
            target: $context.media_player
            data: { media_id: $item.uri, media_type: $item.media_type }
    - label: Artists
      heading: Artists
      tiles:
        - id: m_ar
          type: presets_from
          entity: sensor.harmonium_music_artists
          attribute: items
          item:
            label: $item.name
            icon_image: $item.image
            icon: material:person
            activity: music
          action:
            service: music_assistant.play_media
            target: $context.media_player
            data: { media_id: $item.uri, media_type: $item.media_type }
    - label: Albums
      heading: Albums
      tiles:
        - id: m_al
          type: presets_from
          entity: sensor.harmonium_music_albums
          attribute: items
          item:
            label: $item.name
            icon_image: $item.image
            icon: material:album
            activity: music
          action:
            service: music_assistant.play_media
            target: $context.media_player
            data: { media_id: $item.uri, media_type: $item.media_type }
