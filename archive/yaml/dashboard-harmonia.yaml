views:
  - title: Test
    url: test
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr
          grid-template-rows: auto auto auto auto
          gap: 12px 0
          padding: 8px 12px 0 12px
        cards:
          - type: custom:harmonia-room-card
            room_id: porch
            room:
              id: porch
              name: Porch
              activities:
                - id: h-mncj0afv-lgqtt0sg
                  type: watch_tv
                  name: Watch Fire TV
                  color: "#d97b3a"
                  icon_path: entity_picture_auto
                  live_badge_label: Live
                  sub_idle_label: ""
                  confirm_turn_off: true
                  entity_ids:
                    - media_player.fire_tv_family_192_168_1_65
                    - media_player.sts_samsung_q90_porch
                    - button.sts_samsung_q90_porch
                    - remote.sts_samsung_q90_porch
                  primary_entity_id: media_player.fire_tv_family_192_168_1_65
                  state_entity_ids:
                    - media_player.fire_tv_family_192_168_1_65
                    - media_player.sts_samsung_q90_porch
                  state_mode: custom
                  state_on_eval_yaml: >-
                    - entity_id: media_player.sts_samsung_q90_porch
                      equals: "on"
                    - entity_id: media_player.sts_samsung_q90_porch
                      attribute: source
                      in: [Fire TV, TV/HDMI]
                    - display_label: "Live:
                    {{entity[media_player.sts_samsung_q90_porch].attr.source}}"
                  state_off_eval_yaml: |
                    - entity_id: media_player.sts_samsung_q90_porch
                      equals: "off"
                  subtitle_mode: custom
                  subtitle_live_template: >-
                    {{entity[media_player.fire_tv_family_192_168_1_65].attr.source}}
                    | {{entity[media_player.sts_samsung_q90_porch].attr.source}}
                  navigation_path: http://192.168.1.87:8123/tv-control/1
                  devices: []
                  on_start_actions:
                    - action: perform-action
                      perform_action: media_player.select_source
                      target:
                        entity_id: media_player.fire_tv_family_192_168_1_65
                      data:
                        source: Home
                    - action: perform-action
                      perform_action: remote.turn_on
                      target:
                        entity_id: remote.sts_samsung_q90_porch
                    - action: perform-action
                      perform_action: delay
                      data:
                        ms: 5000
                    - action: perform-action
                      perform_action: media_player.select_source
                      target:
                        entity_id: media_player.sts_samsung_q90_porch
                      data:
                        source: Fire TV
                  on_stop_actions:
                    - action: perform-action
                      perform_action: media_player.turn_off
                      target:
                        entity_id: media_player.sts_samsung_q90_porch
